# docker-compose-run-tests.yml — THE WHOLE SUITE, IN CONTAINERS.
#
# Seven services on a private bridge network: `sts`, this repository built
# from its own Dockerfile; `tests`, this repository's suite built from
# tests/Dockerfile with a Chrome in it; `postgres`, the store the two
# persisting modes of tests/tools/modes.sh run on; `openbao` and its two
# one-shot helpers, the secret store; and `xacml-pep`, the remote enforcement
# point one job drives the seam to. The tests container drives the
# service by its compose DNS name and exits with the suite's status;
# ./run-tests.sh brings the pair up with --exit-code-from tests and takes
# them down again.
#
# THE HOST NEEDS DOCKER AND NOTHING ELSE — no node, no npm install, no Chrome,
# no checkout of the parent project. That is why this file existed beside
# ./local-run-tests.sh, the host-run loop that needed all four, and why it is
# the whole suite's only stack since that launcher was removed (2026-09-16):
# #50 compiles part of the service only inside an image build.
#
# ---------------------------------------------------------------------------
# THE COMPOSE FILES IN THIS REPOSITORY, AND WHICH ONE TO REACH FOR.
#
#   docker-compose.yml            an operator's mock: the service plus postgres,
#                                 persisting, on 8081, container `sts`. What
#                                 `docker compose up` in this directory gives.
#   THIS FILE                     ./run-tests.sh — service AND tests in
#                                 containers. What CI runs. ./run-coverage.sh
#                                 runs its `tests` service alone.
#
# There was a third use until 2026-09-16: ./local-run-tests.sh brought
# docker-compose.yml up on a free port as project mock-sts-tests and drove it
# from host processes. That launcher is gone.
#
# They never collide, and that is by construction rather than by luck:
# each run is its own compose PROJECT with its own container names, and this
# one publishes NO PORTS AT ALL (see the `sts` service). A test run must never
# be able to take down, or take the port of, a mock somebody is using.
#
# ---------------------------------------------------------------------------
# WHAT THIS STACK DELIBERATELY DOES NOT HAVE.
#
#   NO PERSISTENCE BETWEEN RUNS — WHICH IS NOT THE SAME AS NO DATABASE, AND
#   THIS BULLET SAID "NO POSTGRES" UNTIL 2026-09-09. It was written when this
#   stack ran once, in `persistence.mode=memory`; tests/tools/modes.sh runs the
#   suite three times now and two of those modes ARE a database. So there is a
#   `postgres` service below, and what the bullet was actually defending is
#   kept by other means: that service has NO VOLUME, so its cluster lives in
#   the container's writable layer and the `down --volumes` between modes takes
#   it with the container. Every mode starts on a database that has never been
#   written to, which is also the only thing that makes postgres/apply-schema.sh
#   run at all — the entrypoint runs it on the start that CREATES a cluster and
#   never again. The one job that would need a database of its own — the parent
#   suite's sts_persistence_postgres.js — is still not vendored here, because it
#   starts one with docker and this container has no docker in it.
#   NO DOCKER IN THE TESTS CONTAINER, AND THAT NOW COSTS A SECOND JOB. Since
#   2026-09-06 tests/vendored/sts_xacml_remote_pep.js builds the xacml-pep image
#   and runs it as a container on the service's network, so it needs a daemon
#   for the same reason that postgres job does. It is marked `docker: true` in
#   tests/vendored/MANIFEST.js and tools/run-report.js reports it SKIPPED here,
#   with the reason and with what is therefore unchecked — amber in the report,
#   <skipped> in the JUnit, a line in the summary. It is never silently green.
#   **What is unchecked here is the remote PEP end to end**: what stands on this
#   stack is tests/xacml_pep.js (that container's modules, in a child process,
#   no HTTP) and sts_xacml_endpoints.js (the three PEP endpoints, with the TEST
#   impersonating a PEP), both one-sided by construction.
#   **THAT SKIP IS NOW THE FALLBACK, NOT THIS STACK'S CASE**: the `xacml-pep`
#   service below is the container, brought up by the launcher, and the job
#   drives it over XACML_PEP_URL — tests/vendored/MANIFEST.js's `docker: true`
#   note says when the skip still happens. (./local-run-tests.sh used to be
#   the only stack that drove the seam; it was removed on 2026-09-16.)
#
#   Mounting the daemon's socket in here would close both gaps and is NOT done
#   on a judgement rather than an oversight: this container carries a Chrome and
#   runs a suite that reconfigures a service, and a docker socket in it is root
#   on the host that runs CI. The two jobs are worth less than that.
#   NO KEYCLOAK, NO walt.id, NO api, NO client. The vendored protocol jobs are
#   exactly the ones a LONE mock can satisfy; that is the rule
#   tests/vendored/MANIFEST.js records and the reason this file has none of the
#   parent project's third-party services.
#   NO PUBLISHED PORTS. See below.
#
# Compose format 2.4, matching docker-compose.yml in this directory: the
# `depends_on: condition:` entries below need it, and docker-compose v1 treats a
# file with no `version:` as the v1 format that has no `healthcheck` at all, and
# this file's whole ordering rests on one. Compose v2 prints "the attribute `version` is obsolete" and
# ignores the line; that warning is the entire cost.
version: '2.4'

services:
  # ---------------------------------------------------------------------------
  # THE STORE THE TWO PERSISTING MODES RUN ON (2026-09-09).
  #
  # tests/tools/modes.sh runs the suite three times and two of those modes are
  # defined by having a database: `product` persists and coordinates (it was
  # `postgres`, the same minus product mode, until 2026-09-21), and
  # `dispatch` adds request workers that COORDINATE THROUGH IT. Until this
  # service existed both of them brought the mock up with STS_PERSISTENCE_MODE
  # set and nothing to connect to, and the mock refused to start — correctly,
  # and naming the store — so two of the three modes ran nothing at all.
  #
  # **IT IS docker-compose.yml's POSTGRES SERVICE WITH THE VOLUME TAKEN OFF,
  # AND THAT IS THE ONE DIFFERENCE THAT MATTERS.** There is nowhere for a
  # cluster to survive to: it lives in the container's writable layer, and
  # ./run-tests.sh runs `down --volumes` between every mode and after
  # the last, so each mode gets a database that has never been written to. That
  # is what this stack's "the second run cannot start from the first run's
  # leavings" rule means once a mode has a store at all — and it is also the
  # only reason the schema is ever built, since the image runs
  # /docker-entrypoint-initdb.d ON THE START THAT CREATES A CLUSTER and never
  # again. A named volume here would give mode 2 a schema, mode 3 mode 2's rows,
  # and the next RUN both.
  #
  # NO PUBLISHED PORT, for the reason the `sts` service gives about 8081 and
  # more sharply: 5432 is the assigned port, and the host most likely to run
  # this stack is a host already running a database on it.
  # ---------------------------------------------------------------------------
  postgres:
    # DIFFERENT FROM docker-compose.yml's `sts-postgres`, so that this run's
    # teardown can never reach the database of a mock somebody is keeping up —
    # the same rule, and the same reason, as the `sts` container name below.
    container_name: ${STS_TEST_POSTGRES_CONTAINER_NAME:-sts-postgres-docker-tests}
    # The host in STS_DATABASE_URL on `sts` below. Not the container name: that
    # one is per project and this one is what the connection string spells.
    hostname: postgres
    # POSTGRES 18 and not -alpine, matching docker-compose.yml: the three
    # scripts below are bash, which the alpine variant does not ship. The
    # major-version-specific data directory that file warns about cannot bite
    # here, because there is no volume to carry an older cluster in.
    image: postgres:18
    environment:
      # The bootstrap superuser: what initdb creates, what the healthcheck
      # probes with, and what runs postgres/schema.sql. The service dials as
      # STS_DB_APP_USER instead — see STS_DATABASE_URL on `sts`.
      - POSTGRES_USER=sts
      - POSTGRES_PASSWORD=sts
      - POSTGRES_DB=sts
      # The application role, created by apply-schema.sh with the rights to
      # change ROWS and not the schema. Spelt here and again in the connection
      # string, which is the duplication docker-compose.yml explains and
      # tests/postgres_schema.js is what notices if only one of them moves.
      - STS_DB_APP_USER=${STS_DB_APP_USER:-sts_app}
      - STS_DB_APP_PASSWORD=${STS_DB_APP_PASSWORD:-sts_app}
    volumes:
      # THE SCRIPTS ONLY. See the header: no data volume, deliberately.
      - ./postgres/generate-tls.sh:/usr/local/bin/generate-tls.sh:ro
      # Turns every `host` rule in pg_hba.conf into `hostssl`, so a plaintext
      # dial is refused rather than merely discouraged.
      - ./postgres/require-tls.sh:/docker-entrypoint-initdb.d/00-require-tls.sh:ro
      # `10-` so it sorts after the TLS hardening. The DDL is mounted OUTSIDE
      # /docker-entrypoint-initdb.d on purpose — the entrypoint runs every
      # *.sql in there itself, with no way to pass the role name and password.
      - ./postgres/apply-schema.sh:/docker-entrypoint-initdb.d/10-apply-schema.sh:ro
      - ./postgres/schema.sql:/usr/local/share/sts/schema.sql:ro
    # The key pair is made BEFORE the server starts, because `ssl_cert_file` is
    # read when it boots and an initdb script runs after that. `exec` so
    # postgres keeps pid 1 and still receives the stop signal.
    command: >
      bash -c '/usr/local/bin/generate-tls.sh &&
      exec docker-entrypoint.sh postgres
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/tls/server.crt
      -c ssl_key_file=/var/lib/postgresql/tls/server.key'
    healthcheck:
      # ACCEPTING CONNECTIONS, not merely started — the `sts` service waits on
      # this, and without the wait a persisting mode is a coin toss between a
      # service that starts and one that refuses to, since a store that cannot
      # be opened is fatal.
      test: ["CMD-SHELL", "pg_isready -U sts -d sts"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ---------------------------------------------------------------------------
  # THE SERVICE UNDER TEST, AND THE POINT IS THAT IT IS THE IMAGE.
  #
  # Built from the repository root's Dockerfile with the committed lock, the
  # pinned node and `.dockerignore` deciding what is in the context — so this
  # run can see the class of failure that a suite running the source out of a
  # developer's node_modules cannot: an uninitialised nested submodule that
  # installs a package with no `main`, a module present in the tree and excluded
  # from the build context, a dependency `omit=dev` quietly did not install.
  # (The service itself, `sts`, is below the secret store's three services.)
  # ---------------------------------------------------------------------------
  # ===========================================================================
  # THE SECRET STORE (2026-09-12), AND IT IS HERE FOR THE SAME REASON POSTGRES
  # IS: THIS FILE IS A SECOND STACK RATHER THAN AN OVERLAY ON THE FIRST.
  #
  # `docker-compose.yml` grew an OpenBao service the same day, and the
  # `dispatch` mode reads its key-encryption key out of it — which is what
  # `tests/tools/modes.sh` sets `STS_KEYS_SOURCE=persisted` for. This file is
  # what CI runs, so a stack without the store would be a CI run that could not
  # start that mode at all, and the feature would be covered only on a
  # developer's machine.
  #
  # The three services and their argument are docker-compose.yml's, and the
  # duplication is this file's existing bargain — it carries its own postgres
  # and its own sts for the same reason. `openbao/CLAUDE.md` is where the
  # design is argued; neither copy repeats it.
  # ===========================================================================
  openbao-tls:
    container_name: ${STS_BAO_TLS_CONTAINER_NAME:-sts-docker-tests-openbao-tls}
    image: ${STS_IMAGE:-rcbj/sts}
    build:
      context: .
    restart: "no"
    environment:
      - STS_BAO_TLS_DIR=/openbao/file/tls
      - STS_BAO_TLS_NAMES=${STS_BAO_TLS_NAMES:-openbao,localhost}
      - STS_BAO_TLS_IPS=${STS_BAO_TLS_IPS:-127.0.0.1}
    volumes:
      - sts-bao-file:/openbao/file
      - ./openbao/generate-tls.js:/usr/src/sts/openbao/generate-tls.js:ro
    command: ["node", "openbao/generate-tls.js"]

  openbao:
    container_name: ${STS_BAO_CONTAINER_NAME:-sts-docker-tests-openbao}
    hostname: openbao
    image: openbao/openbao:${OPENBAO_TAG:-latest}
    depends_on:
      openbao-tls:
        condition: service_completed_successfully
    cap_add:
      - IPC_LOCK
    environment:
      - BAO_STATIC_SEAL_CURRENT_KEY_ID=${STS_BAO_SEAL_KEY_ID:-sts}
      - BAO_STATIC_SEAL_CURRENT_KEY=${STS_BAO_SEAL_KEY:-KSVmckTNY246XdLbpfIzGbuXvgZqAOPzsrF4itdFTvo=}
    volumes:
      - ./openbao/bao.hcl:/openbao/config/bao.hcl:ro
      - sts-bao-file:/openbao/file
    command: ["server", "-config=/openbao/config/bao.hcl"]
    healthcheck:
      test: ["CMD-SHELL", "bao status -address=https://127.0.0.1:8200 -ca-cert=/openbao/file/tls/server.crt >/dev/null 2>&1 || test -f /openbao/file/seed/root.token"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  openbao-seed:
    container_name: ${STS_BAO_SEED_CONTAINER_NAME:-sts-docker-tests-openbao-seed}
    image: ${STS_IMAGE:-rcbj/sts}
    build:
      context: .
    restart: "no"
    depends_on:
      openbao:
        condition: service_started
    environment:
      - STS_BAO_ADDR=https://openbao:8200
      - STS_BAO_CA_FILE=/openbao/file/tls/server.crt
      - STS_BAO_POLICY_FILE=/usr/src/sts/openbao/read-only.hcl
      - STS_BAO_CLIENT_CN=${STS_BAO_CLIENT_CN:-sts}
      - STS_DB_APP_PASSWORD=${STS_DB_APP_PASSWORD:-sts_app}
    volumes:
      - sts-bao-file:/openbao/file
      - sts-bao-client:/openbao/client
      - ./openbao/seed.js:/usr/src/sts/openbao/seed.js:ro
      - ./openbao/read-only.hcl:/usr/src/sts/openbao/read-only.hcl:ro
    command: ["node", "openbao/seed.js"]

  sts:
    # Named, so that a `docker logs` while a run is going has something to name,
    # and DIFFERENT from docker-compose.yml's `sts` so that a test run can never
    # touch a mock somebody left up. Overridable for a CI agent running two
    # workspaces at once.
    container_name: ${STS_CONTAINER_NAME:-sts-docker-tests}
    # The name the tests container dials, and the one in the certificate's SANs
    # (`tls.hostnames` in common/config.js: localhost, sts, sts-mock,
    # sts.example.com). A different hostname here would be a certificate error in
    # every job that verifies one.
    hostname: sts
    # A TAG OF ITS OWN WHEN A RUN NAMES ONE (2026-09-14): an image tag is
    # machine-wide, as docker-compose.yml's `sts` argues. Unset is unchanged.
    image: ${STS_IMAGE:-rcbj/sts}
    # ---------------------------------------------------------------------
    # THE SECONDARY ADDRESSES THE PER-REALM SPIFFE LISTENERS BIND
    # (2026-09-12), and the reason this stack needs them as much as
    # docker-compose.yml does: the runner container is ON this network, so a
    # protocol job can dial a realm's Workload API at the address that realm
    # was configured with. Nothing is published to the host — a published port
    # maps to ONE container address, so it would answer for one realm and
    # silently not for the others.
    #
    # `NET_ADMIN` is what adding an address to an interface needs. A failure is
    # printed and the service starts anyway, for the reason every listener here
    # follows.
    # ---------------------------------------------------------------------
    cap_add:
      - NET_ADMIN
    networks:
      default:
        ipv4_address: ${STS_ADDRESS:-172.30.0.10}
    command: >
      sh -c 'IFACE="$$(ip -o -4 route show to default | awk "{print \$$5}" | head -1)";
      for CIDR in $$STS_EXTRA_IPS; do
      if ip addr add "$$CIDR" dev "$$IFACE" 2>/dev/null; then
      echo "sts: added $$CIDR to $$IFACE for a realm SPIFFE listener";
      else
      echo "sts: COULD NOT add $$CIDR to $$IFACE — a realm configured to bind
      it will report that its listener did not come up."; fi; done;
      exec node server.js'
    build:
      # The repository root, and the root .dockerignore applies. The tests
      # image is built from the same context with the same ignore file, so the
      # SERVICE image carries no tests because the root Dockerfile removes
      # them; see that file and tests/Dockerfile.
      context: .
      # THE BUILD'S IDENTITY, both optional and both empty by default — the
      # same two arguments docker-compose.yml passes, and that file carries the
      # argument for them. They are here so that a CI run of this stack can
      # stamp its image with the run number and the commit, which is the
      # environment where "which build produced this report" is asked most and
      # answerable least. Leave them and the build number is the UTC build
      # instant, which is still unique per build.
      args:
        BUILD_NUMBER: "${BUILD_NUMBER:-}"
        GIT_COMMIT: "${GIT_COMMIT:-}"
    environment:
      # env/docker-tests.js, which exists for this file and says so in its own
      # header. It is env/local.js with a different comment. It was
      # `logLevel: debug` until 2026-09-12 and is `info` now, like every
      # appconfig file in env/, because every function logs its entry and exit
      # at debug; STS_LOG_LEVEL=debug asks for the record back.
      #
      # THAT IS THE DEFAULT FOR THIS FILE DRIVEN DIRECTLY, AND NOT WHAT A
      # ./run-tests.sh RUN GETS: that launcher chooses the file from the
      # log level and passes it in here, which is `info` and env/test.js unless
      # somebody asks for otherwise. The file has to be chosen rather than the
      # level alone, because the vendored modules under common/vendored/ build
      # their loggers from CONFIG_FILE and never see STS_LOG_LEVEL — the
      # launcher's own THE SERVICE'S LOG LEVEL block argues all of it. This
      # file driven by hand is `info` too since 2026-09-12; STS_LOG_LEVEL=debug
      # is the loud way to watch the mock.
      - CONFIG_FILE=${CONFIG_FILE:-./env/docker-tests.js}
      # THE ADDRESSES A REALM'S SPIFFE LISTENERS MAY BIND — see `cap_add` and
      # the `command` above.
      # AND THE DEFAULT REALM BINDS THIS CONTAINER'S OWN ADDRESS RATHER THAN
      # THE WILDCARD (2026-09-12). `spiffe.grpcHost` defaults to 0.0.0.0,
      # which is EVERY address on the machine — so the default realm's
      # Workload API port would be taken on all three addresses above and
      # a realm given one of them fails to bind with `EADDRINUSE` on an
      # address nothing appears to be using. Measured, and then fixed in
      # two places: `spiffe_server.js` recognises the wildcard and names
      # the realm holding it, and this line stops it happening.
      - STS_SPIFFE_GRPC_HOST=${STS_SPIFFE_GRPC_HOST:-172.30.0.10}
      - STS_EXTRA_IPS=${STS_EXTRA_IPS:-172.30.0.11/24 172.30.0.12/24 172.30.0.13/24}
      # THE BARE FORM IS LOAD-BEARING and the obvious alternative breaks the
      # container. With no `=`, compose passes this through ONLY if the shell
      # that ran the launcher has it, and leaves it unset otherwise, so the
      # appconfig file's own level applies when nobody asked for anything.
      # Written `STS_LOG_LEVEL=${STS_LOG_LEVEL:-}` it would be set to the EMPTY
      # STRING instead, and bunyan throws `unknown level name: ""` from
      # config.js at require time — so the service never listens and the run
      # reports a healthcheck timeout rather than anything naming a log level.
      # `docker compose config` tells the two apart: bare renders null.
      - STS_LOG_LEVEL
      # THE MANAGEMENT API'S CLIENT SECRET, PINNED BY THE LAUNCHER (2026-09-09).
      #
      # `/admin-api` requires an access token minted by the seeded
      # `sts-management-api` client, whose secret is otherwise generated at
      # every start and readable only THROUGH the API it unlocks. The launcher
      # generates one per run and passes it here; `./run-tests.sh` then
      # mints a token against this container once per mode.
      #
      # BARE, for the reason STS_LOG_LEVEL above is bare — though the stakes
      # are the opposite way round here. An empty value is harmless (it means
      # "mint one per start", which is the default), so what the bare form
      # buys is that `docker compose -f this up` by hand behaves exactly as it
      # did before this line existed.
      - ADMIN_API_CLIENT_SECRET
      # NOT A TUNING CHOICE. A suite that persisted would be a suite whose
      # second run started from the first run's leavings, which is the failure
      # that looks like a flaky test and is not one.
      #
      # THE MODE MATRIX DECIDES THIS NOW. It was hardcoded `memory`, which was
      # right while there was one run; tests/tools/modes.sh runs the suite three
      # times and this is one of the settings it varies. The default keeps a
      # hand-run of this file behaving as it did.
      #
      # **THE SENTENCE THAT USED TO FOLLOW WAS "it is also why there is no
      # postgres service in this file and no volume on this one", AND HALF OF
      # IT SURVIVED THE MATRIX.** The volume is still refused and the service
      # is not: the leavings this is defending against are the PREVIOUS RUN'S,
      # and a database container with no volume in it cannot have any. See the
      # `postgres` service above.
      #
      # **`global.mode`, FORWARDED SINCE 2026-09-21 — AND IT WAS NOT BEFORE.**
      # tests/tools/modes.sh has named `STS_MODE=development` in every arm since
      # 2026-09-08, and this file never passed it to the container, so that
      # line was a no-op that happened to agree with the setting's default.
      # Nothing could notice while every mode wanted development. The `product`
      # mode is the first that does not, and without this line it would have
      # run the development service and been reported as product mode passing.
      # `sts2` in the cluster layer `extends` this service, so it gets it too.
      - STS_MODE=${STS_MODE:-development}
      # AND THE OTHER TWO tests/tools/modes.sh NAMED AND THIS FILE DROPPED
      # (2026-09-21), found the same way: the `product` mode's
      # STS_CLUSTER_MODE=off never arrived, `cluster.mode` stayed `auto`, and
      # auto is ACTIVE-PASSIVE in product mode on postgres — so the mode ran
      # the cluster's membership and fail-stop, and under the SCIM bulk load a
      # starved heartbeat fenced a write and the node exited (STS-CLUSTER-0011).
      # The fallbacks are the settings' own defaults, so a hand-run of this file
      # is unchanged; the cluster layer sets its own values over these.
      - STS_CLUSTER_MODE=${STS_CLUSTER_MODE:-auto}
      - STS_PROXY_PROTOCOL=${STS_PROXY_PROTOCOL:-off}
      # WHAT A PRODUCT-MODE STACK IS GIVEN AND A DEVELOPMENT ONE IS NOT
      # (2026-09-21) — set by ./run-tests.sh for the `product` mode only; see
      # its "THE `product` MODE" block. The base URL is empty (learnt from
      # requests) unless set; the two Kerberos passwords are BARE, so a mode
      # that does not set them passes nothing and keeps the fixture defaults.
      - STS_PUBLIC_BASE_URL=${STS_PUBLIC_BASE_URL:-}
      - KRB5_KRBTGT_PASSWORD
      - KRB5_SERVICE_PASSWORD
      - STS_PERSISTENCE_MODE=${STS_PERSISTENCE_MODE:-memory}
      - STS_PERSISTENCE_COORDINATE=${STS_PERSISTENCE_COORDINATE:-false}
      - STS_WORKERS_REQUEST_COUNT=${STS_WORKERS_REQUEST_COUNT:-0}
      - STS_WORKERS_SURFACE_COUNT=${STS_WORKERS_SURFACE_COUNT:-0}
      - STS_WORKERS_DISPATCH=${STS_WORKERS_DISPATCH:-}
      - STS_WORKERS_READ_YOUR_WRITE=${STS_WORKERS_READ_YOUR_WRITE:-false}
      # THE PWNED PASSWORDS SCREEN IS OFF IN EVERY SUITE STACK (#62 P6): on,
      # a product-mode stack would send the prefix of every password the
      # suite sets to api.pwnedpasswords.com — a run that depends on the
      # internet, and a fixture password that happens to be breached would be
      # refused. The screen is held in process with the API stubbed
      # (tests/breached_passwords.js).
      - STS_RISK_BREACH_CHECK=${STS_RISK_BREACH_CHECK:-off}
      # WHERE THE TWO PERSISTING MODES DIAL, and it is `sts_app` rather than
      # the owner: postgres/schema.sql builds a role with SELECT, INSERT,
      # UPDATE and DELETE on the rows and no CREATE anywhere, so this service
      # cannot change the schema of the store it persists to. The same string
      # docker-compose.yml uses, spelt again here for the reason that file
      # gives — a connection string is one string and compose cannot build it
      # from the parts.
      #
      # `sslmode=require` IS NOT DECORATION. postgres/require-tls.sh rewrites
      # every `host` rule in pg_hba.conf to `hostssl`, so a plaintext dial is
      # REFUSED by that container — and the service says so at startup when the
      # string does not ask for TLS, which is a warning printed just before a
      # connection failure that reads as something else.
      #
      # Ignored entirely in `memory` mode, where nothing opens a store.
      # NO PASSWORD IN THIS STRING (2026-09-12): it comes from the secret
      # store above, like docker-compose.yml's. The service dials the same
      # database as the same role either way.
      - STS_DATABASE_URL=${STS_DATABASE_URL:-postgres://sts_app@postgres:5432/sts?sslmode=require}
      - STS_KEYS_KEK_PROVIDER=${STS_KEYS_KEK_PROVIDER:-vault}
      - STS_KEYS_KEK_VAULT=${STS_KEYS_KEK_VAULT:-https://openbao:8200}
      - STS_KEYS_KEK_REF=${STS_KEYS_KEK_REF:-secret/data/sts}
      - STS_KEYS_KEK_FIELD=${STS_KEYS_KEK_FIELD:-kek}
      - STS_KEYS_VAULT_CLIENT_CERT=${STS_KEYS_VAULT_CLIENT_CERT:-/run/secrets/bao/client.crt}
      - STS_KEYS_VAULT_CLIENT_KEY=${STS_KEYS_VAULT_CLIENT_KEY:-/run/secrets/bao/client.key}
      - STS_KEYS_VAULT_CA_CERT=${STS_KEYS_VAULT_CA_CERT:-/run/secrets/bao/bao-ca.crt}
      - STS_DATABASE_PASSWORD_PROVIDER=${STS_DATABASE_PASSWORD_PROVIDER:-vault}
      - STS_DATABASE_PASSWORD_FIELD=${STS_DATABASE_PASSWORD_FIELD:-databasePassword}
      # Per mode, from tests/tools/modes.sh: `persisted` in `dispatch`, which
      # is what makes the key-encryption key really come out of the store.
      # BARE, so that an unset variable leaves the setting at whatever the
      # mode's own default is rather than pinning it to the empty string.
      - STS_KEYS_SOURCE
      # TLS ON THE MAIN PORT (2026-08-30), so that the suite drives the mock
      # over the scheme every stack in this ecosystem drives it over. It was
      # http here and https in the parent project's three compose files, which
      # is the difference this launcher exists to eliminate: a run green here
      # and red over there is supposed to be a difference in the ENVIRONMENT,
      # and a different scheme made it a difference in the service.
      #
      # WHAT IT COSTS THE RUNNER is one certificate it cannot know in advance —
      # this service issues it under a Root it generates at start (each mode's
      # stack is new), so no image, CA bundle or browser profile can hold an
      # anchor for it. run-report.js
      # fetches it once the service answers and hands every protocol job
      # NODE_EXTRA_CA_CERTS and STS_SPKI_PIN; see tests/tools/trust.js.
      #
      # A substitution, so `STS_HTTPS=false ./run-tests.sh` runs the
      # whole suite against a plain port — which is the first thing to try if a
      # job fails with something that names a certificate.
      - STS_HTTPS=${STS_HTTPS:-true}
      # WHERE A CERTIFICATE SAYS ITS CRL AND OCSP RESPONDER ARE (2026-09-13).
      # This stack publishes no port, and the runner beside it dials the
      # service as `sts` — so that is the name every certificate has to carry,
      # or `sts_pki_distribution_points` follows a URL naming `localhost` from
      # inside the RUNNER's container and reaches nothing. Plain HTTP on 8082,
      # the revocation listener, whatever STS_HTTPS says about the main port.
      # The LDAP port needs no mapping: the runner reaches 389 on the bridge.
      - PKI_DISTRIBUTION_BASE_URL=${PKI_DISTRIBUTION_BASE_URL:-http://sts:8082}
      - PKI_DISTRIBUTION_LDAP_HOST=${PKI_DISTRIBUTION_LDAP_HOST:-sts}
    # NO `ports:`, DELIBERATELY. Everything that talks to this service is on the
    # bridge with it, so publishing would buy nothing and cost the two things a
    # test stack must not cost: a run would fail to start whenever a dev stack
    # already held 8081, and a run that DID bind it would be reachable from
    # outside while it is being reconfigured by the admin jobs. `docker compose
    # -f docker-compose-run-tests.yml run --service-ports sts` is the way to
    # look at one by hand.
    # THE DATABASE MUST BE ACCEPTING CONNECTIONS BEFORE THIS STARTS, in the two
    # modes that have one: a configured store that cannot be opened does not
    # make this service log and carry on, it makes it REFUSE TO START. This is
    # one of the things in this file that need compose format 2.4's
    # `condition:`, which is the format the header keeps for the healthcheck
    # anyway.
    #
    # IT COSTS `memory` MODE A DATABASE IT NEVER DIALS, and that is deliberate
    # rather than overlooked. ./local-run-tests.sh (removed 2026-09-16)
    # suppressed it on its own stack with `--no-deps`, which worked because that
    # launcher started exactly one service; this one also runs `up` over the
    # whole file to start the runner, so the same suppression would have to be
    # a hand-written list of services that goes stale the moment one is added.
    # A database nothing connects to is a few seconds and no behaviour —
    # STS_PERSISTENCE_MODE is what decides whether this service opens a
    # store, and in `memory` it opens none.
    depends_on:
      postgres:
        condition: service_healthy
      # SEEDED, not merely running — docker-compose.yml's line and its reason.
      openbao-seed:
        condition: service_completed_successfully
    volumes:
      # WHAT THE STORE ISSUED THIS SERVICE: the client certificate it
      # authenticates with, its key, and the CA that signs the store's own
      # listener. Read-only, and the identity they carry can read two values
      # and change nothing.
      - sts-bao-client:/run/secrets/bao:ro
      # A DIRECTORY SHARED WITH THE RUNNER (#171). A job that runs a push
      # listener of its own makes a CA at run time and writes the CA's
      # CERTIFICATE here, then names it in a `…CaFile` setting so the service
      # VERIFIES that listener: product mode ignores every
      # `…SkipTlsVerification`, and a CA file is a path on this container's
      # filesystem. Nothing is committed and no key is ever written here.
      # tests/vendored/outbound_test_ca.js argues it; the runner mounts the
      # same volume below. The cluster file's `sts2` inherits it through
      # `extends`. Read-only on this side.
      - sts-test-shared:/run/sts-test:ro
    healthcheck:
      # The scheme follows the mode in this service — oauth2.rfc9700 derives
      # global.https — so the probe decides which module to use the same way
      # config.js does rather than assuming http. `rejectUnauthorized: false`
      # because the certificate is regenerated on every start and nothing can
      # have an anchor for it: liveness is this check's question, not trust.
      test: ["CMD-SHELL", "node -e \"var tls=process.env.STS_HTTPS==='true'||(process.env.STS_HTTPS===undefined&&(process.env.STS_OAUTH2_RFC9700==='true'||process.env.STS_OAUTH2_OAUTH21==='true'));var m=tls?require('https'):require('http');m.get({host:'localhost',port:8081,path:'/healthcheck',rejectUnauthorized:false},function(r){process.exit(r.statusCode===200?0:1)}).on('error',function(){process.exit(1)})\""]
      interval: 5s
      timeout: 5s
      retries: 24
      # The image starts node, loads every protocol family and generates a
      # signing key before it listens. Two minutes of retries is generous on
      # purpose: a CI runner building two images at once is slower than any
      # developer's machine, and a healthcheck that gives up early fails the
      # run with "unhealthy" rather than with anything about what went wrong.
      start_period: 10s

  # ---------------------------------------------------------------------------
  # THE REMOTE XACML POLICY ENFORCEMENT POINT, AND THE ONLY THING IN THIS FILE
  # THAT IS NOT THE SERVICE OR THE SUITE.
  #
  # It is here because `tests/vendored/sts_xacml_remote_pep.js` cannot assert
  # what it exists to assert without it: a SECOND CONTAINER, on this network,
  # holding its own copy of the XACML engine, pulling policy from the service
  # above and enforcing it where that service cannot see. The job drives this
  # container over HTTP by the hostname below; it does not create it, because
  # the tests container has no docker in it and is not going to get any (see
  # WHAT THIS STACK DELIBERATELY DOES NOT HAVE, above).
  #
  # **IT POINTS AT A REALM THAT DOES NOT EXIST WHEN IT STARTS, AND THAT IS THE
  # ARRANGEMENT RATHER THAN A DEFECT.** `pep-e2e` is created by that job, minutes
  # into the run, and removed by it at the end — which is how the job gets a
  # repository whose whole contents it wrote without disturbing the realm every
  # other job is using. So this container comes up, fails to register, fails to
  # pull, says so, and goes on trying: `xacml-pep/sync.js` retries its
  # registration on the poll timer, so it converges on a console row the same
  # way it converges on policy. That retry exists BECAUSE of this ordering and
  # its own header argues why it is right independently of this file.
  #
  # A CLIENT CERTIFICATE THE LAUNCHER MINTS AND MOUNTS (see PEP_TLS_CERT
  # below), so it registers AUTHENTICATED and the job leaves the realm at its
  # defaults. This paragraph used to say the opposite — no certificate, and the
  # job turning `xacml.pepRequireCertificate` off — which is still what the
  # shipped `docker-compose.yml` does by hand. `sts_xacml_endpoints.js` also
  # presents a real certificate over a real handshake, and one claiming to be
  # somebody else.
  # ---------------------------------------------------------------------------
  xacml-pep:
    container_name: ${XACML_PEP_CONTAINER_NAME:-xacml-pep-docker-tests}
    # The name the tests container dials AND the name the service nudges. Both
    # resolve on this bridge and neither is published anywhere.
    hostname: xacml-pep
    image: ${XACML_PEP_IMAGE:-rcbj/xacml-pep}
    build:
      # The repository root, because xacml-pep/Dockerfile copies the seven
      # engine modules out of xacml/ at build time — so this image cannot drift
      # from the evaluator the service in this same stack is running. That is
      # the whole argument of xacml-pep/CLAUDE.md, and building it HERE is what
      # makes this stack able to catch a module added to engine.js and not to
      # that Dockerfile: the container dies at load and the job says so.
      context: .
      dockerfile: xacml-pep/Dockerfile
      # THE BUILD'S IDENTITY, exactly as the sts service above takes it. Pass
      # the SAME BUILD_NUMBER to both to say the PDP and this PEP are one
      # release; leave them and each image gets the instant it was built, which
      # is two different numbers for two artifacts and is the honest default.
      args:
        BUILD_NUMBER: "${BUILD_NUMBER:-}"
        GIT_COMMIT: "${GIT_COMMIT:-}"
    depends_on:
      sts:
        condition: service_healthy
    volumes:
      # The launcher writes pep.crt and pep.key here between bringing the
      # service up and starting this container — see ./run-tests.sh,
      # which does it with `docker run` against the service image so that the
      # host still needs docker and nothing else.
      - ${XACML_PEP_CERT_DIR:-./xacml-pep/common}:/certs:ro
    environment:
      # BY COMPOSE DNS AND THE INTERNAL PORT, never a published one — nothing
      # in this stack publishes anything. `sts` is in the certificate's SANs.
      - PEP_PDP_URL=${XACML_PEP_PDP_URL:-https://sts:8081/realm/pep-e2e}
      - PEP_NAME=${XACML_PEP_NAME:-xacml-pep}
      # THE CLIENT CERTIFICATE ./run-tests.sh MINTS AND MOUNTS. The
      # three /xacml/pep endpoints require a verified one whose DN holds
      # REMOTE_PEPS; without these two this container registers as nothing and
      # is refused, which is what a `docker compose -f this up` by hand gets.
      - PEP_TLS_CERT=${XACML_PEP_TLS_CERT:-}
      - PEP_TLS_KEY=${XACML_PEP_TLS_KEY:-}
      # THE HTTPS LISTENER'S PAIR (2026-09-13). The files do not exist when this
      # container starts: sts_xacml_remote_pep.js issues the pair through
      # /admin-api/xacml/issue-pep-certificate once this PEP has registered in
      # the realm the job creates, and writes it into `server/` under the
      # mounted directory — which the tests container sees too, under
      # tests/report — and the PEP picks it up on its reload interval.
      - PEP_HTTPS_CERT=${XACML_PEP_HTTPS_CERT:-}
      - PEP_HTTPS_KEY=${XACML_PEP_HTTPS_KEY:-}
      - PEP_HTTPS_PORT=9443
      - PEP_HTTPS_RELOAD_INTERVAL_MS=1000
      # The service's certificate is issued under a Root generated when this
      # stack starts, so there is no anchor any image could hold. `pep.js` logs this on every start
      # rather than once, for federation_http.ts's reason.
      - PEP_TLS_INSECURE=true
      # THE ADDRESS THE SERVICE NUDGES, and it is deliverable in this stack
      # once the job turns xacml.pepNotifyAllowHttp on in its realm — which
      # is the one place this repository's third outbound request is dialled at
      # a listener that answers. Until it does, the service refuses to dial a
      # plain-http URL and says so on the row, which the job asserts first. In
      # product mode plain http stays refused (#171): the job asserts that and
      # puts its own realm in development mode for the delivery.
      - PEP_NOTIFY_URL=${XACML_PEP_NOTIFY_URL:-http://xacml-pep:9090/notify}
      - PEP_RESOURCE=${XACML_PEP_RESOURCE:-https://example.test/records}
      - PEP_BIAS=${XACML_PEP_BIAS:-deny-biased}
      # THE REMOTE POLICY INFORMATION POINT (2026-09-06). On by default:
      # this PEP resolves designators the request did not carry against
      # the mock's embedded directory, through POST /xacml/pip, in one
      # batched query before each evaluation — so a policy reading
      # employeeType off a person's entry decides HERE the way it decides
      # at the PDP. Set it false to watch the old behaviour, where every
      # attribute has to be asserted in the request and the two
      # enforcement points legitimately disagree. A container with no
      # PEP_TLS_CERT reaches that state anyway, because the endpoint
      # requires a verified certificate holding REMOTE_PEPS.
      - PEP_PIP=${XACML_PEP_PIP:-true}
      # SHORT, because the job MEASURES against this interval: it converges by
      # polling with the nudge refused, then turns the nudge on and asserts the
      # next change lands in a fraction of it. The shipped fifteen seconds
      # would make that comparison a minute of waiting.
      - PEP_POLL_INTERVAL_MS=${XACML_PEP_POLL_INTERVAL_MS:-5000}
      - PEP_HEARTBEAT_INTERVAL_MS=${XACML_PEP_HEARTBEAT_INTERVAL_MS:-2000}
      # THE BACKOFF CAP (2026-09-21): the PEP starts minutes before its job
      # creates the realm it polls, and that job leaves the realm's remote-PEP
      # endpoints off, so it is refused (404, then 501) for most of a run. It
      # backs off while refused; the cap is well under the forty seconds the
      # job waits for the PEP to find its realm once it exists.
      - PEP_BACKOFF_MAX_MS=${XACML_PEP_BACKOFF_MAX_MS:-15000}
      - PEP_LOG_LEVEL
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get({host:'localhost',port:9090,path:'/healthcheck'},function(r){process.exit(r.statusCode===200?0:1)}).on('error',function(){process.exit(1)})\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # ---------------------------------------------------------------------------
  # THE SUITE. Every job — the in-process half and the protocol half,
  # including the Selenium admin-console one — run by
  # tests/run-tests-in-container.sh against the service above.
  # NO COUNT IS WRITTEN HERE. tests/vendored/MANIFEST.js and tests/run.js's
  # own discovery are the two answers, and the number that used to be on
  # this line was wrong within a fortnight of being written.
  # ---------------------------------------------------------------------------
  tests:
    container_name: ${STS_TESTS_CONTAINER_NAME:-mock-sts-test-runner}
    image: ${STS_TESTS_IMAGE:-rcbj/mock-sts-tests}
    build:
      # The same context as the service, with the root .dockerignore deciding
      # what is in it — see tests/Dockerfile's header for why the two images
      # share one ignore file and the service image removes what it must not
      # carry.
      context: .
      dockerfile: tests/Dockerfile
    environment:
      # Where the service is. The image defaults this to the same value; both
      # exist so that a hand-run `docker run` on this network needs no
      # environment and a rename needs one edit.
      # https since 2026-08-30, matching STS_HTTPS on the service above. The
      # two are set independently and must agree: this is the URL every job is
      # handed, and a scheme mismatch reaches a test as a closed socket that
      # names nothing.
      - STS_TEST_SERVICE_URL=${STS_TEST_SERVICE_URL:-https://sts:8081}
      # ---------------------------------------------------------------------
      # THE DIRECTORY'S OWN SOCKET, FOR THE ONE JOB THAT DRIVES IT (2026-09-06).
      #
      # `tests/vendored/sts_directory_bulk_load_ldap.js` writes five thousand
      # people over RFC 4511 on TCP 389, and this stack publishes NOTHING —
      # which costs it exactly nothing here, because this runner is a container
      # on the bridge with the service and reaches the port directly. That is
      # the same reason XACML_PEP_URL below names a container and not a
      # published port.
      #
      # **./local-run-tests.sh had to work harder for this, until it was
      # removed (2026-09-16).** Its runner was a host process, so the socket
      # had to be published — and `docker-compose.yml` deliberately does not
      # publish it, because 389 is the assigned LDAP port and the host most
      # likely to want a mock directory is a host already running slapd. That
      # launcher layered `tests/docker-compose-ldap.yml` with a free host port.
      # Here one line does it.
      #
      # `sts` is the hostname of the service in this file and 389 is the
      # container-side port it binds as root.
      - STS_LDAP_URL=${STS_LDAP_URL:-ldap://sts:389}
      # Passed to run-report.js, split by the entrypoint. `STS_TEST_ARGS=
      # "--only=crypto --no-browser" ./run-tests.sh` is the way to
      # narrow a containerized run; unset, the whole suite runs.
      - STS_TEST_ARGS=${STS_TEST_ARGS:-}
      # ONE REPORT TREE PER MODE, so three runs do not overwrite each other. The
      # mode matrix sets it; unset, run-report.js's own default applies.
      - STS_TEST_REPORT_DIR=${STS_TEST_REPORT_DIR:-}
      # The suite's own bunyan level (the jobs', not the service's). Bare, for
      # the same reason STS_LOG_LEVEL is bare on the service above.
      - LOG_LEVEL
      # ---------------------------------------------------------------------
      # THE REMOTE PEP THIS STACK BRINGS UP, HANDED TO THE ONE JOB THAT DRIVES
      # IT. Three variables and they are one answer split three ways: where it
      # is, what it registered as, and which realm it polls. The job REQUIRES
      # all three together — a URL with no realm would have it asserting
      # against a container pointed somewhere else — and without them it falls
      # back to building and starting a container of its own, which is what a
      # hand-run `node tests/tools/run-report.js` does and needs a docker
      # daemon for.
      #
      # `xacml-pep:9090` and not a published port: nothing in this stack
      # publishes anything, and the tests container is on the bridge with it.
      # ---------------------------------------------------------------------
      - XACML_PEP_URL=${XACML_PEP_URL:-http://xacml-pep:9090}
      # ---------------------------------------------------------------------
      # AND ITS HTTPS LISTENER (2026-09-13): where the job dials it once it
      # has issued the pair, and where it writes that pair. The directory is
      # the PEP's `/certs/server` seen from HERE — ./tests/report is mounted
      # below and the launcher's credential directory is inside it — which is
      # the only way a file this container writes reaches that one. Empty in
      # a stack with no launcher, and the job then says why it is skipping
      # the section rather than failing it.
      # ---------------------------------------------------------------------
      - XACML_PEP_HTTPS_URL=${XACML_PEP_HTTPS_URL:-}
      - XACML_PEP_SERVER_CERT_DIR=${XACML_PEP_SERVER_CERT_DIR:-}
      # ---------------------------------------------------------------------
      # WHERE THE SERVICE DIALS BACK INTO THIS CONTAINER (2026-09-12).
      # `sts_gnap_core` runs a listener in the job and has the authorization
      # server POST an RFC 9635 push finish to it; the job's default of
      # `localhost` is the SERVICE's own loopback from inside `sts`, and the
      # push never arrived in any mode. `tests` is this service's name on the
      # bridge. ./run-coverage.sh empties it, because there the service is a
      # child of this container and `localhost` is right.
      # ---------------------------------------------------------------------
      - GNAP_PUSH_HOST=${GNAP_PUSH_HOST:-tests}
      # The shared directory (#171): where this container writes a run-time
      # CA's certificate, and the path the SERVICE reads it at — the same
      # volume, mounted into `sts` at the same place.
      - OUTBOUND_TEST_CA_DIR=${OUTBOUND_TEST_CA_DIR:-/run/sts-test}
      - OUTBOUND_TEST_CA_FILE=${OUTBOUND_TEST_CA_FILE:-/run/sts-test/outbound-test-ca.crt}
      - XACML_PEP_NAME=${XACML_PEP_NAME:-xacml-pep}
      - XACML_PEP_REALM=${XACML_PEP_REALM:-pep-e2e}
      # ---------------------------------------------------------------------
      # THE PEP'S ROOT CA AS TEXT, AND IT NEVER ARRIVED UNTIL 2026-09-09.
      #
      # `./run-tests.sh` has been putting this in its compose
      # environment since the anchor existed, and this file never named it —
      # so compose dropped it and the variable reached the runner in
      # ./local-run-tests.sh alone (removed 2026-09-16), where the runner was
      # a host process that inherited the shell. The job says so rather than
      # failing ("XACML_PEP_CA_PEM is not set, so this job cannot put the PEP
      # back"), which is exactly why nobody noticed: it degrades in the launcher
      # CI runs and works in the one a developer runs.
      #
      # What it is for: the truststore is a Map in the service's process and
      # `POST /tls/trust/clear` needs no credential, so any job may empty it.
      # The job that DEPENDS on this anchor re-establishes it, and it travels
      # as text because the runner container cannot see the directory the PEP
      # mounts its certificate from.
      - XACML_PEP_CA_PEM=${XACML_PEP_CA_PEM:-}
      # ---------------------------------------------------------------------
      # THE MANAGEMENT API'S ACCESS TOKEN (2026-09-09), minted by the launcher
      # once per mode against the service in this stack and handed to every job
      # by run-report.js. Twenty-odd jobs drive `/admin-api`, which requires
      # one; without it they would each report a 401 and the report would name
      # twenty problems instead of one.
      #
      # PER MODE, because a token is signed by a key this service regenerates
      # on every start and this stack is torn down between modes.
      # ---------------------------------------------------------------------
      - STS_ADMIN_API_TOKEN=${STS_ADMIN_API_TOKEN:-}
      # ---------------------------------------------------------------------
      # AND THE SECRET THAT MINTED IT, WHICH IS NOT THE SAME THING AND IS
      # NEEDED BY EXACTLY ONE JOB. `sts_admin_api_auth` drives the gate rather
      # than passing through it: it asks the token endpoint for tokens this run
      # was NOT given — one scope at a time, and one audienced elsewhere — and
      # a token cannot be narrowed after it is signed, so the run's own is no
      # use to it. It needs the seeded client's secret, which the launcher pins
      # per run as `adminApi.clientSecret` and passes to the service beside
      # this.
      #
      # It reached the SERVICE and not the runner until 2026-09-09, so that job
      # failed on the first containerized run with an assertion naming this
      # variable — which is the right report and is the launcher's omission
      # rather than the job's. run-report.js forwards it to the jobs under the
      # `STS_`-prefixed name.
      #
      # BARE, for the reason ADMIN_API_CLIENT_SECRET on the `sts` service is
      # bare: an empty value is what a hand-run of this file has, and that must
      # go on behaving as it did.
      - ADMIN_API_CLIENT_SECRET
    # Chrome crashes tabs on heavy pages when limited to Docker's default 64MB
    # /dev/shm. The console job also passes --disable-dev-shm-usage; this raises
    # the cap as well, because the two mitigations fail differently and the
    # symptom of either is a session that dies mid-page with no message.
    shm_size: '2gb'
    volumes:
      # THE REPORT, OUT ONTO THE HOST. tests/report/ is gitignored and is where
      # ./run-coverage.sh writes too, so every run leaves its report in the
      # same place — including `latest`, which is what CI uploads. Written by
      # root inside the container, which is why the workflow chowns it before
      # the upload step reads it.
      - ./tests/report:/usr/src/sts/tests/report
      # The directory shared with the service (#171) — see `sts` above.
      - sts-test-shared:/run/sts-test
    depends_on:
      sts:
        # The whole ordering of this file. `up` reports success for a container
        # that was created and then exited, so "started" is not the question —
        # a suite that begins against a service which is not listening reports
        # every protocol job as a failure, and they are all one fact.
        condition: service_healthy
      xacml-pep:
        # STARTED RATHER THAN HEALTHY, AND IT IS AN ISOLATION DECISION.
        # `service_healthy` would work — that container listens as soon as its
        # first registration and pull have been ATTEMPTED, and both fail fast
        # against a realm that does not exist yet — but it would mean a PEP
        # image that will not load takes the WHOLE SUITE down with
        # "dependency failed to start", instead of failing the one job that
        # drives it. Every other job must not go red because a container none
        # of them touch is broken. The job waits for it itself, names it, and says
        # to read `docker logs` on it.
        condition: service_started

# ---------------------------------------------------------------------------
# THE SECRET STORE'S TWO VOLUMES, AND THEY ARE THE ONLY NAMED ONES IN THIS FILE
# (2026-09-12).
#
# Every other service here keeps its state in the container: this stack is
# built, run once and thrown away, and postgres starting empty is what a test
# run WANTS. The store is the exception for one reason — the client certificate
# it issues has to reach the service's container, and a volume is how two
# containers share a file.
#
# They are per project, like every other volume compose makes, so two runs on
# one machine do not share a key-encryption key. `run-tests.sh` tears
# them down with `--volumes` at the end of a run.
volumes:
  sts-bao-file:
  sts-bao-client:
  # The run-time CA certificates a job hands the service (#171).
  sts-test-shared:

# One bridge, and nothing published on it. `docker compose` gives the network a
# name from the project, so two projects cannot share one.
#
# **WITH A SUBNET THIS FILE CHOOSES SINCE 2026-09-12**, and a DIFFERENT one
# from docker-compose.yml's: a realm's `spiffe.grpcHost` is a literal address,
# so the addresses have to exist and have to be the same on every start — and
# the two stacks are routinely up at the same moment on a developer's machine,
# which is the one way two fixed subnets can collide.
#
# **A NAME IS NOT AN ADDRESS, AND THE SENTENCE ABOVE READ AS THOUGH IT WERE
# FOR A DAY.** Two projects cannot share a network NAME and can absolutely
# collide on the address space, which is machine-wide: two runs of this
# launcher — a CI agent with two workspaces, the case `STS_DOCKER_TEST_PROJECT`
# exists for — were refused with `invalid pool request: Pool overlaps with
# other one on this address space` before either brought up a container. The
# launcher scans for a free /24 and names all four variables now; the default
# below is the first candidate that scan offers, so nothing moves on an idle
# machine. See freeSubnet() in tests/tools/compose.sh and
# tests/stack_network.js.
networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: ${STS_NETWORK_SUBNET:-172.30.0.0/24}
