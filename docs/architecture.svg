    <text x="307" y="818" font-weight="bold">Certificate trust</text><text x="307" y="836" fill="#52606d">one validation door</text>
    <text x="502" y="818" font-weight="bold">Audit · logging</text><text x="502" y="836" fill="#52606d">per realm; error codes</text>
    <text x="697" y="818" font-weight="bold">Configuration</text><text x="697" y="836" fill="#52606d">five levels, per realm</text>
    <text x="892" y="818" font-weight="bold">Mail</text><text x="892" y="836" fill="#52606d">sending only</text>
    <text x="1087" y="818" font-weight="bold">Metadata · monitoring</text><text x="1087" y="836" fill="#52606d">read off the running service</text>
  </g>

  <!-- ===== Data ===== -->
  <rect x="140" y="876" width="420" height="96" rx="8" fill="#eef2f7" stroke="#7b8794"/>
  <text x="350" y="898" text-anchor="middle" font-weight="bold" font-size="14" fill="#1f2933">Embedded directory</text>
  <text x="350" y="918" text-anchor="middle" fill="#52606d">people · groups · applications · roles · policies</text>
  <text x="350" y="936" text-anchor="middle" fill="#52606d">a tree per trust realm</text>
  <text x="350" y="956" text-anchor="middle" fill="#52606d" font-size="12">views: LDAP, SCIM, the console, /admin-api</text>
  <rect x="640" y="876" width="420" height="96" rx="8" fill="#eef2f7" stroke="#7b8794"/>
  <text x="850" y="898" text-anchor="middle" font-weight="bold" font-size="14" fill="#1f2933">Key material</text>
  <text x="850" y="918" text-anchor="middle" fill="#52606d">signing keys · CA (Root, Intermediate per realm)</text>
  <text x="850" y="936" text-anchor="middle" fill="#52606d">development: new every start</text>
  <text x="850" y="956" text-anchor="middle" fill="#52606d">product: kept, sealed under a key-encryption key</text>

  <g stroke="#3e4c59" stroke-width="1.5" fill="none">
    <path d="M350,972 v28"/><path d="M350,1000 l-5,-8 h10 z" fill="#3e4c59"/>
