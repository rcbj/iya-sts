    <text x="110" y="551">XACML · ALFA</text><text x="266" y="551">AuthZEN</text>
    <text x="422" y="551">GNAP · UMA</text><text x="578" y="551">Risk scoring</text>
    <text x="734" y="551">Attribute sources</text>
  </g>

  <text x="836" y="372" font-weight="bold" fill="#3e4c59">Hosted applications and their APIs</text>
  <g fill="#e8eef9" stroke="#7b93b8">
    <rect x="836" y="382" width="328" height="40" rx="5"/>
    <rect x="836" y="430" width="328" height="40" rx="5"/>
    <rect x="836" y="478" width="328" height="40" rx="5"/>
    <rect x="836" y="526" width="328" height="40" rx="5"/>
    <rect x="836" y="574" width="328" height="40" rx="5"/>
  </g>
  <g fill="#1f2933" font-size="12.5">
    <text x="848" y="400" font-weight="bold">/authn</text><text x="848" y="415" fill="#52606d">sign-in; owns the session · /authn-api</text>
    <text x="848" y="448" font-weight="bold">/admin</text><text x="848" y="463" fill="#52606d">console · /admin-api (machines too)</text>
    <text x="848" y="496" font-weight="bold">/portal</text><text x="848" y="511" fill="#52606d">a person's own pages · /account-api</text>
    <text x="848" y="544" font-weight="bold">/report</text><text x="848" y="559" fill="#52606d">reports · /report-api</text>
    <text x="848" y="592" font-weight="bold">/  /logout  /launch</text><text x="848" y="607" fill="#52606d">front door, sign-out, IdP-initiated links</text>
  </g>
  <text x="36" y="600" fill="#52606d" font-size="12">Each family has a directory of its own; the live list is /admin/sts-metadata.</text>
  <text x="36" y="618" fill="#52606d" font-size="12">The applications are static: drawn in the browser from their API, signed in as public clients with PKCE and DPoP.</text>
  <rect x="36" y="634" width="1128" height="50" rx="6" fill="#fff4e5" stroke="#d9a35b"/>
  <text x="600" y="655" text-anchor="middle" font-weight="bold" fill="#1f2933">Tokens · assertions · tickets · credentials</text>
  <text x="600" y="673" text-anchor="middle" fill="#52606d" font-size="12">every artifact is a projection of the session; every credential accepted is evidence on an authentication event</text>

  <!-- ===== Session ===== -->
  <rect x="20" y="716" width="1160" height="44" rx="8" fill="#fde8d7" stroke="#d98a4e"/>
  <text x="600" y="736" text-anchor="middle" font-weight="bold" fill="#1f2933">Session (authn)</text>
  <text x="600" y="752" text-anchor="middle" fill="#52606d" font-size="12">a subject, its authentication events, a stable sid; one per sign-in, whatever the protocol</text>

  <!-- ===== Shared services ===== -->
  <text x="20" y="788" font-weight="bold" font-size="15" fill="#1f2933">Shared services</text>
  <g fill="#ffffff" stroke="#9aa5b1">
    <rect x="20" y="798" width="185" height="48" rx="6"/><rect x="215" y="798" width="185" height="48" rx="6"/>
