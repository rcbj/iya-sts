    <rect x="660" y="430" width="148" height="40" rx="5"/>
    <rect x="36" y="478" width="148" height="40" rx="5"/><rect x="192" y="478" width="148" height="40" rx="5"/>
    <rect x="348" y="478" width="148" height="40" rx="5"/><rect x="504" y="478" width="148" height="40" rx="5"/>
