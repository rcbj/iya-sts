<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1130" width="1200" height="1130"
     font-family="Helvetica, Arial, sans-serif" font-size="13" role="img"
     aria-labelledby="title desc">
  <title id="title">iya-sts architecture, one node</title>
  <desc id="desc">One node. The front process owns every listener: Kerberos on
  88, LDAP on 389 and 636, the HTTPS main port 8081, custom HTTPS listeners,
  plain-HTTP PKI on 8082, the debugger on 8444, SPIFFE gRPC on 8092 and 8181,
  and the SPIFFE domain sockets. It leads the scheduler and dispatches work to
  two worker-thread pools, request and surface, which run the protocol stack
  registered by one composition root. The stack holds the protocol families
  and the hosted applications. Below them every artifact is a projection of
  the authn session. Shared services sit under that, and at the bottom the
  embedded directory and key material are written to the persistence store,
  with the key-encryption key in a secret store.</desc>
  <rect width="1200" height="1130" fill="#ffffff"/>

  <!-- ===== Front process ===== -->
  <rect x="20" y="20" width="1160" height="196" rx="10" fill="#eef2f7" stroke="#9aa5b1"/>
  <text x="36" y="44" font-weight="bold" font-size="15" fill="#1f2933">Front process</text>
  <text x="156" y="44" fill="#52606d">owns every socket; one thread; leads the scheduler</text>

  <g fill="#ffffff" stroke="#7b8794">
    <rect x="36" y="58" width="104" height="48" rx="6"/>
    <rect x="150" y="58" width="104" height="48" rx="6"/>
    <rect x="264" y="58" width="150" height="48" rx="6"/>
    <rect x="424" y="58" width="150" height="48" rx="6"/>
    <rect x="584" y="58" width="120" height="48" rx="6"/>
    <rect x="714" y="58" width="120" height="48" rx="6"/>
    <rect x="844" y="58" width="150" height="48" rx="6"/>
    <rect x="1004" y="58" width="160" height="48" rx="6"/>
  </g>
  <g text-anchor="middle" fill="#1f2933">
    <text x="88" y="78" font-weight="bold">88 TCP/UDP</text><text x="88" y="96" fill="#52606d">Kerberos KDC</text>
    <text x="202" y="78" font-weight="bold">389 · 636</text><text x="202" y="96" fill="#52606d">LDAP · LDAPS</text>
    <text x="339" y="78" font-weight="bold">8081 HTTPS</text><text x="339" y="96" fill="#52606d">main port, every path</text>
    <text x="499" y="78" font-weight="bold">Custom listeners</text><text x="499" y="96" fill="#52606d">HTTPS, per application</text>
    <text x="644" y="78" font-weight="bold">8082 HTTP</text><text x="644" y="96" fill="#52606d">/pki: CRL, OCSP</text>
    <text x="774" y="78" font-weight="bold">8444 HTTPS</text><text x="774" y="96" fill="#52606d">debugger</text>
    <text x="919" y="78" font-weight="bold">8092 · 8181 gRPC</text><text x="919" y="96" fill="#52606d">Workload · SPIRE Server</text>
    <text x="1084" y="78" font-weight="bold">Domain sockets</text><text x="1084" y="96" fill="#52606d">SPIFFE Workload API</text>
  </g>

  <!-- dispatcher / scheduler / caches -->
  <rect x="36" y="120" width="560" height="42" rx="6" fill="#dbe4ee" stroke="#7b8794"/>
  <text x="316" y="140" text-anchor="middle" font-weight="bold" fill="#1f2933">Request dispatcher</text>
  <text x="316" y="155" text-anchor="middle" fill="#52606d" font-size="12">HTTP requests, LDAP / KDC / SPIFFE operations, a batch lane</text>
  <rect x="606" y="120" width="270" height="42" rx="6" fill="#dbe4ee" stroke="#7b8794"/>
  <text x="741" y="140" text-anchor="middle" font-weight="bold" fill="#1f2933">Scheduler</text>
  <text x="741" y="155" text-anchor="middle" fill="#52606d" font-size="12">every periodic job, one node</text>
  <rect x="886" y="120" width="278" height="42" rx="6" fill="#dbe4ee" stroke="#7b8794"/>
  <text x="1025" y="140" text-anchor="middle" font-weight="bold" fill="#1f2933">libuv thread pool</text>
  <text x="1025" y="155" text-anchor="middle" fill="#52606d" font-size="12">post-quantum crypto, scrypt</text>
  <text x="36" y="200" fill="#52606d" font-size="12">Streams, connections and framing stay here; with no workers, the front process answers everything itself.</text>

  <!-- arrows to pools -->
  <g stroke="#3e4c59" stroke-width="1.5" fill="none">
    <path d="M200,216 v18"/><path d="M200,234 l-5,-8 h10 z" fill="#3e4c59"/>
    <path d="M760,216 v18"/><path d="M760,234 l-5,-8 h10 z" fill="#3e4c59"/>
  </g>

  <!-- ===== Worker pools ===== -->
  <rect x="28" y="248" width="560" height="56" rx="8" fill="#f3f6ea" stroke="#b5c09a"/>
  <rect x="20" y="240" width="560" height="56" rx="8" fill="#f3f6ea" stroke="#8a9a5b"/>
  <text x="36" y="264" font-weight="bold" font-size="14" fill="#1f2933">Request workers</text>
  <text x="36" y="284" fill="#52606d">worker_threads × workers.requestCount: the whole protocol stack</text>
  <rect x="608" y="248" width="572" height="56" rx="8" fill="#f3f6ea" stroke="#b5c09a"/>
  <rect x="600" y="240" width="572" height="56" rx="8" fill="#f3f6ea" stroke="#8a9a5b"/>
  <text x="616" y="264" font-weight="bold" font-size="14" fill="#1f2933">Surface workers (optional)</text>
  <text x="616" y="284" fill="#52606d">× workers.surfaceCount: only the console and the portal</text>

  <!-- ===== Protocol stack ===== -->
  <rect x="20" y="322" width="1160" height="378" rx="10" fill="#fbfaf5" stroke="#9aa5b1"/>
  <text x="36" y="346" font-weight="bold" font-size="15" fill="#1f2933">Protocol stack</text>
  <text x="166" y="346" fill="#52606d">common/protocol_stack.ts registers every route, in one order; the same file in every thread</text>

