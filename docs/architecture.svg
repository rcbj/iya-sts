  <text x="944" y="992" fill="#52606d" font-size="11.5">key-encryption key</text>

  <rect x="140" y="1004" width="500" height="80" rx="8" fill="#dbe4ee" stroke="#7b8794"/>
  <text x="390" y="1028" text-anchor="middle" font-weight="bold" font-size="14" fill="#1f2933">Persistence store</text>
  <text x="390" y="1048" text-anchor="middle" fill="#52606d">memory · LDIF · PostgreSQL (or MariaDB)</text>
  <text x="390" y="1068" text-anchor="middle" fill="#52606d" font-size="12">the one thing threads and nodes share; opening it is the one fatal failure</text>
  <rect x="740" y="1004" width="320" height="80" rx="8" fill="#dbe4ee" stroke="#7b8794"/>
  <text x="900" y="1028" text-anchor="middle" font-weight="bold" font-size="14" fill="#1f2933">Secret store</text>
  <text x="900" y="1048" text-anchor="middle" fill="#52606d">OpenBao, or a cloud secrets manager</text>
  <text x="900" y="1068" text-anchor="middle" fill="#52606d" font-size="12">never generated by this service</text>

  <text x="20" y="1116" fill="#52606d" font-size="12">One node. A cluster is several nodes against one PostgreSQL store; a trust realm is a logical copy inside every layer, on the same sockets.</text>
</svg>
