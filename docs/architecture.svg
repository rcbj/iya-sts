    <text x="422" y="407">WS-Trust · WS-Fed</text><text x="578" y="407">Federation</text>
    <text x="734" y="407">OpenID Federation</text>
    <text x="110" y="455">Kerberos · SPNEGO</text><text x="266" y="455">LDAP</text>
    <text x="422" y="455">SCIM</text><text x="578" y="455">SPIFFE</text>
    <text x="734" y="455">TLS sign-in</text>
    <text x="110" y="503">PKI · X.509</text><text x="266" y="503">ACME · EST · SCEP</text>
    <text x="422" y="503">OID4VCI · OID4VP · DID</text><text x="578" y="503">WebAuthn · TOTP</text>
