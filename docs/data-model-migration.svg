<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 472" width="760" height="472"
     font-family="Helvetica, Arial, sans-serif" font-size="13" role="img"
     aria-labelledby="title desc">
  <title id="title">One model, and every artifact is generated from it</title>
  <desc id="desc">One TypeSpec model (directory objects, domain concepts, database tables, five API documents and nine protocol families) goes through the image build (the TypeSpec compiler, this project's decorator libraries and generate.mjs, which refuses a broken model). The build writes three kinds of artifact: those the running service reads, the types checked when the code compiles, and the pages and scripts published for people.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a9a94"/>
    </marker>
  </defs>
  <rect width="760" height="472" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1f">One model, and every artifact is generated from it</text>
  <g fill="none" stroke="#9a9a94" stroke-width="1.25">
    <path d="M224 236H256" marker-end="url(#arrow)"/>
    <path d="M432 236H448V144H464" marker-end="url(#arrow)"/>
    <path d="M448 236V280H464" marker-end="url(#arrow)"/>
    <path d="M448 280V392H464" marker-end="url(#arrow)"/>
  </g>
  <rect x="24" y="152" width="200" height="168" rx="8" fill="#2f6fd0" fill-opacity="0.12" stroke="#2f6fd0" stroke-width="2"/>
  <text x="36" y="176" font-weight="600" fill="#1f1f1f">One TypeSpec model</text>
  <g font-size="11.5" fill="#1f1f1f">
    <text x="36" y="192">Directory objects</text>
    <text x="36" y="208">Domain concepts</text>
    <text x="36" y="224">Database tables</text>
    <text x="36" y="240">Five API documents</text>
    <text x="36" y="256">SCIM, OAuth, GNAP,</text>
    <text x="36" y="272">AuthZEN, SSF,</text>
    <text x="36" y="288">ACME, EST, SCEP,</text>
    <text x="36" y="304">SPIFFE, SAML, WS-*</text>
  </g>
  <rect x="256" y="184" width="176" height="104" rx="8" fill="none" stroke="#9a9a94" stroke-width="1.25"/>
  <text x="268" y="208" font-weight="600" fill="#1f1f1f">The image build</text>
  <g font-size="11.5" fill="#1f1f1f">
    <text x="268" y="224">TypeSpec compiler 1.17</text>
    <text x="268" y="240">our decorator libraries</text>
    <text x="268" y="256">generate.mjs</text>
    <text x="268" y="272" fill="#5f5f5a">refuses a broken model</text>
  </g>
  <rect x="464" y="64" width="272" height="160" rx="8" fill="none" stroke="#9a9a94" stroke-width="1.25"/>
  <text x="476" y="86" font-weight="600" fill="#1f1f1f">Read by the running service</text>
  <g font-size="11.5" fill="#1f1f1f">
    <text x="476" y="106">Directory tables and policy settings</text>
    <text x="476" y="122">Directory name lists and registers</text>
    <text x="476" y="138">42 domain concepts</text>
    <text x="476" y="154">PostgreSQL and MariaDB tables</text>
    <text x="476" y="170">Five OpenAPI documents</text>
    <text x="476" y="186">Request and response validators</text>
    <text x="476" y="202">Nine protocol families' models</text>
  </g>
  <rect x="464" y="240" width="272" height="80" rx="8" fill="none" stroke="#9a9a94" stroke-width="1.25"/>
  <text x="476" y="262" font-weight="600" fill="#1f1f1f">Checked when the code compiles</text>
  <g font-size="11.5" fill="#1f1f1f">
    <text x="476" y="282">Types for 831 API operations</text>
    <text x="476" y="298">Types and classes for the concepts</text>
  </g>
  <rect x="464" y="336" width="272" height="112" rx="8" fill="none" stroke="#9a9a94" stroke-width="1.25"/>
  <text x="476" y="358" font-weight="600" fill="#1f1f1f">Published for people</text>
  <g font-size="11.5" fill="#1f1f1f">
    <text x="476" y="378">schema.sql for both databases</text>
    <text x="476" y="394">LDAP schema, OIDs under 67607</text>
    <text x="476" y="410">65 OpenAPI reference pages</text>
    <text x="476" y="426">Directory and database pages</text>
  </g>
</svg>
