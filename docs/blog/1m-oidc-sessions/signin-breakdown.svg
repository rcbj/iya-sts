<rect x="431.6" y="120" width="48.6" height="18" fill="#d4691f"/>
<text x="486.2" y="133" fill="#1f2933">total p50 299 ms</text>
<text x="222" y="157" text-anchor="end" fill="#1f2933">4. GET /oauth2/authorize</text>
<rect x="230.0" y="144" width="15.3" height="18" fill="#8e6bbf"/>
<rect x="245.3" y="144" width="6.3" height="18" fill="#9aa5b1"/>
<rect x="251.6" y="144" width="14.4" height="18" fill="#2f6fb0"/>
<rect x="266.0" y="144" width="59.4" height="18" fill="#d4691f"/>
<text x="331.4" y="157" fill="#1f2933">total p50 129 ms</text>
<text x="222" y="181" text-anchor="end" fill="#1f2933">5. POST /oauth2/token</text>
<rect x="230.0" y="168" width="23.4" height="18" fill="#8e6bbf"/>
<rect x="253.4" y="168" width="7.2" height="18" fill="#9aa5b1"/>
<rect x="260.6" y="168" width="59.4" height="18" fill="#2f6fb0"/>
<rect x="320.0" y="168" width="53.1" height="18" fill="#d4691f"/>
<text x="379.1" y="181" fill="#1f2933">total p50 181 ms</text>
<text x="222" y="205" text-anchor="end" font-weight="bold" fill="#1f2933">one sign-in</text>
<text x="230" y="205" font-weight="bold" fill="#1f2933">~789 ms (sum of the totals)</text>
<text x="20" y="238" font-weight="bold" fill="#1f2933">After (06:40 UTC, ~21 sign-ins/s)</text>
<text x="222" y="261" text-anchor="end" fill="#1f2933">1. GET /oauth2/authorize</text>
