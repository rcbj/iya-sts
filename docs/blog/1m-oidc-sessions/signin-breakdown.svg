<text x="403.4" y="309" fill="#1f2933">total p50 201 ms</text>
<text x="222" y="333" text-anchor="end" fill="#1f2933">4. GET /oauth2/authorize</text>
<rect x="230.0" y="320" width="6.3" height="18" fill="#8e6bbf"/>
<rect x="236.3" y="320" width="4.5" height="18" fill="#9aa5b1"/>
<rect x="240.8" y="320" width="9.9" height="18" fill="#2f6fb0"/>
<rect x="250.7" y="320" width="35.1" height="18" fill="#d4691f"/>
<text x="291.8" y="333" fill="#1f2933">total p50 85 ms</text>
<text x="222" y="357" text-anchor="end" fill="#1f2933">5. POST /oauth2/token</text>
<rect x="230.0" y="344" width="33.3" height="18" fill="#8e6bbf"/>
<rect x="263.3" y="344" width="6.3" height="18" fill="#9aa5b1"/>
<rect x="269.6" y="344" width="50.4" height="18" fill="#2f6fb0"/>
<rect x="320.0" y="344" width="42.3" height="18" fill="#d4691f"/>
<text x="368.3" y="357" fill="#1f2933">total p50 175 ms</text>
<text x="222" y="381" text-anchor="end" font-weight="bold" fill="#1f2933">one sign-in</text>
<text x="230" y="381" font-weight="bold" fill="#1f2933">~595 ms (sum of the totals)</text>
<rect x="230" y="402" width="12" height="12" fill="#8e6bbf"/>
<text x="246" y="412" fill="#1f2933">read-your-write wait</text>
<rect x="400" y="402" width="12" height="12" fill="#9aa5b1"/>
<text x="416" y="412" fill="#1f2933">queue</text>
<rect x="570" y="402" width="12" height="12" fill="#2f6fb0"/>
<text x="586" y="412" fill="#1f2933">handler</text>
<rect x="740" y="402" width="12" height="12" fill="#d4691f"/>
<text x="756" y="412" fill="#1f2933">commit wait</text>
<text x="20" y="436" fill="#616e7c" font-size="11">Bars are each phase&#8217;s p50; a request&#8217;s total p50 also covers time outside these phases, and p50s do not add exactly.</text>
</svg>
