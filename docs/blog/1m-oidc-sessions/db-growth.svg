<rect width="900" height="220" fill="#ffffff"/>
<text x="20" y="24" font-size="15" font-weight="bold" fill="#1f2933">Database size as the population grew</text>
<text x="222" y="60" text-anchor="end" fill="#1f2933">Oct 14: 1M directory entries</text>
<rect x="230" y="46" width="4.0" height="20" fill="#2f6fb0"/>
<text x="240.0" y="60" fill="#1f2933">1.2 GB</text>
<text x="222" y="90" text-anchor="end" fill="#1f2933">Oct 14: 10M entries</text>
<rect x="230" y="76" width="25.7" height="20" fill="#2f6fb0"/>
<text x="261.7" y="90" fill="#1f2933">7.7 GB</text>
<text x="222" y="120" text-anchor="end" fill="#1f2933">Oct 15: 50M entries</text>
<rect x="230" y="106" width="123.3" height="20" fill="#2f6fb0"/>
<text x="359.3" y="120" fill="#1f2933">37 GB</text>
<text x="222" y="150" text-anchor="end" fill="#1f2933">Oct 22: 50M entries + 1M sessions</text>
<rect x="230" y="136" width="560.0" height="20" fill="#2f6fb0"/>
<text x="796.0" y="150" fill="#1f2933">168 GB</text>
<text x="20" y="182" fill="#616e7c" font-size="11">The first three are compressed backups (pg_dump) taken at each milestone; the last is the live database on disk (pg_database_size), indexes included.</text>
</svg>
