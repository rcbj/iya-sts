# Jekyll configuration for the iya-sts documentation site.
#
# GitHub's own Pages workflow builds this directory — see
# ../.github/workflows/pages.yml, which runs actions/jekyll-build-pages against
# `source: ./docs`. Nothing here is installed by `npm install`: this repository's
# package.json has no documentation dependency and is not going to grow one, so
# the site is built entirely by the action and the markdown stays readable in the
# repository whether or not anybody ever visits the site.
#
# `minima` is the theme GitHub Pages ships. Choosing anything else means either
# vendoring a theme or adding a Gemfile, and this project's whole reason for
# preferring Jekyll over MkDocs was not adding a second toolchain.
title: iya-sts
description: >-
  A permissive mock identity service that speaks sixteen protocol families.
  It exists to exercise CLIENTS: it checks no password, validates no access
  token and attests no workload.
theme: minima
show_excerpts: false

# The site lives under the repository name on github.io, so every internal link
# has to be written with `relative_url` or as a plain relative path. The pages
# here use plain relative paths (`configuration.md`), which work both on the
# rendered site and when the markdown is read in the repository — the second of
# those is the case that matters most, because that is where a maintainer reads
# it.
baseurl: "/iya-sts"

# What Jekyll must not try to render. There is nothing else in this directory,
# but a future `images/` or a downloaded artefact should not be processed.
exclude:
  - CLAUDE.md

# WHAT GITHUB PAGES DOES FOR US, SAID HERE SO A LOCAL BUILD DOES IT TOO
# (2026-09-23). The Pages build loads `jekyll-default-layout`, which wraps a
# page with no `layout:` in `default`, and `jekyll-relative-links`, which turns
# a link to `foo.md` into `foo.html`. A plain `jekyll build` loads neither, and
# every page came out as a bare fragment: no <head>, so no
# `<meta charset="utf-8">` and every non-ASCII character rendered as gibberish;
# no sidebar; and every `.md` link a 404. Both lines below restate what Pages
# already does, so the published site is unchanged.
defaults:
  - scope:
      path: ""
    values:
      layout: default
plugins:
  - jekyll-relative-links

# The navigation is the sidebar, drawn from _data/navigation.yml by
# _layouts/default.html and _includes/sidebar.html (overrides of minima's own).
# `header_pages` listed every page across the top until 2026-09-22, when there
# were twenty-six of them; the header now carries only the title.
