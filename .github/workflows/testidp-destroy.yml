name: testidp destroy

# ---------------------------------------------------------------------------
# TAKE THE `testidp` ENVIRONMENT (test-idp.iyasec.io) DOWN (2026-09-17)
#
# `deploy/aws/terraform-local.sh testidp destroy`, run from GitHub, in the
# Terraform image. The entrypoint retries a failed destroy once after a minute
# (an ENI a stopped task has not released yet is the usual cause) before
# failing.
#
# **IT TAKES THE DEPENDENT STACKS DOWN FIRST (2026-09-21)** — every
# `spiffe-realm/` state under this environment, and `suite-callbacks/` — because
# their security-group rules sit on the environment's own groups where the
# environment's Terraform cannot see them. Without that, `DeleteSecurityGroup`
# answers `DependencyViolation` for fifteen minutes per group and the
# environment is left standing and billing; that is this workflow's 2026-09-20
# run, and re-running it could not fix it (`deploy/aws/CLAUDE.md`). Automated database backups go with it (`delete_automated_backups`
# in envs/testidp.tfvars), and the four secrets are deleted with no recovery
# window — nothing of the environment's data survives this. The container log
# group is `foundation/`'s and keeps its 14 days.
#
# `confirm` must be typed as `testidp`, so a mis-click on the wrong workflow
# does not delete a running deployment. It shares `testidp-deploy.yml`'s
# concurrency group, so it waits for an apply in progress rather than racing it.
#
# `environment: testidpna` (#98, 2026-09-28) destroys the multi-cell form:
# the entrypoint takes every cell's dependent stacks down first, then the
# global stack (the global database's replicas and writer, the peerings, the
# replicated secrets), then each cell — `confirm` must then be typed as
# `testidpna`.
#
# `environment: globalidp` (#367, 2026-09-30) is the six-region test case,
# six cells behind global-idp.iyasec.io (environment/envs/globalidp.*). It
# has a name of its own, so it has a concurrency group of its own and may
# exist beside either of the other two. Before its first deploy an
# administrator enables ap-southeast-5 on the account and re-applies
# foundation/ (deploy/aws/CLAUDE.md, *globalidp*).
#
# NOTE: a workflow_dispatch workflow can only be dispatched once the file is on
# the default branch.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "testidp (one region), testidpna (cells usw2 + cac1, #98) or globalidp (six cells, global-idp.iyasec.io, #367)"
        type: choice
        options:
          - testidp
          - testidpna
          - globalidp
        default: testidp
      confirm:
        description: "Type the environment's name again to confirm it and all its data are deleted"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: aws-cluster-${{ github.event.inputs.environment == 'globalidp' && 'globalidp' || 'testidp' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  TF_ENV: ${{ github.event.inputs.environment }}
  TF_IMAGE: iya-sts-terraform

jobs:
  destroy:
    if: ${{ github.event.inputs.confirm == github.event.inputs.environment }}
    runs-on: ubuntu-latest
    # Longer for cells (#98): the global stack's replicas, then each cell.
    timeout-minutes: ${{ github.event.inputs.environment == 'testidp' && 90 || 180 }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Build terraform image
        run: docker build -t "${TF_IMAGE}" -f deploy/aws/Dockerfile .

      - name: Terraform destroy (${{ github.event.inputs.environment }})
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_REGION \
            -e TF_ENV \
            -e TF_ACTION=destroy \
            "${TF_IMAGE}"

      - name: Say so if it did not come down
        if: failure()
        run: |
          echo "::error::terraform destroy failed; ${TF_ENV} may still be running and billing. Re-run this workflow."

  refused:
    if: ${{ github.event.inputs.confirm != github.event.inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: Refuse
        run: |
          echo "::error::confirm must be exactly '${TF_ENV}'; nothing was destroyed."
          exit 1
