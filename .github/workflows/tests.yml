#
# Runs this repository's whole test suite, in containers. Every job wraps a
# launcher that needs docker and NOTHING ELSE: no node, no npm install, no
# Chrome, no checkout of the parent project. That is the property this
# workflow exists to use, and it is why the suite was made self-contained on
# 2026-08-28 and why ./run-coverage.sh was containerized on 2026-08-29.
#
# THE JOB GRAPH SINCE 2026-11-14. Until then four jobs each built every image
# and ran a whole suite, the in-process half included, and the workflow had
# not passed since 2026-09-17: a `tests` job running two modes could not
# finish inside 240 minutes, mostly because the in-process files ran one at a
# time (run-report.js's default concurrency is a quarter of the CPUs, which
# is 1 on a 4-vCPU runner) and ran again in every mode; the `cluster` runner
# was lost four times in five, out of disk or memory; and it ran on `main`
# only, which carried failures already fixed on develop. Now:
#
#   mirror         copy any image the private mirror lacks (packages: write,
#                  the one job that writes anything, and only to the PRIVATE
#                  ghcr.io/rcbj/iya-sts/mirror)
#   build          ./run-tests.sh --build-only: every image the stack builds,
#                  ONCE; saved with `docker save | zstd` as the artifact
#                  `stack-images` (one day). Nothing is pushed anywhere.
#   unit           the in-process half, once, in the tests image:
#                  run-report.js --no-protocol --unit-concurrency=4. It does
#                  not depend on the mode (run-report.js strips the mode
#                  variables from a unit job), so running it per mode only
#                  repeated it.
#   mode (matrix)  memory, single-node, mariadb, cluster, cells, fuzz:
#                  ./run-tests.sh --no-build --modes=<mode> --protocol=only,
#                  one runner each.
#   openid-conformance, openid-conformance-oidcc
#                  the OpenID Foundation plans, split by lane, --no-build.
#   openapi-breaking  pull requests only: the published APIs did not break.
#   dependency-windows  SECURITY.md's windows over the lockfile.
#   coverage       ./run-coverage.sh --no-build, nightly and by hand only:
#                  130-170 instrumented minutes is not a merge gate.
#
# CI PUBLISHES NOTHING (rcbj's hold on every iya-sts image, 2026-11-14). The
# step that pushed what a run built to ghcr.io, four of those packages PUBLIC,
# is gone with its script; images move between jobs as an artifact
# (.github/scripts/stack-images.sh), and the token is `packages: read`
# everywhere but `mirror`. build-container.yml is the one publishing path and
# publishes from main only, so running this on develop touches no hold.
#
# EVERY JOB HOLDING A STACK first frees disk and starts a resource sampler
# (.github/scripts/runner-host.sh), whose log goes into its report artifact,
# `test-report-<job>`. Each job is its own workspace, so no report tree is
# ever written into by two runs of the suite.
#
# WHAT THIS COVERS THAT build-container.yml DOES NOT. That workflow builds the
# image and waits for /healthcheck, which proves every module resolved and the
# port bound. This one drives the running service: the in-process jobs that
# assert module contracts, and the protocol jobs (tests/protocol/MANIFEST.js
# is the count) that exercise every protocol family, the management API and,
# in a real browser, the admin console.
#
# tests/teardown_bounds.js reads this file: every job's timeout against the
# launcher's own bounds, and the job graph above.
name: Tests

on:
  # Develop is where all work lands, and main gets it at a release; both are
  # tested on a push and on a pull request into them.
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  # THE LONG JOBS RUN ON A MANUAL DISPATCH ONLY (rcbj, 2026-11-14): the six
  # mode jobs and the two OpenID conformance jobs are hours of runner time
  # each, and the account has a finite number of them. A push or a pull
  # request runs the cheap jobs (mirror, dependency-windows, build, unit,
  # openapi-breaking); the whole suite is `gh workflow run tests.yml --ref
  # develop`, started deliberately once a batch of fixes has landed.
  # `coverage` adds the coverage run to a dispatch.
  workflow_dispatch:
    inputs:
      coverage:
        description: Also run the coverage job
        type: boolean
        default: false
      # THE #444 JOBS (rcbj, 2026-11-15): off unless asked, each reported
      # SKIPPED; passed to the unit job and every launcher call as
      # STS_TEST_444. A push or a pull request has no inputs, so `off`.
      with444:
        description: Also run the jobs #444 created (STS_TEST_444=on)
        type: boolean
        default: false
  # Nightly, for the coverage run. A schedule runs the DEFAULT branch's copy
  # of this file, so every checkout below takes `develop` on a schedule: the
  # tree worth measuring every night is the one work lands on.
  schedule:
    - cron: '23 4 * * *'

# One run per pull request or branch. A newer push to a pull request cancels
# the run of the older one; a push to develop or main waits for the run
# before it rather than cancelling it.
concurrency:
  # A manual dispatch is the whole suite and has a group of its own: in the
  # push group it waited behind the cheap run of the last merge, and the next
  # merge's push then replaced it while it was still pending (2026-11-15).
  group: tests-${{ github.event_name == 'workflow_dispatch' && 'full-' || '' }}${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # The private test corpora image (#253) and the private image mirror
  # (2026-09-27) are READ from ghcr.io. Nothing in this workflow writes a
  # package but the `mirror` job, which says so itself.
  packages: read

env:
  # The tag every image the `build` job builds is named with (run-tests.sh
  # names them ${IMAGE_REGISTRY}/<name>:${IMAGE_TAG}), the same in every job
  # of a run, so a job that loads the artifact finds the names the launcher
  # asks for. Never pushed under it.
  IMAGE_TAG: ci-${{ github.run_id }}
  # Only the runner's output on the job log (run-tests.sh): every service's
  # log made 20-38 MB of it, truncated before the summary. The service logs
  # are captured into the report artifact either way.
  STS_TEST_ATTACH_RUNNER_ONLY: "1"
  # The #444 switch for every job below (tests/CLAUDE.md, *The #444
  # switch*): the unit job hands it to its container, the launcher reads it.
  STS_TEST_444: ${{ inputs.with444 && 'on' || 'off' }}

jobs:
  # ---------------------------------------------------------------------------
  # THE IMAGE MIRROR, BEFORE ANY STACK IS BUILT (2026-09-27, the parent
  # project's b71e078 arrangement). Everything the jobs below pull or build
  # FROM comes from private copies under ghcr.io/rcbj/iya-sts/mirror
  # (.github/image-mirror.txt), so that a reset connection to Docker Hub
  # cannot take the suite down. `missing` copies only an image the mirror
  # does not have yet, so a complete mirror costs one manifest request per
  # image and no request to an upstream registry at all.
  #
  # A job here rather than a call to mirror-images.yml, deliberately: a called
  # workflow that declares packages: write fails OUTRIGHT when the caller's
  # token is read-only, which it is on a Dependabot or a fork pull request.
  # Inline, the token is simply downgraded, and with a complete mirror this
  # job only reads.
  # ---------------------------------------------------------------------------
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" |
             docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Copy any image the mirror does not have yet
        run: .github/scripts/mirror-images.sh missing

  # ---------------------------------------------------------------------------
  # THE ADVISORY WINDOWS OF SECURITY.md (#1458). No install: `npm audit` reads
  # the lockfile. The published image's half is dependency-windows.yml's.
  # ---------------------------------------------------------------------------
  dependency-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
      - name: Fail on an advisory past its window
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tests/tools/dependency-windows.js

  # ---------------------------------------------------------------------------
  # EVERY IMAGE, BUILT ONCE (2026-11-14). The same build a run of the launcher
  # does (`docker compose build` of docker-compose-run-tests.yml, the SAML
  # peers' profile on), stopped before any mode. It was done by every job
  # until this day, which was five chances per run for a network flake in the
  # build and five times the disk. The images go to the jobs below as an
  # artifact, never to a registry.
  #
  # 50 minutes: a cold build took 20-29 on this kind of runner, and the save
  # and the upload of three to four compressed gigabytes about ten more.
  # ---------------------------------------------------------------------------
  build:
    needs: mirror
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      packages: read
    steps:
      # submodules: recursive is LOAD-BEARING, and `true` is not enough. The
      # embedded directory's library is `"ldapjs": "file:node-ldapjs"`, a git
      # SUBMODULE, and this repository is itself a submodule of the parent
      # project, so there are submodules inside submodules and `true` stops
      # one level short. An uninitialised submodule is an EMPTY DIRECTORY, so
      # nothing fails loudly: the COPY succeeds, npm installs a package with
      # no `main`, both images build, and the container dies at startup with
      # `Cannot find module 'ldapjs'`. Both Dockerfiles and the launcher's
      # preflight guard it too; asking for it here keeps a fetch failure on
      # the checkout step, where it reads as one.
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
          submodules: recursive

      - name: Free disk
        run: .github/scripts/runner-host.sh free-disk

      # THE TEST CORPORA (#253) AND THE IMAGE MIRROR (2026-09-27) ARE PRIVATE
      # PACKAGES ON GHCR.IO: tests/Dockerfile copies the corpora out of
      # ghcr.io/rcbj/iya-sts-test-corpora by digest, and every third-party
      # image and base image comes from ghcr.io/rcbj/iya-sts/mirror. A
      # private package is pulled only by a logged-in client; GITHUB_TOKEN
      # carries packages: read and the packages grant this repository access.
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" |
             docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Show docker and compose versions
        run: |
          docker --version
          docker compose version

      - name: Build every image the stack needs
        run: ./run-tests.sh --build-only

      # The build cache is gigabytes the archive does not need and the disk
      # cannot spare while it is written.
      - name: Drop the build cache
        run: docker builder prune -af

      - name: Save the images
        run: .github/scripts/stack-images.sh save "${RUNNER_TEMP}/stack-images.tar.zst"

      # Already zstd, so the upload does not compress it again. One day: it
      # is for this run's jobs and nobody else.
      - name: Upload the images
        uses: actions/upload-artifact@v4
        with:
          name: stack-images
          path: ${{ runner.temp }}/stack-images.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # ---------------------------------------------------------------------------
  # THE IN-PROCESS HALF, ONCE (2026-11-14). Every tests/*.js file, four at a
  # time, in the tests image the `build` job made, with no stack: a unit file
  # touches no service. It was run in every mode job until this day, one file
  # at a time on this runner, and in the `memory` mode of run 42934501375 it
  # was still at file 458 of 1137 when the mode's bound fired while the
  # protocol half had nearly finished. tests/teardown_bounds.js holds that
  # some job still runs it.
  #
  # The service URL and the directory URL the image carries for the compose
  # stack are emptied, as ./run-coverage.sh empties them, because there is no
  # `sts` here.
  # ---------------------------------------------------------------------------
  unit:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}

      - name: Free disk
        run: .github/scripts/runner-host.sh free-disk

      - name: Sample the runner's memory and disk
        run: nohup .github/scripts/runner-host.sh sample tests/report/runner/resources.log > /dev/null 2>&1 &

      - name: Download the images
        uses: actions/download-artifact@v4
        with:
          name: stack-images
          path: ${{ runner.temp }}

      - name: Load the images
        run: .github/scripts/stack-images.sh load "${RUNNER_TEMP}/stack-images.tar.zst"

      - name: Run the in-process files
        run: |
          docker run --rm --shm-size=2g \
            -e STS_TEST_SERVICE_URL= -e STS_LDAP_URL= \
            -e STS_TEST_444 \
            -v "${PWD}/tests/report:/usr/src/sts/tests/report" \
            "ghcr.io/rcbj/iya-sts/iya-sts-tests:${IMAGE_TAG}" \
            node tests/tools/run-report.js --no-protocol --unit-concurrency=4 \
              --report-dir=tests/report/unit

      # The container writes tests/report as root through the bind mount;
      # hand it back to the runner user before the upload step reads it.
      # `|| true` because a run that failed before writing anything must not
      # fail HERE and hide why.
      - name: Normalize report permissions
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" tests/report || true

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-unit
          path: tests/report
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # THE PROTOCOL HALF, ONE MODE PER RUNNER (2026-11-14). All six modes of
  # tests/tools/modes.sh's STS_ALL_MODES, each on a runner of its own: one
  # mode per machine is what fits it (the `cluster` stack is two production
  # nodes, postgres, OpenBao, HAProxy and a runner with Chrome), the launcher's
  # container names are machine-wide, and a red mode names itself. Red in
  # `cluster` and green in `single-node`, the same deployment on one node, is
  # a CLUSTER defect, which is why both run every time. fail-fast is off: one
  # mode's failure says nothing about another's. `fuzz` runs its own jobs only
  # (modes.sh, stsModeJobFilter()), which the launcher applies itself.
  #
  # THE BOUNDS. `minutes` is the job's timeout and `bound` the launcher's own
  # bound for the mode, in seconds, handed over through the variable that
  # mode reads (STS_MODE_TIMEOUT for memory, STS_SINGLE_NODE_MODE_TIMEOUT,
  # STS_CLUSTER_MODE_TIMEOUT for cluster and mariadb, STS_CELLS_MODE_TIMEOUT,
  # STS_FUZZ_MODE_TIMEOUT; the others are ignored by a run of one mode).
  # The launcher adds STS_SAML_PEERS_TIMEOUT (15m) in memory and single-node.
  # The job's number sits above the bound, the peers, a teardown for the mode
  # and one for the stack before it, and ten minutes to download and load the
  # images, so the bound that fires is the one that can explain itself
  # (tests/teardown_bounds.js), and every job is under GitHub's six hours
  # with half an hour to spare.
  #
  # MEASURED ON THIS RUNNER, run 43622250478 (protocol half only, wallMs):
  # memory 69 minutes against a bound of 60 + 15, single-node 133 against
  # 120 + 15 — both within minutes of being cut off — and cluster 201 of 275
  # jobs in 105 minutes when its runner stopped answering. The protocol half
  # runs about 1.5 times slower here than on the development laptop, so the
  # bounds are the measured time (or the laptop's times in tests/CLAUDE.md
  # times 1.5 for the modes not yet run here: mariadb ~80, cells 60-90, fuzz
  # 126-155) with about forty per cent on top. A bound that fires here is a
  # finding to measure, not a number to raise blind.
  #
  # CLUSTER, MEASURED TWICE (2026-11-15). Run 43642810770 ran the same 275
  # protocol jobs in 150 minutes; run 43735265596 was still in its last
  # (472/472, the third bulk load, about five minutes from the end) when its
  # bound of 13200 s fired at 220 minutes. The other modes of that run were
  # no slower than the first run's (memory 71 against 69 minutes,
  # single-node 108 against 139), so the runner, not the suite, is what
  # varies by a third from run to run; cluster's per-request handler times
  # were 1.3-2 times the first run's on both nodes from the first jobs. The
  # bound is 270 minutes, the slow run's 228 with about a fifth on top, and
  # sts_oidfed_extensions, which spent five of those minutes timing out, is
  # fixed separately. A cluster run past 270 is a finding, not a number.
  #
  # STS_TEST_CONFORMANCE_MODES EMPTY (#187): the OpenID conformance plans are
  # the two `openid-conformance*` jobs'; here they are reported SKIPPED with
  # the reason.
  # ---------------------------------------------------------------------------
  mode:
    name: mode (${{ matrix.mode }})
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.minutes }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: memory
            minutes: 150
            bound: 6000
          - mode: single-node
            minutes: 240
            bound: 11400
          - mode: mariadb
            minutes: 250
            bound: 13200
          - mode: cluster
            minutes: 300
            bound: 16200
          - mode: cells
            minutes: 230
            bound: 12000
          - mode: fuzz
            minutes: 330
            bound: 18000
    steps:
      # See the build job: recursive, for the nested node-ldapjs submodule,
      # which the launcher's preflight checks even with --no-build.
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
          submodules: recursive

      - name: Free disk
        run: .github/scripts/runner-host.sh free-disk

      # Swap, and the runner's own processes kept out of the OOM killer's
      # reach: see runner-host.sh. The `cluster` runner of run 43622250478
      # stopped reporting 105 minutes in and was cancelled at its timeout
      # with no step after it run, the fifth such loss.
      - name: Keep the runner alive under memory pressure
        run: .github/scripts/runner-host.sh harden-memory

      - name: Sample the runner's memory and disk
        run: nohup .github/scripts/runner-host.sh sample tests/report/runner/resources.log > /dev/null 2>&1 &

      # See the build job: the stack's third-party images (postgres, OpenBao,
      # HAProxy, mailpit, MariaDB) come from the private mirror at `up`.
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" |
             docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Download the images
        uses: actions/download-artifact@v4
        with:
          name: stack-images
          path: ${{ runner.temp }}

      - name: Load the images
        run: .github/scripts/stack-images.sh load "${RUNNER_TEMP}/stack-images.tar.zst"

      - name: Run the protocol jobs in the ${{ matrix.mode }} mode
        env:
          STS_TEST_CONFORMANCE_MODES: ""
          STS_MODE_TIMEOUT: ${{ matrix.bound }}
          STS_SINGLE_NODE_MODE_TIMEOUT: ${{ matrix.bound }}
          STS_CLUSTER_MODE_TIMEOUT: ${{ matrix.bound }}
          STS_CELLS_MODE_TIMEOUT: ${{ matrix.bound }}
          STS_FUZZ_MODE_TIMEOUT: ${{ matrix.bound }}
        # The pulse is stopped here rather than left to the job's orphan
        # clean-up, so that the step's end is the launcher's.
        run: |
          .github/scripts/runner-host.sh pulse &
          pulsePid=$!
          status=0
          ./run-tests.sh --no-build --modes=${{ matrix.mode }} --protocol=only || status=$?
          kill "${pulsePid}" 2> /dev/null || true
          exit "${status}"

      # See the unit job.
      - name: Normalize report permissions
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" tests/report || true

      # if: always(): the report is at its most useful when the run went red.
      # THE WHOLE tests/report TREE: ./run-tests.sh hands each mode
      # `--report-dir=tests/report/<mode>`, and a mode that died before
      # writing a report leaves tests/report/<mode>-00-*.log, exactly the run
      # whose logs are worth having. In the cluster mode the tree carries node
      # B's and the balancer's logs too.
      #
      # pep-credential/ is excluded: it is the client key and certificate the
      # launcher mints for the remote PEP, it protects nothing and lives for
      # one run, and a private key does not belong in a downloadable artifact
      # whatever it is worth.
      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.mode }}
          path: |
            tests/report
            !tests/report/pep-credential
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # THE OPENID FOUNDATION'S CONFORMANCE SUITE (#176, #187). The jobs marked
  # `conformance: true` in tests/protocol/MANIFEST.js (FAPI, OpenID Connect
  # with its logout plans and Identity Assurance, Shared Signals, OpenID
  # Federation, OpenID4VCI and OpenID4VP) against the suite's own containers
  # under the `conformance` compose profile, in the `memory` mode.
  # `--conformance-only` names them by that FLAG (2026-09-27).
  #
  # TWO JOBS, SPLIT BY LANE (#930): this one every lane but the OpenID
  # Provider job's, `openid-conformance-oidcc` that lane alone, the suite's
  # longest. Neither passes --no-browser since #930 (rcbj): the jobs that play
  # the suite's person in Chrome run in CI too.
  #
  # The launcher grows the mode's bound by STS_CONFORMANCE_TIMEOUT (260m since
  # 2026-10-23); this number sits above the mode's bound (50m + 260m), two
  # teardowns (5m each) and ten minutes to load the images, and under
  # GitHub's six hours (tests/teardown_bounds.js asserts both).
  # ---------------------------------------------------------------------------
  openid-conformance:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
          submodules: recursive

      - name: Free disk
        run: .github/scripts/runner-host.sh free-disk

      - name: Sample the runner's memory and disk
        run: nohup .github/scripts/runner-host.sh sample tests/report/runner/resources.log > /dev/null 2>&1 &

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" |
             docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Download the images
        uses: actions/download-artifact@v4
        with:
          name: stack-images
          path: ${{ runner.temp }}

      - name: Load the images
        run: .github/scripts/stack-images.sh load "${RUNNER_TEMP}/stack-images.tar.zst"

      - name: Run the OpenID conformance suite's plans
        # The SAML interoperability peers (#189-#192) are the mode jobs'; the
        # launcher would start them in `memory` by default, for jobs
        # `--conformance-only` does not run.
        env:
          STS_TEST_CONFORMANCE_MODES: memory
          STS_TEST_SAML_PEERS_MODES: ""
        run: ./run-tests.sh --no-build --modes=memory --conformance-only --not-lanes=conformance

      - name: Normalize report permissions
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" tests/report || true

      # Each job's log names the suite's plan ids and every module's result.
      - name: Upload the conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-conformance
          path: |
            tests/report
            !tests/report/pep-credential
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # THE OPENID PROVIDER PLANS, A JOB OF THEIR OWN (#930, 2026-11-03): the
  # OpenID Provider certification profiles, oidcc-test-plan and the logout
  # plans, each also as its classical twin. The arithmetic is the job above's.
  # ---------------------------------------------------------------------------
  openid-conformance-oidcc:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
          submodules: recursive

      - name: Free disk
        run: .github/scripts/runner-host.sh free-disk

      - name: Sample the runner's memory and disk
        run: nohup .github/scripts/runner-host.sh sample tests/report/runner/resources.log > /dev/null 2>&1 &

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" |
             docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Download the images
        uses: actions/download-artifact@v4
        with:
          name: stack-images
          path: ${{ runner.temp }}

      - name: Load the images
        run: .github/scripts/stack-images.sh load "${RUNNER_TEMP}/stack-images.tar.zst"

      - name: Run the OpenID conformance suite's plans
        env:
          STS_TEST_CONFORMANCE_MODES: memory
          STS_TEST_SAML_PEERS_MODES: ""
        # THE OPENID PROVIDER LANE ALONE (#930).
        run: ./run-tests.sh --no-build --modes=memory --conformance-only --lanes=conformance

      - name: Normalize report permissions
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" tests/report || true

      - name: Upload the conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-conformance-oidcc
          path: |
            tests/report
            !tests/report/pep-credential
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # WHAT A CALLER RELIES ON HAS NOT GONE (#1390). Compares the OpenAPI
  # documents the model generates here with the ones generated from the
  # target branch. A pull request labelled `api-breaking` says the break is
  # intended. It builds the tests image twice (the base's and the head's),
  # whose FROMs come from the private mirror, so it logs in (it failed on
  # every pull request with a 401 until 2026-11-14) and frees disk first.
  # ---------------------------------------------------------------------------
  openapi-breaking:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'api-breaking')
    needs: mirror
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Free disk
        run: .github/scripts/runner-host.sh free-disk
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" |
             docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Fail on a breaking change to a published API
        run: tests/tools/oasdiff-gate.sh "origin/${{ github.base_ref }}"

  # ---------------------------------------------------------------------------
  # THE SAME SUITE AGAIN, INSTRUMENTED: which LINES of this tree the jobs
  # actually reached. Nightly and by hand only since 2026-11-14: 130-170
  # instrumented minutes per push, failing on the same failures as the mode
  # jobs, made it a fifth heavy runner per merge and no better a gate.
  #
  # It loads the `build` job's tests image (--no-build). Its compose project
  # is iya-sts-coverage, which keeps it from the launcher's containers even on
  # one machine.
  #
  # 210 since 2026-10-13: on main 8fe81efa the suite took 6,312s after the
  # build (about 128 minutes in all).
  # ---------------------------------------------------------------------------
  coverage:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.coverage)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 210
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
          submodules: recursive

      - name: Free disk
        run: .github/scripts/runner-host.sh free-disk

      - name: Sample the runner's memory and disk
        run: nohup .github/scripts/runner-host.sh sample tests/report/runner/resources.log > /dev/null 2>&1 &

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" |
             docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Download the images
        uses: actions/download-artifact@v4
        with:
          name: stack-images
          path: ${{ runner.temp }}

      - name: Load the images
        run: .github/scripts/stack-images.sh load "${RUNNER_TEMP}/stack-images.tar.zst"

      # `docker compose run --rm --no-deps` on the tests service alone: the
      # runner is in the container and the service it measures is a child
      # process beside it, so everything V8 writes is written by processes
      # this run started. ./coverage and ./tests/report are bind mounts, so
      # both come out onto the host.
      - name: Run the suite with coverage, in containers
        run: ./run-coverage.sh --no-build

      # run-coverage.sh already hands both directories back; this is the
      # belt to its braces, and `|| true` for the unit job's reason.
      - name: Normalize coverage permissions
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" coverage tests/report || true

      # index.html with a page per file, lcov.info, summary.json for the
      # totals, and raw/. `warn` because a run that went red before the
      # render has no coverage to upload, and that must not be a second
      # failure.
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: warn
          retention-days: 30

      # The instrumented run's OWN test report: a job that passes plain and
      # fails under coverage is a real thing (the service is a child process
      # here, not a container).
      - name: Upload the coverage run's test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-coverage
          path: |
            tests/report
            !tests/report/pep-credential
          if-no-files-found: warn
          retention-days: 30
