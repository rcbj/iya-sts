#
# SECURITY.md's windows, checked every day (#1485, ASVS 5.0.0 15.2.1): an
# advisory can pass its window between two merges, so a check that runs only on
# a push would miss it. The image is scanned as well, because `npm audit`
# cannot see the operating system's packages, the Node runtime or the
# debugger's tree. The scanner is pinned by digest and reads a saved copy of
# the image, so it is given no Docker socket.
#
# WHICH IMAGE (2026-11-14). On main, the PUBLISHED image, which is what users
# pull. On any other ref, an image BUILT FROM THAT REF here, because only
# main publishes (build-container.yml): until then this copy scanned main's
# `:latest` whatever ref it ran on, so a fix on develop could not be seen to
# pass. What forced it: from 2026-11-11 every scheduled run failed on the
# brace-expansion and undici copies inside the npm bundled with Node in
# main's image (CVE-2026-102276, CVE-2026-102278, CVE-2026-19534); develop's
# image ships no npm since the 2026-11-14 slim image, and a dispatch from
# develop still scanned main's.
#
# SECURITY ADVISORIES ONLY (#2219, rcbj 2026-11-25). The scheduled run holds
# the advisory windows (critical 7, high 30, moderate 90 days) over both
# lockfiles, the root's and sdk/'s, and over the image. Until then it also
# ran SECURITY.md's 90-day update review (`--updates`), which since #2159
# read the 27 sdk/ workspace pins too, so the day went red whenever an SDK
# fell behind with no advisory against it. The update review now runs only
# when a dispatch asks for it (`updates`), and reads the root lockfile only.
name: Dependency windows

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      updates:
        description: Also run the 90-day update review of the root lockfile
        type: boolean
        default: false

permissions:
  contents: read
  # The ghcr.io mirror the build reads its base images from, and the
  # embedded debugger's image (a build off main only).
  packages: read

jobs:
  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # submodules: the build copies node-ldapjs, and an empty one builds an
      # image that is not the service (build-container.yml says why).
      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Pull the published image
        if: github.ref == 'refs/heads/main'
        run: |
          docker pull ghcr.io/rcbj/iya-sts:latest
          docker tag ghcr.io/rcbj/iya-sts:latest iya-sts:scan
      - name: Set up Buildx
        if: github.ref != 'refs/heads/main'
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: github.ref != 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" |
             docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # The same build as build-container.yml's, with the same contexts. It
      # reads that workflow's layer cache where this ref may see it (its own
      # branch's and main's) and writes none.
      - name: Build the image of this ref
        if: github.ref != 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: iya-sts:scan
          load: true
          push: false
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          build-contexts: |
            debian:bookworm-slim=docker-image://ghcr.io/rcbj/iya-sts/mirror/debian:bookworm-slim
            node:24.22.1-bookworm-slim=docker-image://ghcr.io/rcbj/iya-sts/mirror/node:24.22.1-bookworm-slim
          cache-from: type=gha
      - name: Scan the image
        run: |
          docker save iya-sts:scan -o image.tar
          docker run --rm -v "$PWD:/out" \
            aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --quiet --scanners vuln --format json \
            --output /out/image-report.json --input /out/image.tar
      - name: Fail on anything past its window
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_REVIEW: ${{ inputs.updates && 'true' || 'false' }}
        run: |
          set -euo pipefail
          args=()
          if [ "${UPDATE_REVIEW}" = true ]; then args+=(--updates); fi
          node tests/tools/dependency-windows.js --image-report=image-report.json "${args[@]}"
