#
# SECURITY.md's windows, checked every day (#1485, ASVS 5.0.0 15.2.1): an
# advisory can pass its window between two merges, so a check that runs only on
# a push would miss it. The image is scanned as well, because `npm audit`
# cannot see the operating system's packages, the Node runtime or the
# debugger's tree. The scanner is pinned by digest and reads a saved copy of
# the image, so it is given no Docker socket.
#
# WHICH IMAGE (2026-11-14). On main, the PUBLISHED image, which is what users
# pull. On any other ref, an image BUILT FROM THAT REF here, because only
# main publishes (build-container.yml): until then this copy scanned main's
# `:latest` whatever ref it ran on, so a fix on develop could not be seen to
# pass. What forced it: from 2026-11-11 every scheduled run failed on the
# brace-expansion and undici copies inside the npm bundled with Node in
# main's image (CVE-2026-102276, CVE-2026-102278, CVE-2026-19534); develop's
# image ships no npm since the 2026-11-14 slim image, and a dispatch from
# develop still scanned main's.
#
# AND THE THREE OTHER IMAGES THE STACK RUNS (#2220, 2026-11-25): the remote
# PEP and the ICAP adapter, built from this ref on every ref (their images
# are not what a pull of main's service image brings), and the ClamAV image
# at the tag docker-compose.yml names. Each is scanned the same way and held
# to the same windows; the PEP's crates and its built-in OpenSSL are seen
# through the CycloneDX SBOM its image carries. Three builds where there was
# one, so the job's limit went from 45 minutes to 90.
#
# AND THE RUSTSEC AUDIT OF rust/Cargo.lock (#2220): `cargo audit`, which is
# what names an advisory in the PEP's crates and in the OpenSSL its
# `openssl-src` crate builds. It is HERE and not in tests.yml's `rust` job
# on purpose: that job gates the merge queue, and an advisory published
# today would block every merge until somebody bumped the crate. A finding
# fails this run instead; a reviewed exception is recorded, with its reason,
# in rust/.cargo/audit.toml. It runs even when the image windows failed, so
# one run reports both.
name: Dependency windows

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # The ghcr.io mirror the build reads its base images from, and the
  # embedded debugger's image (a build off main only).
  packages: read

jobs:
  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # submodules: the build copies node-ldapjs, and an empty one builds an
      # image that is not the service (build-container.yml says why).
      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Pull the published image
        if: github.ref == 'refs/heads/main'
        run: |
          docker pull ghcr.io/rcbj/iya-sts:latest
          docker tag ghcr.io/rcbj/iya-sts:latest iya-sts:scan
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" |
             docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # The same build as build-container.yml's, with the same contexts. It
      # reads that workflow's layer cache where this ref may see it (its own
      # branch's and main's) and writes none.
      - name: Build the image of this ref
        if: github.ref != 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: iya-sts:scan
          load: true
          push: false
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          build-contexts: |
            debian:bookworm-slim=docker-image://ghcr.io/rcbj/iya-sts/mirror/debian:bookworm-slim
            node:24.22.1-bookworm-slim=docker-image://ghcr.io/rcbj/iya-sts/mirror/node:24.22.1-bookworm-slim
          cache-from: type=gha
      - name: Build the remote PEP's image of this ref
        uses: docker/build-push-action@v7
        with:
          context: .
          file: xacml-pep/Dockerfile
          tags: iya-sts-xacml-pep:scan
          load: true
          push: false
          build-contexts: |
            rust:1.97-bookworm=docker-image://ghcr.io/rcbj/iya-sts/mirror/rust:1.97-bookworm
            debian:bookworm-slim=docker-image://ghcr.io/rcbj/iya-sts/mirror/debian:bookworm-slim
          cache-from: type=gha,scope=xacml-pep
      - name: Build the ICAP adapter's image of this ref
        uses: docker/build-push-action@v7
        with:
          context: ./icap-clamav
          tags: iya-sts-icap-clamav:scan
          load: true
          push: false
          build-contexts: |
            debian:bookworm-slim=docker-image://ghcr.io/rcbj/iya-sts/mirror/debian:bookworm-slim
      # The tag the compose file runs, read from it so the two cannot drift.
      - name: Pull the ClamAV image docker-compose.yml names
        run: |
          clamav="$(grep -o 'clamav/clamav:[0-9][0-9.]*' docker-compose.yml | head -1)"
          test -n "$clamav"
          docker pull "$clamav"
          docker tag "$clamav" clamav:scan
      - name: Scan the images
        run: |
          for image in iya-sts iya-sts-xacml-pep iya-sts-icap-clamav clamav; do
            docker save "$image:scan" -o "$image.tar"
            docker run --rm -v "$PWD:/out" \
              aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
              image --quiet --scanners vuln --format json \
              --output "/out/$image-report.json" --input "/out/$image.tar"
            rm -f "$image.tar"
          done
      - name: Fail on anything past its window
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node tests/tools/dependency-windows.js --updates
          --image-report=iya-sts-report.json
          --image-report=iya-sts-xacml-pep-report.json
          --image-report=iya-sts-icap-clamav-report.json
          --image-report=clamav-report.json
      - name: Audit rust/Cargo.lock against the RustSec advisories
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm -v "${PWD}:/src" -w /src/rust
          -e CARGO_TERM_COLOR=always
          ghcr.io/rcbj/iya-sts/mirror/rust:1.97-bookworm
          bash -c "cargo install cargo-audit --version 0.22.2 --locked --quiet && cargo audit"
