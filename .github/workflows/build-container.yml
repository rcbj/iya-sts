#
# Builds IYA STS container image.
#
# On every push to main (which is what a merged pull request is) and to
# develop, and on demand from the Actions tab. Both of the Dockerfile's base
# images come from the private image mirror (.github/image-mirror.txt) since
# 2026-09-27, so it logs in to ghcr.io before building.
#
# AND IT PUBLISHES THE IMAGE IT HAS JUST SMOKE-TESTED (2026-10-02), as a
# PUBLIC image, to two registries with the same tags from the same build —
# the parent project's arrangement for its api and client (its
# .github/workflows/dockerimage.yml, issue #154 there):
#
#   ghcr.io/rcbj/iya-sts              docker.io/iyasec/iya-sts
#   ghcr.io/rcbj/iya-sts-xacml-pep    docker.io/iyasec/iya-sts-xacml-pep
#
# The second is the remote XACML PEP (xacml-pep/), built here with the same
# build number and checked for liveness before anything is published.
#
# See *Publish the image* below.
#
# The build alone is worth running. This service is a shell — server.js requires
# the other modules and listens — so a module that never reaches the image is not
# a missing feature but a MODULE_NOT_FOUND before anything binds the port. The
# Dockerfile copies the whole build context for exactly that reason, and the
# same class of mistake (a directory .dockerignore or the Dockerfile's `rm`
# leaves out, a context file bbs2023.js reads at module scope) still gets
# through a successful build. So the
# job does not stop at `docker build` — it starts the image and waits for
# /healthcheck, which is the cheapest thing that proves every require resolved.
name: Build container

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  # The private image mirror on ghcr.io, read for the base images, and the
  # public ghcr.io/rcbj/iya-sts package, written.
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # submodules: recursive is LOAD-BEARING and its absence is silent until the
      # container starts. The LDAP directory's library is `"ldapjs":
      # "file:node-ldapjs"` — a git SUBMODULE — and actions/checkout does not fetch
      # submodules unless asked. An uninitialised submodule is an EMPTY DIRECTORY,
      # so nothing below fails: the COPY succeeds, npm installs a package with no
      # `main`, `docker build` reports success, and the job dies sixty seconds
      # later at the /healthcheck wait with `Cannot find module 'ldapjs'` in the
      # container log — a message that names a package rather than a submodule.
      # That is exactly what happened on 2026-08-18.
      #
      # `recursive` rather than `true` because ldapjs may carry submodules of its
      # own, and because it costs nothing here; it is also the flag the parent
      # project needs for the same reason one level up (this repository is itself
      # a submodule over there).
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # A guard rather than trust in the line above. The failure this whole comment
      # is about is a build that SUCCEEDS, so the cheapest place to catch it is
      # before the build: an empty node-ldapjs is a one-line failure here instead of
      # a MODULE_NOT_FOUND read out of a container log after a 60-second timeout.
      # package.json is what the COPY needs to be there — the directory itself
      # exists either way, because git creates the mount point.
      - name: Check the ldapjs submodule was fetched
        run: |
          if [ ! -f node-ldapjs/package.json ]; then
            echo "node-ldapjs is empty — the submodule was not checked out." >&2
            echo "The image would build and then die with Cannot find module 'ldapjs'." >&2
            exit 1
          fi
          echo "node-ldapjs is present."

      # buildx, for the GitHub Actions layer cache below. The Dockerfile installs
      # nvm and a Node toolchain from the network on every layer miss, which is
      # the slow part by a wide margin and the part most worth caching.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # THE BASE IMAGES ARE PRIVATE COPIES ON GHCR.IO (2026-09-27): see
      # build-contexts below and .github/image-mirror.txt.
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" |
             docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # load: true puts the result in the local daemon under the name compose
      # uses, so the smoke test below can run it. Without it buildx leaves the
      # image in its own cache and `docker run rcbj/sts` would pull from Docker
      # Hub instead — a stale published image passing for the one just built.
      #
      # THE TWO BUILD ARGUMENTS STAMP THE IMAGE'S VERSION (M.N.O). The build
      # number is fixed here rather than at startup — see CLAUDE.md,
      # *Versioning* — and it is the build number common/version.js gives
      # (the UTC build instant), as the parent project's Docker Image CI does
      # with its client/version.js; it was the workflow's run number until
      # 2026-10-02. It is computed ONCE, in the step before this one, so the
      # two images built here carry the same version.
      # GIT_COMMIT has to be passed because `.dockerignore` excludes
      # `.git`, so the build context carries no history for `git rev-parse` to
      # read. Neither is required — omit them and the version is the build
      # instant with no commit — which is what keeps a plain `docker build`
      # working unchanged.
      - name: Compute the version
        id: build-number
        run: |
          set -euo pipefail
          v="$(node common/version.js --json)"
          build="$(jq -r .build <<<"${v}")"
          echo "build=${build}" >> "$GITHUB_OUTPUT"
          echo "Version $(jq -r .version <<<"${v}"), build number ${build}."

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: rcbj/sts:ci
          load: true
          push: false
          build-args: |
            BUILD_NUMBER=${{ steps.build-number.outputs.build }}
            GIT_COMMIT=${{ github.sha }}
          # Every FROM from the ghcr.io mirror, as docker-compose-run-tests.yml's
          # x-mirror-contexts does (`ubuntu`, not `ubuntu:latest`: BuildKit
          # drops `:latest` when it looks a name up).
          # tests/image_mirror_coverage.js holds this list to the Dockerfile.
          build-contexts: |
            ubuntu=docker-image://ghcr.io/rcbj/iya-sts/mirror/ubuntu:latest
            node:24.16.0-bookworm-slim=docker-image://ghcr.io/rcbj/iya-sts/mirror/node:24.16.0-bookworm-slim
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # THE REMOTE XACML PEP (2026-10-02), with the same build number and
      # commit, so the two images published from one run carry one version.
      # Its one FROM comes from the mirror, as the service's do.
      - name: Build the XACML PEP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: xacml-pep/Dockerfile
          tags: rcbj/xacml-pep:ci
          load: true
          push: false
          build-args: |
            BUILD_NUMBER=${{ steps.build-number.outputs.build }}
            GIT_COMMIT=${{ github.sha }}
          build-contexts: |
            node:22-alpine=docker-image://ghcr.io/rcbj/iya-sts/mirror/node:22-alpine
          cache-from: type=gha,scope=xacml-pep
          cache-to: type=gha,mode=max,scope=xacml-pep

      # Publishing to the host rather than reusing the compose file: this needs
      # one container and a port, and compose would add a second thing that can
      # fail. The container port is fixed at 8081 — the Dockerfile EXPOSEs it and
      # the service defaults to it — and the STS derives every published URL from
      # the Host header, so it does not have to be told where it was reached.
      #
      # ADMIN_API_CLIENT_SECRET, CHOSEN HERE, and both checks below need it.
      # This used to pass ADMIN_AUTH_REQUIRED=false so a bare curl could read
      # the console's /admin/sts-metadata. That setting was REMOVED on
      # 2026-09-06 — the console gate cannot be turned off — and a variable
      # the service no longer reads fails nothing, so the curl got a 303 to
      # /oauth2/authorize and every merge to main from 2026-09-09 failed at
      # the metadata check. /admin-api has required an access token since
      # 2026-09-09 as well. So the job now does what the test launchers do:
      # it pins the seeded `sts-management-api` client's secret BEFORE the
      # service starts (the client reads it while it is seeded, so a secret
      # chosen afterwards is one the service never heard of), mints a token,
      # and signs in to the console. Masked, because a run log is public.
      - name: Start the container
        run: |
          secret="$(head -c 24 /dev/urandom | base64 | tr -d '/+=' | head -c 24)"
          echo "::add-mask::${secret}"
          echo "ADMIN_API_CLIENT_SECRET=${secret}" >> "$GITHUB_ENV"
          docker run -d --name sts-ci -p 8081:8081 \
            -e ADMIN_API_CLIENT_SECRET="${secret}" rcbj/sts:ci

      # https AND `-k` SINCE 2026-08-30, and both halves are load-bearing. The
      # image's CONFIG_FILE is ./env/local.js, which carries
      # `global.https: true`, so the main port is a TLS listener and there is
      # NO plain one left in the process — an http probe here would loop for
      # sixty seconds and report a container that never started. `-k` because
      # the certificate is issued under a Root the container generates when it
      # starts, so nothing that existed before this step can verify it; the
      # question these two steps ask is whether every module resolved and the
      # router registered, not whether the certificate is trustworthy.
      #
      # The compose healthcheck's probe, in a shell loop instead of Docker's
      # retry schedule so the failure is visible in the log rather than in a
      # container's health state. Roughly 60 seconds: the image is a full apt
      # layer and the signing key is generated at startup, so first listen is not
      # instant, and a fixed sleep would either be too short on a slow runner or
      # waste time on a fast one.
      - name: Wait for /healthcheck
        run: |
          for i in $(seq 1 30); do
            if curl -fsSk https://localhost:8081/healthcheck; then
              echo
              echo "STS answered /healthcheck after ${i} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "STS never answered /healthcheck." >&2
          exit 1

      # The two tools below are the test suite's own, run on the runner rather
      # than in the image (the service image has no tests directory). They
      # need one package the service's install would otherwise provide —
      # bunyan, pinned to the version package-lock.json resolves — and a full
      # `npm ci` here would build the whole service a second time for it.
      # NODE_PATH is how node finds it from tests/, which has no node_modules
      # of its own on a fresh checkout.
      - name: Install the smoke-test tools' one dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/smoke" --no-audit --no-fund \
            bunyan@1.8.15
          echo "NODE_PATH=$RUNNER_TEMP/smoke/node_modules" >> "$GITHUB_ENV"

      # The ONE place a run mints /admin-api's token is
      # tests/tools/admin-api-token.js, so this calls it rather than writing
      # the client id, grant and form out a second time. NODE_TLS_REJECT_
      # UNAUTHORIZED=0 is `-k`'s reason above: the certificate is regenerated
      # on every start, and the question here is not whether it is trusted.
      - name: Mint an /admin-api access token
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: |
          token=$(STS_ADMIN_API_CLIENT_SECRET="${ADMIN_API_CLIENT_SECRET}" \
            node tests/tools/admin-api-token.js https://localhost:8081)
          test -n "${token}"
          echo "::add-mask::${token}"
          echo "STS_ADMIN_API_TOKEN=${token}" >> "$GITHUB_ENV"

      # A second, sharper check on the same running container. The metadata
      # page at /admin/sts-metadata
      # reads the endpoint list from the live Express router, so it answers only
      # once every protocol module has registered its routes — a module that
      # loaded but registered nothing, or a require order that changed, shows up
      # here and not in the liveness probe.
      #
      # It is a CONSOLE page, behind a gate that cannot be turned off, so the
      # check signs in first — through tests/vendored/console_signin.js's
      # authorization code flow, which tests/tools/container-smoke.js calls —
      # and asks for 200 AND an endpoint list. A bare status check on this path
      # is what passed for weeks and then failed on a 303.
      - name: Check /admin/sts-metadata answers
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: node tests/tools/container-smoke.js https://localhost:8081

      # THE IMAGE REPORTS THE BUILD IT WAS STAMPED WITH, which is the only
      # place that claim can be checked at all: the stamp is written during the
      # image build, and every other test in this repository runs against a
      # service started from a checkout, where there IS no stamp and the number
      # is computed at startup. So `stamped: true` and the build number reaching
      # the version are exactly what no other test can see.
      #
      # It also catches the specific way this goes quietly wrong: a `--stamp`
      # that failed, or a `version.json` that ended up in the wrong directory,
      # leaves a container computing its version at startup and reporting a
      # perfectly plausible number that changes on every restart.
      #
      # `/admin-api` rather than the front page: it answers JSON and carries
      # `build` and `stamped` as fields rather than as something to be parsed
      # out of HTML. It is gated since 2026-09-09, so the request carries the
      # token minted above.
      - name: Check the image reports the build it was stamped with
        run: |
          body=$(curl -fsSk -H "Authorization: Bearer ${STS_ADMIN_API_TOKEN}" \
            https://localhost:8081/admin-api)
          echo "${body}" | head -8
          echo "${body}" | grep -q '"build": "${{ steps.build-number.outputs.build }}"' || {
            echo "The image did not report BUILD_NUMBER=${{ steps.build-number.outputs.build }}." >&2
            echo "The Dockerfile's --stamp step did not reach the image." >&2
            exit 1
          }
          echo "${body}" | grep -q '"stamped": true' || {
            echo "The container computed its version at startup rather than" >&2
            echo "reading a stamp, so its build number would change on every" >&2
            echo "restart." >&2
            exit 1
          }

      # The PEP's liveness only: it starts, binds 9090 and answers
      # /healthcheck. Registering with a PDP needs a client certificate a
      # realm issued, which the test stacks arrange and this job does not; a
      # PEP that cannot reach its PDP keeps retrying and stays live, which
      # is the behaviour xacml-pep/CLAUDE.md argues.
      - name: Check the XACML PEP image starts
        run: |
          docker run -d --name pep-ci -p 9090:9090 \
            -e PEP_PDP_URL=https://localhost:8081 rcbj/xacml-pep:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9090/healthcheck; then
              echo
              echo "The PEP answered /healthcheck after ${i} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "The PEP never answered /healthcheck." >&2
          docker logs pep-ci >&2 || true
          exit 1

      # ---------------------------------------------------------------------
      # PUBLISH THE IMAGE (2026-10-02), only after every check above passed,
      # so nothing published failed to start, register its routes or report
      # its stamp.
      #
      # Tagged M.N.O, the version the image itself reports (read out of its
      # version.json, so the tag and the stamp cannot disagree), and a
      # floating tag per branch: `latest` from main, which is what a release
      # is, and `develop` from develop. A run started by hand from another
      # branch publishes nothing. The image's
      # org.opencontainers.image.revision label names the commit.
      #
      # NOT ghcr.io/rcbj/iya-sts/<name>. That namespace is the test stack's
      # (tests.yml pushes ghcr.io/rcbj/iya-sts/sts and its siblings under the
      # commit and the branch, built for the test stacks) and the mirror's;
      # sharing a name would let one workflow overwrite the other's tag.
      #
      # A NEW ghcr.io PACKAGE STARTS PRIVATE. The image's
      # org.opencontainers.image.source label links it to this repository,
      # but the first push still creates it private, and no API can change
      # that: make it public ONCE, under Package settings -> Danger Zone ->
      # Change visibility. Every later push keeps the setting.
      #
      # DOCKER HUB, the iyasec organization, logs in with a personal access
      # token held in two repository secrets, the parent project's:
      # DOCKERHUB_USERNAME (an account that may push to iyasec) and
      # DOCKERHUB_TOKEN (Read & Write). A build that should publish and has
      # neither FAILS rather than publishing to one registry of two, which
      # would leave the tags disagreeing. A repository a first push creates
      # takes the organization's default visibility: create iyasec/iya-sts
      # public before the first push, or make iyasec's default public.
      # ---------------------------------------------------------------------
      - name: Decide what to publish
        id: publish-plan
        run: |
          set -euo pipefail
          case "${{ github.ref_name }}" in
            main)    FLOAT=latest ;;
            develop) FLOAT=develop ;;
            *)       FLOAT="" ;;
          esac
          VERSION="$(docker run --rm --entrypoint cat rcbj/sts:ci \
                     version.json | jq -r .version)"
          PEP_VERSION="$(docker run --rm --entrypoint cat \
                         rcbj/xacml-pep:ci version.json | jq -r .version)"
          for v in "${VERSION}" "${PEP_VERSION}"; do
            test -n "${v}" && test "${v}" != null
          done
          echo "float=${FLOAT}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "pep_version=${PEP_VERSION}" >> "$GITHUB_OUTPUT"
          if [ -z "${FLOAT}" ]; then
            echo "Not main or develop: nothing is published."
          else
            echo "Publishing ${VERSION} (PEP ${PEP_VERSION}) and ${FLOAT}."
          fi

      - name: Log in to Docker Hub
        if: ${{ steps.publish-plan.outputs.float != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must both be" \
                 "set as repository secrets to publish to docker.io/iyasec."
            exit 1
          fi
          echo "${DOCKERHUB_TOKEN}" |
            docker login docker.io -u "${DOCKERHUB_USERNAME}" --password-stdin

      - name: Publish the images
        if: ${{ steps.publish-plan.outputs.float != '' }}
        env:
          VERSION: ${{ steps.publish-plan.outputs.version }}
          PEP_VERSION: ${{ steps.publish-plan.outputs.pep_version }}
          FLOAT: ${{ steps.publish-plan.outputs.float }}
        run: |
          set -euo pipefail
          rows=""
          # source image, published name, its version
          while read -r src name version; do
            for registry in ghcr.io/rcbj docker.io/iyasec; do
              dst="${registry}/${name}"
              for tag in "${version}" "${FLOAT}"; do
                docker tag "${src}" "${dst}:${tag}"
                docker push "${dst}:${tag}"
              done
              # One RepoDigests entry per registry; Docker records docker.io
              # repositories without the host.
              repo="${dst#docker.io/}"
              digest="$(docker image inspect --format \
                  '{{range .RepoDigests}}{{println .}}{{end}}' "${src}" |
                  grep -m1 "^${repo}@" || true)"
              rows="${rows}| \`${dst}:${version}\` | \`${digest#*@}\` |"$'\n'
            done
          done <<EOF
          rcbj/sts:ci iya-sts ${VERSION}
          rcbj/xacml-pep:ci iya-sts-xacml-pep ${PEP_VERSION}
          EOF
          {
            echo "### Published images (also \`${FLOAT}\`)"
            echo ""
            echo "| Image | Digest |"
            echo "|---|---|"
            printf '%s' "${rows}"
          } >> "$GITHUB_STEP_SUMMARY"

      # if: always() — when a step above fails, the container's log is the only
      # place the reason exists (a MODULE_NOT_FOUND, a context file that was not
      # copied), and it is gone as soon as the runner is reclaimed.
      - name: Container log
        if: always()
        run: docker logs sts-ci || true

      - name: Stop the containers
        if: always()
        run: docker rm -f sts-ci pep-ci || true
