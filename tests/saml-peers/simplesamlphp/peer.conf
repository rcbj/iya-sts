# THE SIMPLESAMLPHP PEER'S VIRTUAL HOST (#191): SimpleSAMLphp's public
# directory at /simplesaml, and the job's four small pages at /peer. Plain HTTP
# on the suite's private bridge, like every peer.
<VirtualHost *:80>
  ServerName saml-ssp
  UseCanonicalName Off
  SetEnv SIMPLESAMLPHP_CONFIG_DIR /var/simplesamlphp/config
  Alias /simplesaml /var/simplesamlphp/public
  <Directory /var/simplesamlphp/public>
    Require all granted
    AllowOverride None
  </Directory>
  Alias /peer /var/www/peer
  <Directory /var/www/peer>
    Require all granted
    DirectoryIndex index.php
  </Directory>
  ErrorLog /run/saml-peer-log/apache_error.log
  LogLevel warn
  CustomLog /run/saml-peer-log/apache_access.log combined
</VirtualHost>
