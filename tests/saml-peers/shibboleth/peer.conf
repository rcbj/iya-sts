# THE SHIBBOLETH PEER'S VIRTUAL HOST (#189). Plain HTTP on the suite's private
# bridge, under the name the job and the service reach it by, so mod_shib
# builds every handler URL on that name (UseCanonicalName). The package's own
# shib.conf loads the module and protects /secure; this adds the one page
# behind it, a CGI that answers the attributes the session holds as JSON.
ServerName http://${SAML_PEER_HOST}:80
UseCanonicalName On
ErrorLog /run/saml-peer-log/apache_error.log
LogLevel warn
CustomLog /run/saml-peer-log/apache_access.log combined

ScriptAlias /peer/env /var/www/cgi-bin/peer-env.py
# LAZY: without a session mod_shib lets the request through with nothing in
# the environment, and the page answers 401 itself — so the job can ask "is
# there a session?" without a sign-in beginning.
<Location /peer/env>
  AuthType shibboleth
  ShibRequestSetting requireSession false
  ShibUseHeaders Off
  require shibboleth
</Location>
