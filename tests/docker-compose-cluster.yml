# ===========================================================================
# tests/docker-compose-cluster.yml — THE `cluster` MODE'S STACK, LAYERED OVER
# docker-compose.yml AND tests/docker-compose-ldap.yml BY ./local-run-tests.sh
# (2026-09-14, issue #46).
#
# **NO LAUNCHER LAYERS IT SINCE 2026-09-16**, when ./local-run-tests.sh was
# removed. `./docker-run-tests.sh --modes=cluster` runs the mode from
# tests/docker-compose-run-tests-cluster.yml instead; "the launcher" below is
# the removed one.
#
# TWO NODES OF THIS SERVICE AGAINST ONE POSTGRES AND ONE OPENBAO, ACTIVE-ACTIVE,
# BEHIND AN L4 LOAD BALANCER THAT OWNS EVERY PUBLISHED PORT. What the mode
# proves and what it does not is in tests/CLAUDE.md; the balancer's own
# decisions are in tests/cluster/haproxy.cfg; the settings are in
# tests/tools/modes.sh, which is still the one definition of a mode.
#
# **AN OVERRIDE RATHER THAN AN EDIT, SO THE OTHER THREE MODES CANNOT CHANGE.**
# The launcher layers this file only when the mode is `cluster`; a `memory`,
# `postgres` or `dispatch` run reads exactly the files it read before.
#
# FOUR THINGS ABOUT IT ARE DECISIONS RATHER THAN MECHANICS:
#
#   NODE A IS THE EXISTING `sts` SERVICE AND NODE B EXTENDS IT. One definition
#   of the container, so the two nodes cannot drift in anything this file does
#   not name — and the cluster REFUSES a node whose must-agree settings differ
#   (`cluster/cluster.js`, AGREEMENT_SETTINGS), so a drift here would be a
#   stack that does not start rather than a quiet difference.
#
#   NEITHER NODE PUBLISHES A PORT; THE BALANCER PUBLISHES THEM ALL. `!reset`
#   empties the ports docker-compose.yml and the LDAP layer gave `sts`, and the
#   balancer takes the SAME host ports under the SAME variables — so every
#   address the launcher computes (the service URL, the LDAP URL, the
#   revocation listener every certificate names) is the balancer's with no
#   second set of names. `!reset` needs compose v2.24 or later.
#
#   NODE B STARTS ONLY ONCE NODE A IS HEALTHY. A simultaneous cold start is
#   handled (the store arbitrates the first key set — `common/CLAUDE.md`), but
#   a suite that depended on a race going either way would be a suite that
#   failed one run in N; the order makes startup deterministic.
#
#   NODE B ADDS NO SPIFFE ADDRESSES. A realm's SPIFFE listeners bind addresses
#   of their own and two containers cannot hold one address; those sockets are
#   node A's, and this mode says so rather than pretending to balance them.
# ===========================================================================
services:
  sts:
    ports: !reset []
    environment:
      - STS_CLUSTER_MODE=${STS_CLUSTER_MODE:-active-active}
      - STS_CLUSTER_NODE_NAME=node-a
      # PROXY PROTOCOL v2 from the balancer and from nowhere else, when the
      # mode turns it on (tests/tools/modes.sh); the trusted proxy is the
      # balancer's pinned address below.
      - STS_PROXY_PROTOCOL=${STS_PROXY_PROTOCOL:-off}
      - STS_TRUSTED_PROXIES=${STS_TRUSTED_PROXIES:-}
      # THE BALANCER'S ADDRESS, as every client names it. It is on
      # AGREEMENT_SETTINGS, the token audience of `/admin-api`, and the issuer
      # of everything — a node reading its base URL off each request would
      # issue under whichever name a caller used.
      - STS_PUBLIC_BASE_URL=${STS_PUBLIC_BASE_URL:-}
      # `localhost` FIRST, because the first name is the host in every
      # certificate's revocation addresses and the jobs here dial from this
      # machine; `sts-lb` for a client on the compose network (the remote PEP).
      - STS_TLS_HOSTNAMES=${STS_TLS_HOSTNAMES:-localhost,sts-lb,sts,sts2,sts-mock,sts.example.com}

  sts2:
    extends:
      # Relative to the PROJECT directory (the first -f file's), not to this
      # file — which is where every other path in a layered file resolves too.
      file: docker-compose.yml
      service: sts
    container_name: ${STS2_CONTAINER_NAME:-sts2}
    hostname: sts2
    ports: !reset []
    networks:
      default:
        ipv4_address: ${STS2_ADDRESS:-172.29.0.20}
    depends_on:
      sts:
        condition: service_healthy
    environment:
      - STS_CLUSTER_MODE=${STS_CLUSTER_MODE:-active-active}
      - STS_CLUSTER_NODE_NAME=node-b
      - STS_PROXY_PROTOCOL=${STS_PROXY_PROTOCOL:-off}
      - STS_TRUSTED_PROXIES=${STS_TRUSTED_PROXIES:-}
      - STS_PUBLIC_BASE_URL=${STS_PUBLIC_BASE_URL:-}
      - STS_TLS_HOSTNAMES=${STS_TLS_HOSTNAMES:-localhost,sts-lb,sts,sts2,sts-mock,sts.example.com}
      - STS_SPIFFE_GRPC_HOST=${STS2_ADDRESS:-172.29.0.20}
      - STS_EXTRA_IPS=
      # tests/docker-compose-ldap.yml gives this to `sts` only; the two nodes
      # must publish the same ldap:// address in what they issue.
      - PKI_DISTRIBUTION_LDAP_PORT=${STS_LDAP_HOST_PORT:-11389}

  sts-lb:
    container_name: ${STS_LB_CONTAINER_NAME:-sts-lb}
    hostname: sts-lb
    # PINNED, because it is the one address both nodes trust a PROXY header
    # from (STS_TRUSTED_PROXIES).
    networks:
      default:
        ipv4_address: ${STS_LB_ADDRESS:-172.29.0.30}
    environment:
      # Read by haproxy.cfg's `.if`: `v2` adds send-proxy-v2 to every server.
      - STS_LB_PROXY_PROTOCOL=${STS_PROXY_PROTOCOL:-off}
    # PINNED, as an image a test result depends on has to be.
    image: haproxy:3.2.23-alpine
    volumes:
      - ./tests/cluster/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "${STS_HOST_PORT:-8081}:8081"
      - "${STS_PKI_HOST_PORT:-8082}:8082"
      - "${STS_LDAP_HOST_PORT:-11389}:389"
    depends_on:
      sts:
        condition: service_healthy
      sts2:
        condition: service_healthy

  # THE REMOTE PEP DIALS THE BALANCER like every other client; the launcher's
  # XACML_PEP_PDP_URL names `sts-lb` in this mode.
  xacml-pep:
    depends_on:
      sts-lb:
        condition: service_started
