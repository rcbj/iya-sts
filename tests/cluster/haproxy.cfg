# ===========================================================================
# tests/cluster/haproxy.cfg — THE LOAD BALANCER IN FRONT OF THE SUITE'S
# `cluster` MODE (2026-09-14, issue #46).
#
# Two nodes of this service (`sts`, node A, and `sts2`, node B) run
# active-active against one postgres, and every port the suite reaches the
# service on is answered HERE and handed to one of them, round robin, per
# CONNECTION. tests/tools/modes.sh defines the mode; tests/CLAUDE.md says what
# it proves and what it does not.
#
# **LAYER 4, TLS PASSED THROUGH, AND THAT IS THE DEPLOYMENT BEING IMITATED
# RATHER THAN A SHORTCUT.** The target is an AWS Network Load Balancer with TCP
# listeners: a balancer that terminated TLS would break mutual TLS on 8443/9443
# (the client certificate is the NODE's to verify), LDAPS, STARTTLS and
# Kerberos, and the node would serve a certificate nobody sees. So `mode tcp`
# everywhere, no certificate here, and the one thing a TCP balancer cannot do
# — tell the node who the client was — is PROXY protocol v2's job (below).
#
# **PER CONNECTION, WHICH IS WHY THE JOBS OPEN ONE PER REQUEST IN THIS MODE.**
# A keep-alive client would put every request of a job on whichever node
# answered its first connect, and the mode would be two nodes of which each job
# saw one. tests/tools/fresh-connections.js is the other half of this file.
#
# **NOT HERE, AND SAID WHERE A READER WOULD LOOK FOR IT:**
#   * UDP 88. HAProxy balances TCP only; the KDC's datagram socket is reached on
#     node A directly (`sts:88/udp`) or not at all. The suite speaks Kerberos
#     over MS-KKDCP (HTTPS, balanced) and TCP.
#   * A realm's SPIFFE listeners, which bind ADDRESSES of their own on one node
#     (spiffe/CLAUDE.md). A per-node socket has no balanced equivalent.
#   * The remote XACML PEP container, which is a different program and dials
#     the balancer like any other client.
# ===========================================================================

global
  log stdout format raw local0 info
  # One process; this balancer's load is one test runner.
  nbthread 2

# ---------------------------------------------------------------------------
# DOCKER'S EMBEDDED DNS, so a node recreated by compose is found at whatever
# address it came back on. The addresses are pinned in the compose file today,
# which makes this belt and braces — and a balancer that resolved a name once,
# at start, is the kind of thing that turns a restarted node into a silent
# half-cluster.
# ---------------------------------------------------------------------------
resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 5s

defaults
  mode tcp
  log global
  option tcplog
  option dontlognull
  balance roundrobin
  timeout connect 5s
  # Long, because an LDAP bulk load holds one connection for minutes and a job
  # waiting out a sixty-second lifetime holds a browser's for longer.
  timeout client 30m
  timeout server 30m
  # -------------------------------------------------------------------------
  # HEALTH CHECKS ARE TCP CONNECTS (`check`), every two seconds, three misses
  # to take a node out and two answers to put it back. A connect is what an
  # NLB's TCP target-group check does too; the HTTP readiness question is
  # asked by each container's own healthcheck, which compose waits on before
  # this container starts.
  #
  # `init-addr last,libc,none` lets the balancer START with a node that does
  # not resolve yet and pick it up through the resolver above, rather than
  # refusing to start.
  #
  # PROXY PROTOCOL v2 (2026-09-14) — ON BY DEFAULT IN THIS MODE, and the
  # switch is `STS_LB_PROXY_PROTOCOL` in this container's environment, which
  # the compose layer sets from the launcher (`v2`, or `off` when a run asks
  # for STS_TEST_CLUSTER_PROXY_PROTOCOL=off).
  #
  # Without it every connection reaches a node from THIS container's address,
  # so the rate limiter, the audit log and LDAP's throttling all see one
  # client. With it, each connection starts with a PROXY v2 header naming the
  # real peer, and both nodes run with `global.proxyProtocol=v2` and this
  # container's address as their one trusted proxy — which REQUIRES the header
  # from here and refuses a non-loopback connection from anywhere else, so a
  # client that reached a node around the balancer is refused rather than
  # believed.
  #
  # `check-send-proxy` as well, so a health check carries a header too; a node
  # that requires one would otherwise see a trusted peer that never sends it.
  # -------------------------------------------------------------------------
.if streq("$STS_LB_PROXY_PROTOCOL",v2)
  default-server check inter 2s fall 3 rise 2 resolvers docker init-addr last,libc,none send-proxy-v2 check-send-proxy
.else
  default-server check inter 2s fall 3 rise 2 resolvers docker init-addr last,libc,none
.endif

# THE MAIN PORT — HTTPS, and nearly all of the suite.
listen main_https
  bind :8081
  server node-a sts:8081
  server node-b sts2:8081

# THE PLAIN-HTTP REVOCATION LISTENER: CRLs, OCSP and CA certificates, at the
# address every issued certificate names.
listen pki_http
  bind :8082
  server node-a sts:8082
  server node-b sts2:8082

# THE TWO TLS LISTENERS whose content is what the node saw of the handshake.
listen tls_8443
  bind :8443
  server node-a sts:8443
  server node-b sts2:8443

listen mtls_9443
  bind :9443
  server node-a sts:9443
  server node-b sts2:9443

# THE DIRECTORY, plain and LDAPS. One connection is one bind's lifetime, so a
# job's LDAP traffic is balanced per connection like everything else.
listen ldap
  bind :389
  server node-a sts:389
  server node-b sts2:389

listen ldaps
  bind :636
  server node-a sts:636
  server node-b sts2:636

# THE KDC OVER TCP. (UDP 88 is not balanced — see the header.)
listen kdc_tcp
  bind :88
  server node-a sts:88
  server node-b sts2:88

# THE EMBEDDED DEBUGGER'S LISTENER. In a stack built without the debugger
# nothing listens on 8444 and both servers are reported DOWN in this
# container's log; the frontend still binds and refuses, which is what a
# client of a node without it would see too.
listen debugger
  bind :8444
  server node-a sts:8444
  server node-b sts2:8444
