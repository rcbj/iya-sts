# ===========================================================================
# tests/cluster/pep-haproxy.cfg — THE LOAD BALANCER IN FRONT OF THE SUITE'S
# TWO-MEMBER REMOTE PEP CLUSTER (2026-11-16).
#
# The suite's copy of the demonstration instance's balancer on 8081
# (iya-sts-8081/pep-haproxy.cfg, rcbj: "Model it after the two node remote
# pep cluster we have on 8081"), with the members renamed to the stack's
# `pep-cluster-1` and `pep-cluster-2`. ./run-tests.sh starts it under the
# `pep-cluster` compose profile (docker-compose-run-tests.yml), and
# tests/protocol/sts_xacml_pep_proxy_cluster.js drives it.
#
# HAProxy 3.2, `mode tcp`, TLS passed through, a TCP-connect health check,
# Docker's DNS so a recreated container is found again. A layer-4 balancer
# leaves each PEP's own listener certificate for the client to verify, which
# is the deployment being imitated: each member's pair is issued by the realm
# it registered to and names the balancer as well as the member.
#
# TWO LISTENERS, the two HTTPS ports a client of these PEPs dials:
#   * 9543, the reverse proxy, STICKY BY SOURCE ADDRESS. A proxy sign-on
#     session is held in memory on one PEP, and a layer-4 balancer cannot see
#     the session cookie, so one client must stay on one member. The job
#     asserts it: a session made through this listener keeps working through
#     it, and is honoured by exactly one member when each is dialled direct.
#   * 9443, the decision API, ROUND ROBIN per connection. The job asserts both
#     members answer behind it (GET / names the PEP that answered).
# 9090 is not here: each member's plain listener is dialled directly.
#
# A member is DOWN until the job has written its listener pair, because
# nothing listens on 9443 or 9543 before that; `init-addr none` lets the
# balancer start anyway. PROXY protocol is OFF: the PEP reads no PROXY header,
# and one would be the first bytes of a TLS handshake.
# ===========================================================================

global
  log stdout format raw local0 info
  nbthread 2

resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 5s

defaults
  mode tcp
  log global
  option tcplog
  option dontlognull
  balance roundrobin
  timeout connect 5s
  timeout client 5m
  timeout server 5m
  default-server check inter 2s fall 3 rise 2 resolvers docker init-addr last,libc,none

listen proxy_https
  bind :9543
  balance source
  server pep-a pep-cluster-1:9543
  server pep-b pep-cluster-2:9543

listen decision_https
  bind :9443
  server pep-a pep-cluster-1:9443
  server pep-b pep-cluster-2:9443
