# ===========================================================================
# tests/docker-compose-run-tests-cluster.yml — THE `cluster` MODE'S STACK FOR
# THE CONTAINERIZED RUNNER, LAYERED OVER docker-compose-run-tests.yml BY
# ./run-tests.sh (2026-09-14, issue #46).
#
# TWO PRODUCTION NODES OF THIS SERVICE (product mode, request workers — since
# 2026-09-21) AGAINST ONE POSTGRES AND ONE OPENBAO, ACTIVE-ACTIVE, BEHIND AN L4
# LOAD BALANCER. What the mode proves and what it does not is in
# tests/CLAUDE.md; the balancer's own decisions are in
# tests/cluster/haproxy.cfg; the settings are in tests/tools/modes.sh, which is
# still the one definition of a mode. **An override rather than an edit**: the
# launcher layers this file only for `cluster`, so no other mode reads it.
#
# (It had a twin, tests/docker-compose-cluster.yml, layered over
# docker-compose.yml by ./local-run-tests.sh. Nothing layered it once that
# launcher was removed on 2026-09-16, and it was deleted on 2026-09-21; its
# header was the argument for both, and what of it still applies is here.)
#
# FOUR THINGS ABOUT IT ARE DECISIONS RATHER THAN MECHANICS:
#
#   NODE A IS THE EXISTING `sts` SERVICE AND NODE B EXTENDS IT. One definition
#   of the container, so the two nodes cannot drift in anything this file does
#   not name — including everything the launcher generates per run for a
#   product-mode mode (the Kerberos passwords, the pinned base URL) — and the
#   cluster REFUSES a node whose must-agree settings differ
#   (`cluster/cluster.js`, AGREEMENT_SETTINGS), so a drift would be a stack
#   that does not start rather than a quiet difference.
#
#   NOTHING IS PUBLISHED. The runner is a container on this network and dials
#   the balancer by name, so every address it is handed is the balancer's.
#
#   NODE B STARTS ONLY ONCE NODE A IS HEALTHY, and the balancer once both are.
#   A simultaneous cold start is handled (the store arbitrates the first key
#   set — `common/CLAUDE.md`), but a suite that depended on a race going
#   either way would fail one run in N; the order makes startup deterministic.
#
#   NODE B ADDS NO SPIFFE ADDRESSES. A realm's SPIFFE listeners bind addresses
#   of their own and two containers cannot hold one address; those sockets are
#   node A's, and this mode says so rather than pretending to balance them.
#
# **THE ADDRESSES THE RUNNER IS HANDED ARE THE LAUNCHER'S**, as they are in
# every mode: STS_TEST_SERVICE_URL, STS_LDAP_URL, STS_PUBLIC_BASE_URL and the
# two PKI distribution values arrive through the compose environment naming
# `sts-lb`. This file adds what the base file has no variable for.
# ===========================================================================
services:
  sts:
    environment:
      - STS_CLUSTER_MODE=${STS_CLUSTER_MODE:-active-active}
      - STS_CLUSTER_NODE_NAME=node-a
      # PROXY PROTOCOL v2 from the balancer and from nowhere else, when the
      # mode turns it on (tests/tools/modes.sh); the trusted proxy is the
      # balancer's pinned address below.
      - STS_PROXY_PROTOCOL=${STS_PROXY_PROTOCOL:-off}
      - STS_TRUSTED_PROXIES=${STS_TRUSTED_PROXIES:-}
      - STS_PUBLIC_BASE_URL=${STS_PUBLIC_BASE_URL:-https://sts-lb:8081}
      # `sts-lb` among the names, because it is the name every client here
      # verifies; the rest are the default list's.
      - STS_TLS_HOSTNAMES=${STS_TLS_HOSTNAMES:-sts-lb,localhost,sts,sts2,sts-mock,sts.example.com}

  sts2:
    extends:
      # Relative to the project directory, as every path in a layered file is.
      file: docker-compose-run-tests.yml
      service: sts
    container_name: ${STS2_CONTAINER_NAME:-sts-docker-tests-node-b}
    hostname: sts2
    networks:
      default:
        ipv4_address: ${STS2_ADDRESS:-172.30.0.20}
    depends_on:
      sts:
        condition: service_healthy
    environment:
      - STS_CLUSTER_MODE=${STS_CLUSTER_MODE:-active-active}
      - STS_CLUSTER_NODE_NAME=node-b
      - STS_PROXY_PROTOCOL=${STS_PROXY_PROTOCOL:-off}
      - STS_TRUSTED_PROXIES=${STS_TRUSTED_PROXIES:-}
      - STS_PUBLIC_BASE_URL=${STS_PUBLIC_BASE_URL:-https://sts-lb:8081}
      - STS_TLS_HOSTNAMES=${STS_TLS_HOSTNAMES:-sts-lb,localhost,sts,sts2,sts-mock,sts.example.com}
      - STS_SPIFFE_GRPC_HOST=${STS2_ADDRESS:-172.30.0.20}
      - STS_EXTRA_IPS=

  sts-lb:
    container_name: ${STS_LB_CONTAINER_NAME:-sts-docker-tests-lb}
    hostname: sts-lb
    # PINNED, because it is the one address both nodes trust a PROXY header
    # from (STS_TRUSTED_PROXIES).
    networks:
      default:
        ipv4_address: ${STS_LB_ADDRESS:-172.30.0.30}
    environment:
      # Read by haproxy.cfg's `.if`: `v2` adds send-proxy-v2 to every server.
      - STS_LB_PROXY_PROTOCOL=${STS_PROXY_PROTOCOL:-off}
    image: haproxy:3.2.23-alpine
    volumes:
      - ./tests/cluster/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      sts:
        condition: service_healthy
      sts2:
        condition: service_healthy

  xacml-pep:
    environment:
      - PEP_PDP_URL=https://sts-lb:8081/realm/${XACML_PEP_REALM:-pep-e2e}
    depends_on:
      sts-lb:
        condition: service_started

  tests:
    environment:
      # tools/fresh-connections.js and sts_cluster_alternation.js — the mode
      # names both (modes.sh); the base file has no line to carry them.
      - STS_TEST_FRESH_CONNECTIONS=${STS_TEST_FRESH_CONNECTIONS:-1}
      - STS_TEST_CLUSTER_NODES=${STS_TEST_CLUSTER_NODES:-2}
      # THE DEFAULT REALM'S SPIFFE SOCKETS ARE NODE A'S (2026-09-21), for the
      # reason in this file's header — node B adds no SPIFFE address, so the
      # balancer carries neither port and sts_spiffe_grpc.js dialled
      # sts-lb:8092 into a refused connection. It is handed node A's own
      # address, the one the launcher pins as that node's gRPC host, on the
      # two ports `spiffe.workloadPort` and `spiffe.serverPort` default to.
      - STS_SPIFFE_WORKLOAD_URL=${STS_SPIFFE_GRPC_HOST:-172.30.0.10}:8092
      - STS_SPIFFE_SERVER_URL=${STS_SPIFFE_GRPC_HOST:-172.30.0.10}:8181
    depends_on:
      sts-lb:
        condition: service_started
