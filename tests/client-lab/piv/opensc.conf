# OpenSC FOR THE PIV CARD ALONE (#2059): OPENSC_CONF=/opt/client-lab/piv/
# opensc.conf. With every driver on, OpenSC also offers the OpenPGP card in
# slot 0 as two PKCS#11 tokens, and a pkcs11: URI naming a key by its id
# (%01 is PIV Authentication) can then match the OpenPGP card's first; with
# only the PIV driver, the PIV card is the module's one token. scdaemon
# reads the OpenPGP card through pcscd and never through OpenSC.
app default {
  card_drivers = PIV-II;
}
