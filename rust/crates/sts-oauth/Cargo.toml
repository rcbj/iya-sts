[package]
name = "sts-oauth"
version = "0.1.0"
description = "The authorization server and OpenID provider (oauth-oidc/). The resource-server checks, DPoP, mTLS, revocation, and the authorization server's core: client authentication, the code flow, the token endpoint, access and refresh tokens, discovery and the JWKS."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
sts-core.workspace = true
sts-cluster.workspace = true
base64.workspace = true
serde_json.workspace = true
tracing.workspace = true
sts-crypto.workspace = true
url.workspace = true
sts-http.workspace = true
sts-store.workspace = true
sts-registers.workspace = true
sts-authn.workspace = true
sts-credentials.workspace = true
axum.workspace = true
chrono.workspace = true
serde.workspace = true
regex.workspace = true
tokio = { workspace = true, features = ["time", "sync"] }

[dev-dependencies]
# The tests make certificates of their own to fingerprint.
openssl.workspace = true
tokio = { workspace = true, features = ["test-util"] }
# The identity funnel's fold and persona, checked against Node beside this
# crate's own vectors (tests/oauth7_vectors.rs).
sts-directory.workspace = true

[lints]
workspace = true
