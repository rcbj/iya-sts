[package]
name = "sts-core"
version = "0.1.0"
description = "What every crate shares: the bunyan log, the version, the error codes."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
idna.workspace = true
indexmap.workspace = true
rquickjs.workspace = true
base64.workspace = true
reqwest.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The cloud providers of `secrets` (see the features below).
aws-config = { workspace = true, optional = true }
aws-sdk-secretsmanager = { workspace = true, optional = true }
aws-sdk-kms = { workspace = true, optional = true }
google-cloud-secretmanager-v1 = { workspace = true, optional = true }
google-cloud-kms-v1 = { workspace = true, optional = true }
google-cloud-auth = { workspace = true, optional = true }
azure_core = { workspace = true, optional = true }
azure_identity = { workspace = true, optional = true }
azure_security_keyvault_secrets = { workspace = true, optional = true }
azure_security_keyvault_keys = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }

# THE CLOUD SDKS ARE FEATURES, ON BY DEFAULT: the service binary carries all
# three, and a build without one refuses that provider at start with
# STS-KEYS-0045, the code Node gives a provider whose SDK is not installed.
[features]
default = ["aws", "gcp", "azure"]
aws = ["dep:aws-config", "dep:aws-sdk-secretsmanager", "dep:aws-sdk-kms"]
gcp = [
  "dep:google-cloud-secretmanager-v1",
  "dep:google-cloud-kms-v1",
  "dep:google-cloud-auth",
]
azure = [
  "dep:azure_core",
  "dep:azure_identity",
  "dep:azure_security_keyvault_secrets",
  "dep:azure_security_keyvault_keys",
  "dep:async-trait",
]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# The OpenBao test's key normalizer; the service's is sts-crypto's.
openssl.workspace = true

[build-dependencies]
serde_json.workspace = true

[lints]
workspace = true
