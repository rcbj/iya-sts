# Stand-alone compose file for the mock STS: `docker compose up --build`.
#
# In the project this was extracted from the STS is one service among nine
# (local-tests.yml), all on host networking so that Keycloak, the api, the client
# and this share one loopback. Here it is alone, so the two things that came from
# that file are the ones that are about the STS itself: the image/build pair and
# the healthcheck probe.
#
# Compose format 2.4, matching the parent project's files. This file uses
# `depends_on: condition:` (`service_healthy` and
# `service_completed_successfully`) now that it brings up several services, and
# the version is also kept the same so this file can be read beside those and so
# docker-compose v1, which treats a file with no `version:` as the v1 format that
# has no `healthcheck` at all, still parses it. Docker Compose v2 and later print
# "the attribute `version` is obsolete" and then ignore the line — that warning is
# the whole cost, and it is not a reason to drop the v1 compatibility.
#
# ---------------------------------------------------------------------------
# SINCE 2026-08-27 THIS FILE BRINGS UP TWO SERVICES AND THREE VOLUMES, BECAUSE
# THIS SERVICE CAN NOW WRITE THINGS DOWN. (Since 2026-09-12 it is five services
# — the three OpenBao ones are below — and the named volumes are listed at the
# bottom of the file.)
#
# What persists is the embedded LDAP directory — which is also where the
# applications registry, the federation register and the SPIFFE registry live,
# because in this service those ARE directory entries — the trust realm
# registry, and the runtime setting changes made in the console. What this
# service MINTS — sessions, tokens, codes, artifacts, tickets — went with the
# process in every mode when this was written, because the signing key was
# regenerated on every start. **That was reversed on 2026-09-06 for product
# mode on postgres**, which is this stack's default (see STS_MODE below): the
# signing keys are kept, sealed, and what is minted is persisted with them.
# persistence/CLAUDE.md says exactly what is kept.
#
# THE PLAIN `docker compose up` RUNS AGAINST POSTGRES. That is the mode this
# file configures because it is the one an operator keeping a mock around for a
# week wants: one database container, a named volume under it, and a directory
# that is still there on Monday. `persistence.mode=ldif` needs no database at
# all and writes an RFC 2849 LDIF file per realm into the same data volume —
# swap the two environment variables below to use it, and the postgres service
# becomes dead weight rather than a requirement.
#
# TWO DATABASE ROLES SINCE 2026-09-06, AND THIS SERVICE DIALS THE SMALLER ONE.
# `postgres/schema.sql` builds the tables as the owner `sts` and creates
# `sts_app`, which holds SELECT, INSERT, UPDATE and DELETE on them and USAGE —
# not CREATE — on the schema; STS_DATABASE_URL below dials that one. So a
# running mock can change every row in its store and cannot add, alter,
# truncate or drop a table in it. The database container runs the script
# itself, through postgres/apply-schema.sh, ON THE START THAT CREATES THE
# CLUSTER — so a `sts-db` volume from before that date has the tables and no
# such role, and `docker compose down -v` is the way to a stack that starts.
# postgres/CLAUDE.md and persistence/CLAUDE.md argue it; do not argue it again
# here.
#
# THE TEST SUITE USED THIS FILE AND NOT ONE WORD OF THIS PARAGRAPH'S SUBJECT,
# AND THE DISTINCTION WAS THE WHOLE POINT. **No launcher brings this file up
# since 2026-09-16**, when `./local-run-tests.sh` was removed; the suite's
# stack is docker-compose-run-tests.yml. The record, kept because the
# substitutions below were made for it: from 2026-08-28 that launcher brought
# the `sts` service below up as the thing its protocol jobs drove, and it did
# so with `STS_PERSISTENCE_MODE=memory` and `--no-deps`, which meant no
# database, no volume that matters and nothing carried from one run to the
# next. A test that persisted would be a test whose second run started from the
# first run's leavings. **SO NEITHER TEST STACK EXERCISES THE APPLICATION ROLE
# EITHER** — `--no-deps` meant the postgres service below never started on a
# `./local-run-tests.sh` run, and docker-compose-run-tests.yml had no database
# service at all (it has one since 2026-09-09, as a test store). What the split
# costs a test run is nothing, and what it gains is nothing; it is the plain
# `docker compose up` stack, and an operator's own database, that connect as
# `sts_app`. Dropping `--no-deps` and setting STS_PERSISTENCE_MODE=postgres is
# what a run against it would take, and the paragraph above is why no run does
# that by default. The parent project's stack is unchanged and unaffected: it
# starts this service with its own configuration and `persistence.mode` at its
# default of `memory`, which is why not one job there had to change either.
#
# (That describes the default launch. `tests/tools/modes.sh` since runs the
# suite in `postgres` and `dispatch` modes as well, which bring the database up
# — see that file.)
#
# THE THREE VOLUMES this paragraph was written about, and why the third is a
# bind mount rather than a named one (the secret-store and key volumes added
# since are described at the bottom of the file):
#
#   sts-db     PostgreSQL's own data. Named, because nothing outside the
#              database container has any business reading it.
#   sts-data   /usr/src/sts/data — where ldif mode writes, and where nothing is
#              written in postgres mode. It is mounted in BOTH modes anyway, so
#              that switching the mode is one environment variable rather than
#              an environment variable and a volume.
#   ./env      A BIND MOUNT of this repository's appconfig directory, so that
#              editing env/local.js on the host changes what the container reads
#              on its next start without a rebuild. It is the appconfig half of
#              what was asked for and it is deliberately NOT the same mechanism
#              as the durable setting changes: those go into the store, because
#              a service that rewrote a file checked into a repository would
#              leave somebody's forgotten experiment behind permanently. So the
#              file is what a person EDITS and the store is what the console
#              WRITES, and neither overwrites the other — the store's values sit
#              above the file's in the same five-layer order they always did.
# ---------------------------------------------------------------------------
# EVERY VALUE A CALLER MIGHT HAVE TO MOVE IS A `${VAR:-default}` SINCE
# 2026-08-28, AND THE DEFAULTS ARE WHAT THIS FILE ALWAYS HAD.
#
# `docker compose up --build` in this directory is the stack it was in every
# respect but one: container `sts` on host port 8081, `sts-postgres` beside it,
# persistence in postgres. THE ONE EXCEPTION IS THE SCHEME — that port is HTTPS
# since 2026-08-30, so `curl http://localhost:8081/...` no longer answers and
# `curl -k https://localhost:8081/...` does. The row on the service argues it;
# `STS_HTTPS=false` is the way back.
#
# What the substitutions bought was a SECOND caller: `./local-run-tests.sh`
# brought this same file up as the service its protocol jobs drove, until it was
# removed on 2026-09-16. They are kept — a hand run beside a person's own stack
# needs the same four — and that run needed four things to differ, every one of
# them a thing that would otherwise break somebody else's work on this machine:
#
#   STS_HOST_PORT               a free port, chosen per run, because 8081 is
#                               where a person's own stack already is — and
#                               under a fixed mapping compose does not merely
#                               share it, it FAILS to bind and the run reports
#                               a stack that never came up.
#   STS_CONTAINER_NAME          `container_name` is a machine-wide name, so a
#   STS_POSTGRES_CONTAINER_NAME test run reusing `sts` would refuse to start
#                               while a dev container held it — and, worse,
#                               `down` at the end would remove the dev one.
#   STS_PERSISTENCE_MODE        `memory` for a test run. THIS IS NOT A TUNING
#                               CHOICE: a suite that persisted would be a suite
#                               whose second run started from the first run's
#                               leavings, which is the failure that looks like
#                               a flaky test and is not one. The launcher also
#                               passes `--no-deps`, so the postgres service
#                               below is never started for a test run at all.
#   CONFIG_FILE                 the appconfig layer, for the same reason it is
#                               settable everywhere else.
#
# `STS_HTTPS` was added to that set on 2026-08-30 and is NOT one of the four
# above: nothing needs it to differ, and its default is what every caller
# wants. It is a substitution so that `STS_HTTPS=false` is available to a
# client that cannot be taught to trust a certificate regenerated on every
# start — see the row on the service itself, which is where the argument is.
#
# `STS_LOG_LEVEL` is a BARE entry rather than a substitution, and that is not a
# style difference: an EMPTY value is not a harmless default here. bunyan
# throws `unknown level name: ""` while this service is still loading its
# modules, so it never listens, and the run then reports a service that would
# not answer rather than a log level. A bare key is passed through only when
# the host environment actually has it, so unset means unset.
#
# NOTE FOR ANYONE ADDING A VALUE HERE: `sudo` empties the environment, so a
# launcher that needs sudo for docker has to name each variable on the sudo
# command line. A launcher's COMPOSE_ENV array, which `tests/tools/compose.sh`
# hands to compose, is that list (`local-run-tests.sh`'s COMPOSE_FORWARDED_VARS
# was, until that launcher was removed on 2026-09-16), and a substitution added
# below with no row there substitutes to its DEFAULT with nothing said — which
# is how the parent project's stack spent months ignoring every tuning variable
# it was given.
# ---------------------------------------------------------------------------
version: '2.4'
services:
  # -------------------------------------------------------------------------
  # THE STORE. PostgreSQL 18 (it was 16 on alpine until 2026-08-30 — see the
  # `image` line) — this is a mock identity service's sidecar and not a
  # production database, so what matters is that it starts in seconds.
  #
  # ITS PORT IS NOT PUBLISHED, deliberately, and it is the same argument the
  # directory's 389 and 636 make below: 5432 is the assigned Postgres port, so a
  # host already running one — which is the host most likely to be running this
  # — fails to start the stack with a binding error naming a service nobody was
  # thinking about. Uncomment the mapping to look inside with psql.
  #
  # THE PASSWORD IS IN THIS FILE IN PLAIN TEXT and that is correct here: it
  # guards a throwaway database of mock identities on a private compose network,
  # this repository's whole premise is that nothing in it is a real credential,
  # and an operator who needs a real one sets STS_DATABASE_URL themselves. What
  # this service does NOT do is echo the connection string back — /admin/persistence
  # and GET /admin-api/persistence report the host, port, database and user
  # parsed out of it, because those two answers are one fetch away from a log.
  # -------------------------------------------------------------------------
  postgres:
    container_name: ${STS_POSTGRES_CONTAINER_NAME:-sts-postgres}
    hostname: postgres
    # POSTGRES 18, AND NOT -alpine. The alpine variant ships busybox and no
    # bash; the two scripts below are bash, and openssl is in the Debian image
    # already. It was `postgres:16-alpine` until 2026-08-30.
    #
    # **A MAJOR UPGRADE DOES NOT READ THE OLD DATA DIRECTORY.** A `sts-db`
    # volume written by 16 makes an 18 container exit with "database files are
    # incompatible with server", naming the versions. `docker compose down -v`
    # is the answer: what this volume holds is the directory, the realm
    # registry and the appconfig overrides — the three things somebody TYPED —
    # and, in product mode (this stack's default), the sealed signing keys and
    # what this service minted, which go with it.
    image: postgres:18
    environment:
      # THE OWNER, AND SINCE 2026-09-06 IT IS NOT THE ROLE THIS SERVICE DIALS
      # WITH. This one is the cluster's bootstrap superuser: it is what initdb
      # creates, what the healthcheck below probes with, and what runs
      # postgres/schema.sql — so it is the role that OWNS the tables and
      # the only one that can change them. The service connects as
      # STS_DB_APP_USER instead; see the two variables below and
      # STS_DATABASE_URL on the sts service.
      - POSTGRES_USER=sts
      - POSTGRES_PASSWORD=sts
      - POSTGRES_DB=sts
      # ---------------------------------------------------------------------
      # THE APPLICATION ROLE: READ AND WRITE THE ROWS, AND NOTHING ELSE.
      #
      # postgres/apply-schema.sh creates it on the start that creates the
      # cluster, with SELECT, INSERT, UPDATE and DELETE on the schema and no
      # CREATE anywhere — so this service cannot add, alter, drop or truncate
      # a table in the database it persists to. postgres/schema.sql argues it
      # at length and is runnable by hand against any other database.
      #
      # THE VALUES ARE SPELT HERE AND AGAIN IN STS_DATABASE_URL BELOW, because
      # a connection string is one string and compose cannot build it out of
      # these without making the override case (`STS_DATABASE_URL=...`)
      # ambiguous. Changing the role means changing both, and
      # tests/postgres_schema.js is what notices if only one of them moves.
      #
      # THE PASSWORD IS IN THIS FILE IN PLAIN TEXT for the reason the header
      # gives about the superuser's: it guards a throwaway database of mock
      # identities on a private bridge network.
      # ---------------------------------------------------------------------
      - STS_DB_APP_USER=${STS_DB_APP_USER:-sts_app}
      - STS_DB_APP_PASSWORD=${STS_DB_APP_PASSWORD:-sts_app}
    volumes:
      # ONE MOUNT AT /var/lib/postgresql, NOT AT .../data, AND 18 IS WHY.
      # These images store the cluster in a major-version-specific directory
      # from 18 onwards (/var/lib/postgresql/18/docker), so that
      # `pg_upgrade --link` can work across a single mount point. A volume at
      # the old .../data path makes the container REFUSE TO START, with a
      # message naming "unused mount/volume" — which reads as a warning and is
      # fatal. See docker-library/postgres#1259.
      #
      # The TLS pair lives INSIDE this volume (/var/lib/postgresql/tls) rather
      # than in a mount of its own, because a second mount underneath this one
      # is exactly the shape the image just refused. One volume, cleared by
      # `docker compose down -v`, holding the cluster and the key pair that
      # protects it.
      - sts-db:/var/lib/postgresql
      - ./postgres/generate-tls.sh:/usr/local/bin/generate-tls.sh:ro
      # Runs ONCE, on the start that creates the cluster, and turns every
      # `host` rule in pg_hba.conf into `hostssl`. See the script.
      - ./postgres/require-tls.sh:/docker-entrypoint-initdb.d/00-require-tls.sh:ro
      # AND THEN THE SCHEMA, on the same one start. `10-` so that it sorts
      # after the TLS hardening above; the DDL itself is mounted OUTSIDE
      # /docker-entrypoint-initdb.d on purpose, because the entrypoint runs
      # every *.sql in that directory itself, with no way to pass the role name
      # and password — it would run a second time with the defaults and undo
      # whatever STS_DB_APP_PASSWORD said.
      #
      # **NEITHER RUNS AGAIN ON A VOLUME THAT ALREADY HAS A CLUSTER IN IT.** A
      # sts-db volume written before 2026-09-06 has the tables and no
      # application role, and the sts container then restart-loops with
      # `password authentication failed for user "sts_app"`. `docker compose
      # down -v` is the answer, and what it throws away is the directory, the
      # realms and the appconfig overrides — and, in product mode, the sealed
      # keys and what was minted under them.
      - ./postgres/apply-schema.sh:/docker-entrypoint-initdb.d/10-apply-schema.sh:ro
      - ./postgres/schema.sql:/usr/local/share/sts/schema.sql:ro
    # THE KEY PAIR IS MADE BEFORE THE SERVER STARTS, which is why this is a
    # `command` wrapper and not an initdb script: `ssl_cert_file` is read when
    # the server boots, and an initdb script runs after that has already
    # happened once. `exec` so that postgres keeps pid 1 and still receives the
    # stop signal.
    command: >
      bash -c '/usr/local/bin/generate-tls.sh &&
      exec docker-entrypoint.sh postgres
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/tls/server.crt
      -c ssl_key_file=/var/lib/postgresql/tls/server.key'
    # ports:
    #   - "5432:5432"
    # `pg_isready` rather than a psql query: it is what the image ships for
    # exactly this, and the sts service below waits on it. THE WAIT IS NOT
    # OPTIONAL. Without it the STS starts first about half the time and fails
    # to connect — and since 2026-08-28 that is FATAL: a configured store that
    # cannot be opened stops the process rather than letting it run out of a
    # seeded directory while presenting itself as the one that was configured.
    # So the stack would come up with the sts container in a restart loop.
    #
    # This comment used to say the opposite half of that — that the STS logged
    # the failure and CARRIED ON, which was "the right behaviour for a mock (a
    # database outage must not take down sixteen protocol families) and the
    # wrong way to start a stack, because the restored directory would silently
    # not be there". The second clause is why the rule changed; the first is
    # still true of an outage that happens while the service is RUNNING, which
    # is recorded and survivable.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sts -d sts"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ===========================================================================
  # THE SECRET STORE (2026-09-12), AND THE TWO ONE-SHOT CONTAINERS THAT BUILD
  # IT.
  #
  # This stack reads its key-encryption key AND its database password out of
  # OpenBao, over TLS, authenticating with a client certificate the store
  # itself issued and which is bound to a policy that can READ those two values
  # and nothing else. `openbao/CLAUDE.md` argues the whole arrangement; what is
  # here is the wiring.
  #
  # **THREE SERVICES BECAUSE THE BOOTSTRAP HAS THREE STEPS THAT CANNOT SHARE A
  # CONTAINER.** The listener needs a certificate before it starts, so
  # something has to mint one BEFORE the store runs; the store then has to be
  # running before anything can be written into it. Compose expresses that with
  # `service_completed_successfully`, which is what the two one-shot services
  # are for — and it is why `sts` waits on the SEEDER rather than on the store.
  #
  # **BOTH ONE-SHOTS RUN THE IMAGE THIS REPOSITORY BUILDS**, not the OpenBao
  # one: that image is Alpine with `bao` and busybox in it, and every step here
  # needs either a certificate encoder or a JSON parser. Using our own image
  # buys the property worth having — the store's listener certificate comes out
  # of `common/vendored/x509.js`, the same encoder behind every other
  # certificate in this service.
  # ===========================================================================
  openbao-tls:
    container_name: ${STS_BAO_TLS_CONTAINER_NAME:-sts-openbao-tls}
    image: ${STS_IMAGE:-rcbj/sts}
    build:
      context: .
    # It has to exist before the store starts and it must not be restarted
    # afterwards: the pair belongs to the volume and re-minting it would break
    # the anchor the service pins.
    restart: "no"
    environment:
      - STS_BAO_TLS_DIR=/openbao/file/tls
      # The names the certificate answers to. `openbao` is the service name on
      # this bridge, which is what every other container dials.
      - STS_BAO_TLS_NAMES=${STS_BAO_TLS_NAMES:-openbao,localhost}
      - STS_BAO_TLS_IPS=${STS_BAO_TLS_IPS:-127.0.0.1}
    volumes:
      - sts-bao-file:/openbao/file
      - ./openbao/generate-tls.js:/usr/src/sts/openbao/generate-tls.js:ro
    command: ["node", "openbao/generate-tls.js"]

  openbao:
    container_name: ${STS_BAO_CONTAINER_NAME:-sts-openbao}
    hostname: openbao
    image: openbao/openbao:${OPENBAO_TAG:-latest}
    depends_on:
      openbao-tls:
        condition: service_completed_successfully
    # mlock, so the store's memory is never written to swap. It is the one
    # capability this container needs and the reason the image documents it.
    cap_add:
      - IPC_LOCK
    environment:
      # -------------------------------------------------------------------
      # THE UNSEAL KEY, AND IT TRAVELS WITH THE STORE ON PURPOSE HERE.
      #
      # `seal "static"` is a real auto seal: the store unseals ITSELF at every
      # start, with no operator and no quorum, which is what lets this stack
      # come up on `docker compose up` and in a test run. What it costs is
      # that the key is in this environment — so the store protects its
      # contents from a reader of the DATABASE and not from somebody who can
      # read this stack.
      #
      # **THAT IS THE DEVELOPER-MODE ANSWER AND IT IS OVERRIDABLE, WHICH IS
      # THE POINT.** A deployment sets STS_BAO_SEAL_KEY from its own
      # orchestrator's secret, or replaces the seal stanza in openbao/bao.hcl
      # with `transit`, `awskms`, `gcpckms` or `azurekeyvault` — one stanza,
      # same auto-unseal behaviour, key held somewhere this stack cannot read.
      #
      # It MUST be base64 of exactly 32 bytes. 31 fails initialisation with
      # `invalid key size` and leaves the storage dirty.
      - BAO_STATIC_SEAL_CURRENT_KEY_ID=${STS_BAO_SEAL_KEY_ID:-sts}
      - BAO_STATIC_SEAL_CURRENT_KEY=${STS_BAO_SEAL_KEY:-KSVmckTNY246XdLbpfIzGbuXvgZqAOPzsrF4itdFTvo=}
    volumes:
      - ./openbao/bao.hcl:/openbao/config/bao.hcl:ro
      - sts-bao-file:/openbao/file
    command: ["server", "-config=/openbao/config/bao.hcl"]
    # `sys/health` answers 200 only when the store is initialised, unsealed AND
    # active — which is the state the seeder needs and a weaker probe would not
    # catch. 501 means uninitialised and 503 means sealed or standby, so the
    # first start is expected to fail this probe until the seeder has run.
    healthcheck:
      test: ["CMD-SHELL", "bao status -address=https://127.0.0.1:8200 -ca-cert=/openbao/file/tls/server.crt >/dev/null 2>&1 || test -f /openbao/file/seed/root.token"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  openbao-seed:
    container_name: ${STS_BAO_SEED_CONTAINER_NAME:-sts-openbao-seed}
    image: ${STS_IMAGE:-rcbj/sts}
    build:
      context: .
    restart: "no"
    depends_on:
      openbao:
        condition: service_started
    environment:
      - STS_BAO_ADDR=https://openbao:8200
      - STS_BAO_CA_FILE=/openbao/file/tls/server.crt
      - STS_BAO_POLICY_FILE=/usr/src/sts/openbao/read-only.hcl
      - STS_BAO_CLIENT_CN=${STS_BAO_CLIENT_CN:-sts}
      # THE DATABASE PASSWORD COMES FROM ONE PLACE. The same variable the
      # database itself is built with, so the value in the store and the value
      # in postgres cannot drift.
      - STS_DB_APP_PASSWORD=${STS_DB_APP_PASSWORD:-sts_app}
    volumes:
      - sts-bao-file:/openbao/file
      - sts-bao-client:/openbao/client
      - ./openbao/seed.js:/usr/src/sts/openbao/seed.js:ro
      - ./openbao/read-only.hcl:/usr/src/sts/openbao/read-only.hcl:ro
    command: ["node", "openbao/seed.js"]

  sts:
    container_name: ${STS_CONTAINER_NAME:-sts}
    hostname: sts
    # Same image name the parent project builds, so a local `docker compose up`
    # here and the suite there produce the one image rather than two that drift.
    #
    # **AND A TEST RUN NAMES ITS OWN TAG (2026-09-14)**, because an image tag is
    # MACHINE-WIDE exactly as a `container_name` is. `up` of a later mode reuses
    # whatever `rcbj/sts` points at by then, so a second checkout building the
    # same name between two modes of another run swapped the code under that run
    # with nothing said. `STS_IMAGE` unset is the name above, unchanged; the
    # launchers set it when a compose project is named.
    image: ${STS_IMAGE:-rcbj/sts}
    # -----------------------------------------------------------------------
    # THE KEY-ENCRYPTION KEY IS MADE ON THE FIRST START THAT FINDS NONE.
    #
    # Product mode refuses to start without one, and a stack that cannot come
    # up until somebody has read a paragraph is a stack nobody runs. So this
    # mints one into the `sts-secrets` volume the first time and uses it for
    # ever after — which is exactly the property that matters, because a KEK
    # regenerated per start would leave every stored signing key unopenable
    # and the service would refuse to start rather than issue tokens nobody
    # can verify.
    #
    # A `command` wrapper rather than an entrypoint script in the image, and
    # the same shape the postgres service above uses for its TLS material:
    # the generation belongs to THIS stack rather than to the image, because
    # a real deployment mounts a key it manages and must not have one invented
    # for it. `exec` so node keeps pid 1 and still receives the stop signal.
    #
    # 32 bytes from the kernel, base64 — `common/secrets.js` reads the file's
    # contents as the key material.
    #
    # -----------------------------------------------------------------------
    # AND THE MANAGEMENT API'S CLIENT SECRET, ON THE SAME ARGUMENT (2026-09-09).
    #
    # `/admin-api` requires an access token minted by the seeded
    # `sts-management-api` client. Left alone, that client's secret is
    # generated at every start and is readable only THROUGH the API it
    # unlocks — so the default stack would ship an administrative surface
    # nobody could ever obtain a token for, and the first thing anybody would
    # do about it is turn the gate off.
    #
    # **IT IS KEPT IN THE SAME VOLUME AS THE KEK AND FOR THE SAME REASON**: a
    # secret regenerated per start invalidates the credential somebody wrote
    # down, and this stack's whole point is that a restart changes nothing.
    # `ADMIN_API_CLIENT_SECRET` in the environment WINS, because a deployment
    # that manages its own must not have one invented for it — which is why
    # the generated value is only used when the variable is empty.
    #
    # It is READABLE from the volume by design: `docker compose exec sts cat
    # /run/secrets/sts-admin-api-secret` is how an operator gets a token on a
    # stack they own. That is a property of a stack whose database password is
    # also in this file.
    # -----------------------------------------------------------------------
    # -----------------------------------------------------------------------
    # AND THE SECONDARY ADDRESSES THE PER-REALM SPIFFE LISTENERS BIND
    # (2026-09-12).
    #
    # A realm with SPIFFE turned on binds a Workload API and a SPIRE Server
    # API of its own, and what keeps two realms apart is the ADDRESS and not
    # the port: gRPC's path is the METHOD name, fixed by the Workload API
    # specification, so there is nowhere in the protocol for a realm segment
    # and the endpoint is the only thing a client has to name a tenant with.
    # Two realms therefore need two addresses on one container.
    #
    # `STS_EXTRA_IPS` is a space-separated list in CIDR form, added to the
    # interface that already carries the container's own address. The defaults
    # are the three after the static one below, so a stack brought up with no
    # variables at all can run four realms' SPIFFE at once.
    #
    # **IT NEEDS `NET_ADMIN`, AND THAT IS THE COST OF THIS FEATURE**: adding an
    # address to an interface is a privileged operation, and a container that
    # cannot do it says so on the way up and goes on to run everything else.
    # The failure is REPORTED and never fatal, for the reason every listener in
    # this service follows: a service that refused to start because one realm's
    # address could not be added would take every other protocol family down
    # with it.
    # -----------------------------------------------------------------------
    cap_add:
      - NET_ADMIN
    # THE SERVICE'S OWN ADDRESS, FIXED. A realm's `spiffe.grpcHost` is a
    # literal IP, so the addresses have to be the same on every start — a
    # compose-assigned one moves when the services come up in a different
    # order, and a realm would then be configured to bind an address this
    # container does not have.
    networks:
      default:
        ipv4_address: ${STS_ADDRESS:-172.29.0.10}
    command: >
      sh -c 'if [ ! -s /run/secrets/sts-kek ]; then
      head -c 32 /dev/urandom | base64 > /run/secrets/sts-kek;
      chmod 600 /run/secrets/sts-kek; fi;
      if [ ! -s /run/secrets/sts-admin-api-secret ]; then
      head -c 24 /dev/urandom | base64 | tr -d "/+=" | head -c 24
      > /run/secrets/sts-admin-api-secret;
      chmod 600 /run/secrets/sts-admin-api-secret; fi;
      if [ -z "$$ADMIN_API_CLIENT_SECRET" ]; then
      ADMIN_API_CLIENT_SECRET="$$(cat /run/secrets/sts-admin-api-secret)";
      export ADMIN_API_CLIENT_SECRET; fi;
      IFACE="$$(ip -o -4 route show to default | awk "{print \$$5}" | head -1)";
      for CIDR in $$STS_EXTRA_IPS; do
      if ip addr add "$$CIDR" dev "$$IFACE" 2>/dev/null; then
      echo "sts: added $$CIDR to $$IFACE for a realm SPIFFE listener";
      else
      echo "sts: COULD NOT add $$CIDR to $$IFACE — a realm configured to bind
      it will report that its listener did not come up. NET_ADMIN is what this
      needs; everything else in this service is unaffected."; fi; done;
      exec node server.js'
    build:
      # Repo root, and the default ./Dockerfile. The parent passes
      # `dockerfile: sts/Dockerfile` with a root context because its COPY paths
      # are repo-root-relative there; in this repo the Dockerfile copies the
      # whole context (`COPY . ./`, with .dockerignore deciding what is in it),
      # which is relative to this directory. That single COPY replaced the old
      # per-thing list on 2026-08-23, when the modules moved into subdirectories
      # and a per-DIRECTORY list acquired the same forget-one-silently failure
      # the old `COPY *.js` wildcard existed to avoid.
      context: .
      # THE BUILD'S IDENTITY, both optional and both empty by default.
      #
      # The Dockerfile stamps M.N.O into version.json at build time; these are
      # the two things it cannot work out for itself. GIT_COMMIT because
      # .dockerignore excludes .git, so there is no history in the context to
      # read a commit id out of — leave it and the version has no commit in its
      # provenance, which costs a tooltip. BUILD_NUMBER to replace the UTC build
      # instant with something a CI system chose, in which case keeping it
      # unique and increasing is that system's job.
      #
      # `${VAR:-}` rather than omitting them: an unset variable with no default
      # makes compose warn on every command, and an empty string is exactly what
      # the Dockerfile's ARG defaults to anyway.
      args:
        BUILD_NUMBER: "${BUILD_NUMBER:-}"
        GIT_COMMIT: "${GIT_COMMIT:-}"
        # THE EMBEDDED PROTOCOL DEBUGGER (2026-09-13): an image built by the
        # debugger project's embedded/Dockerfile. Empty selects the
        # Dockerfile's own empty stage, and the debugger then reports itself
        # not installed — see debugger/CLAUDE.md.
        DEBUGGER_IMAGE: "${DEBUGGER_IMAGE:-debugger-none}"
    # A published port rather than the parent's `network_mode: "host"`. Host
    # networking is what that stack needs and is Linux-only; publishing works on
    # Docker Desktop too, and nothing in this repo has to share a loopback with
    # anything else. The container port is fixed at 8081 because that is what the
    # Dockerfile EXPOSEs and what the service defaults to — to move the host side,
    # change the left number only; the STS derives its own did:web and every
    # published URL from the Host header of the request, so it does not need to be
    # told which address it was reached at.
    ports:
      - "${STS_HOST_PORT:-8081}:8081"
      # THE PLAIN-HTTP REVOCATION LISTENER (2026-09-13). Published because it
      # is the one listener whose entire purpose is to be reached from outside:
      # every certificate this service issues names it for its CRL, its OCSP
      # responder and its issuer's certificate (pki/pki_service.ts). The host
      # side is `STS_PKI_HOST_PORT` for the reason `STS_HOST_PORT` is, and the
      # SAME variable is handed to the service below as PKI_DISTRIBUTION_PORT,
      # so the address in a certificate is the address this mapping made.
      - "${STS_PKI_HOST_PORT:-8082}:8082"
      # The directory's two sockets are NOT published by default, and that is a
      # choice about collisions rather than about usefulness: 389 and 636 are the
      # assigned LDAP ports, so a host already running slapd — which is the host
      # most likely to want this — fails to start the stack with a port binding
      # error naming a service nobody was thinking about. Uncomment them, or map
      # them somewhere unprivileged (`"1389:389"`, `"1636:636"`), to point
      # `ldapsearch` or the parent project's api at the directory. The container
      # side stays 389 and 636: the service runs as root in the image and binds
      # them directly, and LDAP_PORT/LDAPS_PORT are for a run outside a container.
      # - "389:389"
      # - "636:636"
      # THE TLS ENDPOINT'S TWO PORTS WERE HERE UNTIL 2026-09-16, commented out
      # like the rest: 8443 asked for a client certificate and never refused
      # one, 9443 required it. Both listeners were deleted from the service, so
      # there is nothing to publish — the main port above asks every connection
      # for a client certificate and requires none, and GET /tls/sign-in signs
      # the holder of a verified one in. The LDAPS listener above still serves
      # the same certificate the main port does, so trusting this service is one
      # fetch of GET /tls/server-certificate whichever of them you use.
      # The embedded protocol debugger (debugger.port), unpublished by default
      # like the two above. It is ON in development mode when the image carries
      # the debugger's built tree; publish it to open it in a browser. The host
      # and container ports have to be the same number, because the debugger's
      # own sign-in sends the browser to this service's main port on the host
      # name it used.
      # - "8444:8444"
    # The database must be ACCEPTING CONNECTIONS, not merely started — see the
    # healthcheck above for what goes wrong otherwise. This was the first thing
    # in this file that needed compose format 2.4's `condition:`, which is also
    # the format the header at the top of this file explains keeping.
    depends_on:
      postgres:
        condition: service_healthy
      # AND THE SECRET STORE MUST BE SEEDED, not merely running (2026-09-12):
      # this service reads its key-encryption key and its database password out
      # of it before the listener binds, and a store with no secrets in it is a
      # service that will not start. Waiting on the SEEDER rather than on the
      # store is what makes that true — the store answers long before there is
      # anything in it.
      openbao-seed:
        condition: service_completed_successfully
    volumes:
      # WHAT THE SECRET STORE ISSUED THIS SERVICE (2026-09-12): the client
      # certificate it authenticates with, its key, and the CA that signs the
      # store's own listener. Read-only: this service presents them and never
      # writes them, and the identity they carry can read two values and
      # change nothing.
      - sts-bao-client:/run/secrets/bao:ro
      # WHERE THE ldif MODE WRITES. Mounted in postgres mode too, so that
      # switching between them is one environment variable — see the header.
      - sts-data:/usr/src/sts/data
      # ---------------------------------------------------------------------
      # THE KEY-ENCRYPTION KEY, which product mode cannot start without.
      #
      # Product mode keeps its signing keys across restarts by sealing them in
      # the store under a key this service NEVER generates and never writes
      # down — `common/secrets.js` reads it from a mounted file (the default)
      # or one of four cloud secret stores. A volume rather than a bind mount
      # so it is not a file in this repository: a key-encryption key in a
      # checkout is a key-encryption key in everybody's checkout.
      #
      # `docker compose down -v` removes it WITH the database, which is the
      # right pairing — the keys it opens go at the same moment, so the two can
      # never be out of step. `down` on its own keeps both, which is what makes
      # a restart keep every token it ever issued verifiable.
      # ---------------------------------------------------------------------
      - sts-secrets:/run/secrets
      # THE APPCONFIG FILES, bind-mounted from this repository so that editing
      # env/local.js on the host is all it takes. Read-only from the
      # container's side, and that is the point rather than caution: nothing in
      # this service writes to an appconfig file, and mounting it `ro` is what
      # makes that a property of the deployment instead of a promise in a
      # comment. Durable SETTING CHANGES go to the store instead, above these
      # files in the same five-layer order they always had.
      #
      # env/defaults.js is in here too and is GENERATED (`node
      # env/generate_defaults.js`). Editing it by hand is how it comes to
      # disagree with the table in common/config.js that generates it.
      - ./env:/usr/src/sts/env:ro
    environment:
      # The appconfig layer. It was chosen for its log level, and since
      # 2026-09-12 every file in env/ is at `info` — every function logs its
      # entry and exit at debug, so a debug stack writes all of it.
      # STS_LOG_LEVEL=debug asks for the whole record.
      - CONFIG_FILE=${CONFIG_FILE:-./env/local.js}
      # The service's own bunyan level, passed through ONLY when the host
      # environment has it — see the note about the empty value in the
      # header. Unset means the appconfig file decides, and that is `info`
      # since 2026-09-12; `debug` is every request, every artifact before
      # and after signing, and every function's entry and exit.
      - STS_LOG_LEVEL
      # ---------------------------------------------------------------------
      # TLS ON THE MAIN PORT (2026-08-30). Until then this stack was the one
      # place in this ecosystem where the mock answered 8081 over plain HTTP:
      # `global.https` is derived from `oauth2.rfc9700`, which env/local.js
      # sets to false, and the parent project's three compose files each set
      # STS_HTTPS=true while this one — the repository's own — never did. So a
      # caller who trusted this service's certificate for 8443, 9443 and LDAPS
      # 636 still met an unencrypted fourth listener, on the port every HTTP
      # protocol family actually answers on. (The first two of
      # those listeners were deleted on 2026-09-16; that port is now also where
      # a client certificate arrives, which makes the argument stronger.)
      #
      # It is a SUBSTITUTION and not a bare `STS_HTTPS=true`, so
      # `STS_HTTPS=false docker compose up` is the way back to a plain port for
      # a client that cannot be taught to trust a certificate regenerated on
      # every start. env/local.js carries `global.https: true` as well and the
      # two agree on purpose: the file is what a bare `node server.js` reads,
      # this is what the HEALTHCHECK below reads, and a container whose probe
      # spoke the wrong scheme would go `unhealthy` while answering every
      # request perfectly.
      #
      # NOT `STS_OAUTH2_RFC9700`, which would also do it: that one turns on the
      # BCP's refusals as well, and this stack is the permissive mock.
      #
      # THE FIRST FETCH OF THE CERTIFICATE IS UNVERIFIED, necessarily — there
      # is no plain listener left in the process and the key does not exist
      # until this container starts:
      #
      #   curl -k https://localhost:8081/tls/server-certificate
      # ---------------------------------------------------------------------
      - STS_HTTPS=${STS_HTTPS:-true}
      # ---------------------------------------------------------------------
      # WHERE A CERTIFICATE SAYS ITS CRL AND OCSP RESPONDER ARE (2026-09-13).
      #
      # Every certificate this service issues names its revocation list, its
      # OCSP responder and its issuer's certificate BY URL, and those URLs are
      # fetched from OUTSIDE this container. They name the plain-HTTP
      # revocation listener, on 8082 in here; the host may publish it anywhere
      # (`STS_PKI_HOST_PORT`, below), and nothing inside the container can see
      # the host side of that mapping. So the service is TOLD the published
      # port — without it, a stack published on 18081 issued certificates
      # naming `https://localhost:8081/pki/…`, which answered nothing from
      # where a relying party read it.
      #
      # `PKI_DISTRIBUTION_BASE_URL` wins over it where a stack is reached by a
      # name rather than by localhost — docker-compose-run-tests.yml sets it to
      # the container name its runner dials — and it is passed through here
      # empty so a caller of this file can say the same.
      # ---------------------------------------------------------------------
      - PKI_DISTRIBUTION_PORT=${STS_PKI_HOST_PORT:-8082}
      - PKI_DISTRIBUTION_BASE_URL=${PKI_DISTRIBUTION_BASE_URL:-}
      - PKI_DISTRIBUTION_LDAP_HOST=${PKI_DISTRIBUTION_LDAP_HOST:-}
      # ---------------------------------------------------------------------
      # PERSISTENCE. The directory, the trust realms and the runtime setting
      # changes survive `docker compose down` and come back on the next `up`,
      # and in product mode on postgres (this file's default) so do the sealed
      # signing keys and what this service minted — see the header.
      #
      # `docker compose down -v` removes the volumes and is therefore the way
      # to start clean; plain `down` keeps them.
      #
      # FOR ldif MODE INSTEAD — no database at all, one RFC 2849 file per realm
      # in the data volume, and the postgres service above becomes unnecessary:
      #   - STS_PERSISTENCE_MODE=ldif
      # and drop STS_DATABASE_URL. Or set it to `memory` for the behaviour this
      # service had before 2026-08-27, which is still the default when nothing
      # says otherwise.
      # ---------------------------------------------------------------------
      - STS_PERSISTENCE_MODE=${STS_PERSISTENCE_MODE:-postgres}
      # ---------------------------------------------------------------------
      # THE DEFAULT STACK IS DISPATCH + PRODUCT SINCE 2026-09-09, and that is a
      # reversal worth stating: this file used to bring up the service "as it
      # always was" — one process, development mode — on the argument that a
      # plain `docker compose up` should be the simplest thing.
      #
      # It is the wrong default for the one thing this stack is FOR. Every
      # other way of running this service exists to be experimented with; the
      # compose stack is the only one that looks like a deployment, so it
      # should be the closest thing here to one. That means:
      #
      #   product mode      signing keys that SURVIVE A RESTART, sealed under a
      #                     key-encryption key this service never generates —
      #                     and every credential the console, SCIM and the
      #                     management API ask for actually CHECKED, where
      #                     development mode takes it on trust.
      #   request workers   the handlers off the thread that owns every socket,
      #                     which is the only configuration where a slow
      #                     signature does not stop the KDC answering.
      #   coordination      because three workers against one store are three
      #                     processes, and the change log is what makes them
      #                     one service.
      #
      # EVERY ONE IS STILL OVERRIDABLE. `STS_MODE=development docker compose up`
      # is the old behaviour exactly, and `tests/tools/modes.sh` overrides all
      # of them per mode, which is why the matrix still runs `memory` and
      # `postgres` against this same file.
      # ---------------------------------------------------------------------
      - STS_MODE=${STS_MODE:-product}
      - STS_PERSISTENCE_COORDINATE=${STS_PERSISTENCE_COORDINATE:-true}
      - STS_WORKERS_REQUEST_COUNT=${STS_WORKERS_REQUEST_COUNT:-3}
      # The console and the portal on workers of their own, so that neither
      # queues behind protocol traffic. It needs read-your-write, which the
      # line below turns on — see common/request_pool.js's surfacePoolProblem().
      # TWO since 2026-09-13 (it was one): with one, a console page walking the
      # directory held the only worker every portal page and every console
      # sign-in callback was waiting on, and a worker that died left both
      # surfaces on the protocol pool until it was re-forked. Each is a whole
      # copy of the service, so raise it with the memory to match.
      - STS_WORKERS_SURFACE_COUNT=${STS_WORKERS_SURFACE_COUNT:-2}
      - STS_WORKERS_DISPATCH=${STS_WORKERS_DISPATCH:-*}
      - STS_WORKERS_FANOUT=${STS_WORKERS_FANOUT:-/scim,/xacml,/admin-api}
      - STS_WORKERS_READ_YOUR_WRITE=${STS_WORKERS_READ_YOUR_WRITE:-true}
      # ---------------------------------------------------------------------
      # THE MANAGEMENT API'S CLIENT SECRET, AND IT IS NOT OPTIONAL IN PRODUCT
      # MODE (2026-09-09).
      #
      # `/admin-api` requires an OAuth 2.0 access token, minted by the seeded
      # `sts-management-api` client. That client's secret is generated at every
      # start unless this pins it — and it is readable only THROUGH the API it
      # unlocks, so a stack that does not set it has an administrative surface
      # nobody can obtain a token for. In DEVELOPMENT mode the token endpoint
      # does not verify a client secret at all, which is why the omission is
      # survivable there and fatal here.
      #
      # **IT WAS MISSING FROM THIS FILE FOR THE FIRST DAY OF THAT FEATURE AND
      # NOTHING FAILED.** The launchers were already generating one per run and
      # putting it in compose's environment; with no line here compose dropped
      # it, the service minted its own, and every test still passed — because
      # development mode ignores the secret. It would have failed the moment
      # anybody ran this stack in product mode, which is now the default.
      #
      # BARE, so that an unset variable leaves the setting alone rather than
      # setting it to the empty string. See STS_LOG_LEVEL above for what the
      # `=${VAR:-}` form costs.
      - ADMIN_API_CLIENT_SECRET
      # The other two halves of the same surface, forwarded for a deployment
      # that pins an audience or turns the requirement off. Bare for the same
      # reason: unset must mean "the default", not "the empty string".
      - ADMIN_API_AUTH_REQUIRED
      - ADMIN_API_AUDIENCE
      # `sslmode=require` IS IN THE DEFAULT, and it is the client half of the
      # `hostssl` rules the database now enforces. Both ends say it: the server
      # refuses a plaintext connection and the client refuses to make one, so
      # neither can be quietly relaxed without the other noticing.
      #
      # `require` and not `verify-full`, and the reason is the certificate:
      # it is generated in the container on first start and signed by nobody,
      # so there is no anchor for a client to verify it against. `require`
      # encrypts the connection and does not authenticate the server, which is
      # the honest description of a self-signed pair — and it is what
      # STS_DATABASE_TLS_REJECT_UNAUTHORIZED below says out loud rather than
      # leaves to be discovered.
      #
      # **THE USER IN IT IS `sts_app` AND NOT `sts` SINCE 2026-09-06**, and
      # that is the whole of the least-privilege change: `sts` owns the schema
      # and can change it, `sts_app` can only read and write the rows in it.
      # The pair is created by postgres/schema.sql, which the database
      # container runs once through postgres/apply-schema.sh — see the postgres
      # service above, and note that an OLD VOLUME has no such role.
      # ---------------------------------------------------------------------
      # **NO PASSWORD IN THIS STRING SINCE 2026-09-12**, and that is the point
      # of the OpenBao service above. It carries the user, the host and the
      # database; the password is read from the secret store at startup and
      # injected into it by `persistence.js`. `docker compose config` no longer
      # prints a database credential, and neither does /admin/config.
      #
      # `STS_DATABASE_URL` in the environment still wins whole — a deployment
      # pointing at its own database writes its own string, with or without a
      # password in it, and `persistence.databasePasswordProvider` decides
      # whether anything replaces it.
      # ---------------------------------------------------------------------
      - STS_DATABASE_URL=${STS_DATABASE_URL:-postgres://sts_app@postgres:5432/sts?sslmode=require}
      # ---------------------------------------------------------------------
      # BOTH SECRETS COME FROM THE STORE (2026-09-12), AND THE SERVICE PROVES
      # WHO IT IS WITH A CERTIFICATE THE STORE ISSUED IT.
      #
      # The key-encryption key and the database password live in ONE secret at
      # `secret/sts`, told apart by their field names — which is the shape
      # `common/secrets.js` supports for every provider, and the reason the
      # database password's own location row is left empty here.
      #
      # **THE IDENTITY IS READ-ONLY ON THOSE TWO VALUES AND ON NOTHING ELSE**,
      # which is `openbao/read-only.hcl`: this service cannot rotate the key it
      # sealed its signing keys under, cannot change the database password and
      # cannot plant a key of its own. A vendored job asserts the refusal
      # rather than trusting the policy file to be right.
      # ---------------------------------------------------------------------
      - STS_KEYS_KEK_PROVIDER=${STS_KEYS_KEK_PROVIDER:-vault}
      - STS_KEYS_KEK_VAULT=${STS_KEYS_KEK_VAULT:-https://openbao:8200}
      - STS_KEYS_KEK_REF=${STS_KEYS_KEK_REF:-secret/data/sts}
      - STS_KEYS_KEK_FIELD=${STS_KEYS_KEK_FIELD:-kek}
      - STS_KEYS_VAULT_CLIENT_CERT=${STS_KEYS_VAULT_CLIENT_CERT:-/run/secrets/bao/client.crt}
      - STS_KEYS_VAULT_CLIENT_KEY=${STS_KEYS_VAULT_CLIENT_KEY:-/run/secrets/bao/client.key}
      - STS_KEYS_VAULT_CA_CERT=${STS_KEYS_VAULT_CA_CERT:-/run/secrets/bao/bao-ca.crt}
      # THE ADDRESSES A REALM'S SPIFFE LISTENERS MAY BIND. See `cap_add` and
      # the `command` above: these are added to the container's own interface
      # on the way up, so `spiffe.grpcHost` on a realm may name any of them.
      # Three, because two realms with SPIFFE on is the case worth being able
      # to run and a third is what shows the arrangement generalises; the
      # service's own address is the static one above and is the DEFAULT
      # realm's.
      # AND THE DEFAULT REALM BINDS THIS CONTAINER'S OWN ADDRESS RATHER THAN
      # THE WILDCARD (2026-09-12). `spiffe.grpcHost` defaults to 0.0.0.0,
      # which is EVERY address on the machine — so the default realm's
      # Workload API port would be taken on all three addresses above and
      # a realm given one of them fails to bind with `EADDRINUSE` on an
      # address nothing appears to be using. Measured, and then fixed in
      # two places: `spiffe_server.js` recognises the wildcard and names
      # the realm holding it, and this line stops it happening.
      - STS_SPIFFE_GRPC_HOST=${STS_SPIFFE_GRPC_HOST:-172.29.0.10}
      - STS_EXTRA_IPS=${STS_EXTRA_IPS:-172.29.0.11/24 172.29.0.12/24 172.29.0.13/24}
      - STS_DATABASE_PASSWORD_PROVIDER=${STS_DATABASE_PASSWORD_PROVIDER:-vault}
      - STS_DATABASE_PASSWORD_FIELD=${STS_DATABASE_PASSWORD_FIELD:-databasePassword}
      # WHETHER THE KEYSTORE IS ON AT ALL, and it is BARE for the reason
      # ADMIN_API_CLIENT_SECRET above is: unset must mean *the default for this
      # mode* rather than the empty string. Product mode — this file's default
      # — persists its keys and therefore reads the key-encryption key from the
      # store above. `tests/tools/modes.sh` sets it to `persisted` for the
      # DISPATCH mode, which runs in development mode and would otherwise
      # generate a key per start and never dial the store at all.
      #
      # **WITHOUT THIS LINE THE VARIABLE NEVER REACHES THE CONTAINER**, which
      # is how the first dispatch run came up with the database password out of
      # the store and an ephemeral key-encryption key: compose passes what it
      # is told to pass, and a value the launcher exports is not one of them.
      - STS_KEYS_SOURCE
      # Where ldif mode would write. Set even in postgres mode so that the
      # volume above has a meaning and switching modes changes one line.
      - STS_PERSISTENCE_DATA_DIR=/usr/src/sts/data
      # The base URL the BROWSER uses for the wallet, not one this container
      # dials. The Credential Offer and presentation pages hand the End-User back
      # by appending /vc-issuance-1.html or /vc-presentation-1.html to it, so its
      # default of http://localhost:3000 is right when the wallet runs on the
      # host, and wrong in a way that looks like an unrelated timeout otherwise
      # (the URL still contains the wallet page, so a urlContains wait passes).
      # Uncomment and set it if the wallet is somewhere else.
      # - OID4VCI_WALLET_URL=http://localhost:3000
    # Liveness only — /healthcheck answers 200 and a JSON message. The probe is
    # the parent project's verbatim: `node -e` rather than the curl the image also
    # has, because it depends on nothing but the runtime the service already needs
    # and it fails on a non-200 instead of merely on a closed port. It matters
    # more than it looks: this service is a shell — server.js only requires the
    # other modules and listens — so a module missing from the image is not a
    # lost feature but a MODULE_NOT_FOUND before anything listens.
    #
    # IT PICKS ITS OWN SCHEME, and that is not defensiveness. STS_HTTPS — and
    # STS_OAUTH2_RFC9700 or STS_OAUTH2_OAUTH21, either of which is its default
    # — turn 8081 into an HTTPS
    # listener, and a probe that spoke http at it would fail on every poll: the
    # container would go `unhealthy` while the service answered every request
    # perfectly, which is the worst shape a healthcheck failure can take. The
    # certificate is issued by this service's own Root, which nothing in the
    # container is given as an anchor (and which development mode regenerates on
    # every start), so verification is off for the same reason a first
    # `curl -k` is needed: there is nothing to verify against until somebody
    # fetches it. This probe asks whether the
    # process is alive, not whether its certificate is trustworthy.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"var tls=process.env.STS_HTTPS==='true'||(process.env.STS_HTTPS===undefined&&(process.env.STS_OAUTH2_RFC9700==='true'||process.env.STS_OAUTH2_OAUTH21==='true'));var m=tls?require('https'):require('http');m.get({host:'localhost',port:8081,path:'/healthcheck',rejectUnauthorized:false},function(r){process.exit(r.statusCode===200?0:1)}).on('error',function(){process.exit(1)})\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -------------------------------------------------------------------------
  # THE REMOTE POLICY ENFORCEMENT POINT (phase five).
  #
  # A SECOND PROCESS THAT HOLDS ITS OWN COPY OF THE XACML ENGINE, pulls the
  # policy repository from the sts above and decides locally. That is the point
  # of it: a PEP that asked the PDP per request would be POST /xacml/pdp with a
  # network hop in front of every access decision.
  #
  #   curl http://localhost:9090/                        what it holds
  #   curl "http://localhost:9090/protected?subject=alice&employeeType=staff"
  #
  # IT IS `profiles: [xacml]`, SO A PLAIN `docker compose up` DOES NOT START
  # IT. That is deliberate and it is the same judgement the postgres service
  # makes the other way: the mock is many protocol families and a remote PEP
  # is one demonstration inside one of them, so it is opt-in
  # (`docker compose --profile xacml up`) rather than a container everybody
  # pays for.
  #
  # **FROM 2026-09-06 `./local-run-tests.sh` ASKED FOR THAT PROFILE BY NAME**,
  # which the paragraph above used to say it never did, until that launcher
  # was removed on 2026-09-16 (docker-compose-run-tests.yml has an `xacml-pep`
  # service of its own). The suite has a job that drives a REMOTE PEP end to
  # end — registration, the pull, a policy
  # deployed at the PAP changing what this container allows, the nudge arriving
  # over the bridge — and none of it is assertable without a second container
  # on this network. The launcher overrode the four variables below that
  # mattered to it (`XACML_PEP_PDP_URL` names the throwaway realm that job owns,
  # `XACML_PEP_HOST_PORT` is a free port rather than 9090, and the two
  # intervals are shortened) and tore the whole project down afterwards. A
  # PLAIN `docker compose up` IS UNAFFECTED: without `--profile xacml` this
  # service does not start, exactly as before.
  #
  # WHAT IT DEMONSTRATES THAT THE EMBEDDED PEP AT /xacml/protected CANNOT: this
  # one can be STALE, can hold a policy the PDP no longer has, and can go on
  # enforcing while the PDP is down. Stop the sts container and watch
  # http://localhost:9090/protected go on deciding correctly — that is the
  # trade the design takes, and the alternative (a PDP outage denying
  # everything everywhere) is the failure that makes people remove
  # authorization services.
  # -------------------------------------------------------------------------
  xacml-pep:
    container_name: ${XACML_PEP_CONTAINER_NAME:-xacml-pep}
    hostname: xacml-pep
    profiles: ["xacml"]
    # Scoped per run like STS_IMAGE above, and for its reason.
    image: ${XACML_PEP_IMAGE:-rcbj/xacml-pep}
    build:
      # THE REPOSITORY ROOT, because the Dockerfile copies the seven engine
      # modules out of xacml/ at build time — there is one copy of the
      # evaluator in this tree and this image cannot drift from it. That file
      # argues why a checked-in copy and an npm package were both refused.
      context: .
      dockerfile: xacml-pep/Dockerfile
      # THE BUILD'S IDENTITY, exactly as the sts service above takes it. Pass
      # the SAME BUILD_NUMBER to both to say the PDP and this PEP are one
      # release; leave them and each image gets the instant it was built, which
      # is two different numbers for two artifacts and is the honest default.
      args:
        BUILD_NUMBER: "${BUILD_NUMBER:-}"
        GIT_COMMIT: "${GIT_COMMIT:-}"
    ports:
      - "${XACML_PEP_HOST_PORT:-9090}:9090"
      # THE HTTPS LISTENER (2026-09-13), which answers nothing until a pair is
      # written where PEP_HTTPS_CERT and PEP_HTTPS_KEY below point. Published
      # on 9444 rather than 9443 by default. That was because 9443 was the
      # mock's own mutual-TLS listener, which a reader of the sts service above
      # may have uncommented; that listener was deleted on 2026-09-16 and the
      # collision is gone, but the default stays 9444 because it is in every
      # launcher, every kept stack and XACML_PEP_HTTPS_URL. The container side
      # is still 9443, which is this PEP's port and never was the mock's.
      - "${XACML_PEP_HTTPS_HOST_PORT:-9444}:9443"
    volumes:
      # WHERE A LAUNCHER PUTS THE CLIENT CREDENTIAL. It defaults to this
      # directory — which exists, contains no key, and mounts harmlessly — so
      # that a plain `docker compose --profile xacml up` needs no file and no
      # variable. A launcher sets XACML_PEP_CERT_DIR to a directory it wrote
      # pep.crt and pep.key into and names them with the two variables below.
      - ${XACML_PEP_CERT_DIR:-./xacml-pep/common}:/certs:ro
    depends_on:
      sts:
        condition: service_healthy
    environment:
      # By compose DNS, on the private bridge, so this never depends on a host
      # port mapping.
      - PEP_PDP_URL=${XACML_PEP_PDP_URL:-https://sts:8081}
      # NO PEP_TLS_CERT, so this PEP registers UNAUTHENTICATED and the mock
      # refuses it unless xacml.pepRequireCertificate is off. That is the
      # honest default rather than a broken one: generating a client
      # certificate here would mean either committing a private key to this
      # repository — which postgres/generate-tls.sh exists specifically to
      # avoid — or a first-start script for a demonstration container. Mount a
      # pair and name it to see the authenticated path:
      #
      #   volumes:
      #     - ./my-pep-certs:/certs:ro
      #   environment:
      #     - PEP_TLS_CERT=/certs/pep.crt
      #     - PEP_TLS_KEY=/certs/pep.key
      #
      # EITHER WAY IT REGISTERS OR IT DOES NOT; the ability to DECIDE is a
      # different question and the answer changed on 2026-09-06. Registering
      # still buys only a row on /admin/xacml/peps and an address for the
      # nudge — but GET /xacml/pep/policies now requires a VERIFIED client
      # certificate whose subject holds the built-in REMOTE_PEPS role, so a
      # container with no certificate pulls nothing, holds nothing, and
      # answers NotApplicable to everything with the bias deciding. Mount one
      # (below) or turn xacml.enforceAccess off on the mock.
      - PEP_NAME=${XACML_PEP_NAME:-pep-1}
      # THE CLIENT CERTIFICATE, WHEN SOMEBODY MOUNTED ONE (2026-09-06). The
      # three /xacml/pep endpoints are gated now: a PEP is admitted by a
      # certificate this service VERIFIES, whose subject resolves to a
      # directory entry in the group named by roles.remotePepGroup. Nothing in
      # this image or in the mock provides that certificate — a launcher makes
      # one with tests/tools/pep-credential.js, POSTs the issuing CA to
      # /tls/trust, and mounts it here. Unset, these two are empty and this
      # container registers as nothing and is refused, which is the honest
      # default and says so on /admin/xacml/peps.
      - PEP_TLS_CERT=${XACML_PEP_TLS_CERT:-}
      - PEP_TLS_KEY=${XACML_PEP_TLS_KEY:-}
      # THE HTTPS LISTENER'S PAIR (2026-09-13), which is a different thing from
      # the client certificate above and comes from a different place: the
      # realm this PEP REGISTERED to issues it, from its Remote PEP listeners
      # Issuing CA, to a PEP that has already registered —
      #
      #   curl -sk -H "Authorization: Bearer $TOKEN" \
      #     -H 'Content-Type: application/json' -d '{"name":"<pep name>"}' \
      #     https://localhost:8081/realm/<realm>/admin-api/xacml/issue-pep-certificate \
      #   | tee >(jq -r .fullChainPem > certs/server/pep-server.crt) \
      #   | jq -r .privateKeyPem > certs/server/pep-server.key
      #
      # — so the files normally do NOT exist when this container starts, and
      # the PEP re-reads these two paths until they do. EMPTY BY DEFAULT: the
      # default mount above is xacml-pep/common in this checkout, and a
      # default pointing into it would invite writing a private key into the
      # source tree. A launcher points them at a directory of its own.
      - PEP_HTTPS_CERT=${XACML_PEP_HTTPS_CERT:-}
      - PEP_HTTPS_KEY=${XACML_PEP_HTTPS_KEY:-}
      - PEP_HTTPS_PORT=9443
      - PEP_HTTPS_RELOAD_INTERVAL_MS=${XACML_PEP_HTTPS_RELOAD_INTERVAL_MS:-5000}
      # The mock's certificate is issued by its own Root, which this container
      # is not given — and development mode regenerates both on every start —
      # so there is no anchor to verify against. `pep.js` logs this on every
      # start rather than once, for federation_http.ts's reason: a
      # certificate check turned off months ago and forgotten is the worst
      # kind of leftover.
      - PEP_TLS_INSECURE=true
      # THE MOCK REFUSES TO DIAL THIS BY DEFAULT and that is the design
      # demonstrating itself rather than a misconfiguration: it is plain
      # http, and xacml.pepNotifyAllowHttp is off. So on a plain
      # `--profile xacml up` no nudge is ever delivered, the PDP says why on
      # the PEP's row at /admin/xacml/peps, and the PEP converges on its
      # fifteen-second poll anyway — which is the whole claim the nudge is
      # affordable under. Set STS_XACML_PEP_NOTIFY_ALLOW_HTTP=true on the
      # sts service to watch a change reach this container in under a second
      # instead — in development mode only: product refuses a plain-http
      # nudge whatever that says (#171).
      - PEP_NOTIFY_URL=${XACML_PEP_NOTIFY_URL:-http://xacml-pep:9090/notify}
      - PEP_RESOURCE=${XACML_PEP_RESOURCE:-https://xacml-pep/protected}
      - PEP_BIAS=${XACML_PEP_BIAS:-deny-biased}
      # THE REMOTE POLICY INFORMATION POINT (2026-09-06). On by default:
      # this PEP resolves designators the request did not carry against
      # the mock's embedded directory, through POST /xacml/pip, in one
      # batched query before each evaluation — so a policy reading
      # employeeType off a person's entry decides HERE the way it decides
      # at the PDP. Set it false to watch the old behaviour, where every
      # attribute has to be asserted in the request and the two
      # enforcement points legitimately disagree. A container with no
      # PEP_TLS_CERT reaches that state anyway, because the endpoint
      # requires a verified certificate holding REMOTE_PEPS.
      - PEP_PIP=${XACML_PEP_PIP:-true}
      - PEP_POLL_INTERVAL_MS=${XACML_PEP_POLL_INTERVAL_MS:-15000}
      # OVERRIDABLE SINCE 2026-09-06 BECAUSE THE SUITE OVERRIDES IT.
      # ./local-run-tests.sh brought this service up as part of its stack
      # (until 2026-09-16) and tests/vendored/sts_xacml_remote_pep.js reads
      # the counters this beat carries off /admin-api/xacml/peps — at the
      # shipped sixty seconds that job would spend a minute waiting for a
      # number. A demonstration container still beats once a minute.
      - PEP_HEARTBEAT_INTERVAL_MS=${XACML_PEP_HEARTBEAT_INTERVAL_MS:-60000}
      - PEP_LOG_LEVEL=${XACML_PEP_LOG_LEVEL:-info}

# ---------------------------------------------------------------------------
# NAMED VOLUMES (listed at the bottom of the file). Every one survives
# `docker compose down` and is removed by `docker compose down -v`, which is
# the difference somebody wants to know before running either.
#
# There is no volume for the appconfig files: those are a BIND MOUNT of ./env
# in this repository, because the point of them is that a person edits them
# with an editor. The header at the top argues the split.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# THE NETWORK, AND WHY THIS FILE NAMES ONE AT ALL (2026-09-12).
#
# Compose makes a bridge network per project without being asked, and that was
# enough for as long as every service in this stack was reached by NAME. It
# stopped being enough when a realm's SPIFFE listeners needed an ADDRESS of
# their own: `spiffe.grpcHost` on a realm is a literal IP, so something has to
# decide which addresses exist and they have to be the same on every start.
#
# So: a subnet this file chooses, a static address for the service, and three
# more the container adds to its own interface on the way up (see
# `STS_EXTRA_IPS` on the sts service). A realm turned on with
# `spiffe.grpcHost=172.29.0.11` is then reachable at that address from
# anything else on this network — which is where the test runner lives when
# the suite runs in a container, and is why the realm ports are NOT published
# to the host: a published port maps to ONE container address, so publishing
# would answer for one realm and silently not for the others.
#
# THE SUBNET IS DELIBERATELY UNUSUAL. 172.29/16 is inside the private range
# docker allocates from, so a machine that already has several compose stacks
# is unlikely to be using it — and if it is, `STS_NETWORK_SUBNET` and the four
# address variables move the whole arrangement in one place.
#
# **A LITERAL IS NOT ENOUGH FOR TWO RUNS IN THIS TREE, AND THIS FILE SAID IT
# WAS FOR A DAY (2026-09-12).** A network is MACHINE-WIDE in exactly the way a
# `container_name` is, so the second run — however its compose project was
# named — asked for the address space the first was holding and was refused
# with `invalid pool request: Pool overlaps with other one on this address
# space` before a container started. Both launchers scan for a free /24 now
# and name all four variables; the default below is the first candidate the
# scan offers, so a plain `docker compose up` here is unchanged and a run on
# an idle machine takes exactly these addresses. See freeSubnet() in
# tests/tools/compose.sh, and tests/stack_network.js, which pins it.
# ---------------------------------------------------------------------------
networks:
  default:
    ipam:
      config:
        - subnet: ${STS_NETWORK_SUBNET:-172.29.0.0/24}

volumes:
  # THE SECRET STORE'S OWN STORAGE (2026-09-12): its raft data, the TLS pair
  # `openbao-tls` mints for its listener, and the root token the seeder keeps
  # so that a restarted stack can still be reconfigured. `down --volumes`
  # throws all of it away, which also throws away the key-encryption key — and
  # the postgres volume goes at the same moment, so what was sealed under it
  # goes too. That is the pair to keep together.
  sts-bao-file:
  # WHAT THE STORE ISSUED TO THIS SERVICE: the client certificate, its key and
  # the listener's CA. Written by the seeder, mounted read-only into the
  # service. It is a volume rather than a bind mount for `sts-secrets`' reason:
  # a credential in a checkout is a credential in everybody's checkout.
  sts-bao-client:
  # PostgreSQL's own data directory. This is where the embedded LDAP directory,
  # the trust realm registry and the durable setting changes actually live when
  # persistence.mode is postgres.
  sts-db:
  # /usr/src/sts/data inside the STS container: where persistence.mode=ldif
  # writes realm-<id>.ldif, realms.json and appconfig.json. Empty in postgres
  # mode, and mounted anyway so that switching modes is one environment
  # variable.
  sts-data:
  # /run/secrets inside the STS container: the key-encryption key product mode
  # seals its signing keys with, generated on the first start that finds none
  # and kept until `down -v`. See the `command` on the sts service.
  sts-secrets:
