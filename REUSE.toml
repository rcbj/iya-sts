#
# Copyright and licensing of every file in this repository, in the format of
# the REUSE specification 3.2 (https://reuse.software/spec-3.2/).
#
# Source files this repository owns carry the two SPDX lines in their own
# header, and tests/copyright_notices.js fails when one does not. This file
# covers what cannot carry a comment (JSON, Markdown, XML, data, images),
# the vendored copies that may not be edited here, and the third-party
# material. When several annotations match a file, the LAST one wins, so the
# catch-all is first and every third-party path comes after it.
#
# LICENSE.md says where each third-party item came from.

version = 1

# Third-party CRATES are not files in this tree, so they take no annotation
# here (and one naming a path that does not exist fails
# tests/copyright_notices.js). rust/Cargo.lock pins them; LICENSE.md, *Runtime
# dependencies in the remote PEP image*, names oidc-caep-risc 0.3.0 (MIT,
# crates.io), the reverse proxy's relying party (#1760).

# Everything this project wrote: the Business Source License 1.1 since
# 2026-09-30 (LICENSE.md; what was published before that stays MIT).
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Iya CyberSecurity Solutions, LLC"
SPDX-License-Identifier = "BUSL-1.1"

# The byte-identical copies of the parent project's protocol jobs, which
# have the same owner, keep the parent project's MIT licence, and may not be
# edited here to carry a header. "closest" lets a file's own header win, so
# the local: true jobs in tests/protocol/ stay under the licence their header
# names. common/crypto_impl/ and the eight Kerberos codec modules left this
# list in #1280 (bbs2023.js in #663, pqc.js, pqc_x509.js and xmldsig.js in
# #363): they are this service's own and carry its header.
[[annotations]]
path = [
  "tests/protocol/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Iya CyberSecurity Solutions, LLC"
SPDX-License-Identifier = "MIT"

# The OAuth wire snapshot moved beside its protocol job (#444's D12) is this
# service's own record, not a protocol job's copy: it keeps the BSL it had in
# tests/. A JSON file carries no header, so it is declared here, after the
# block above, which it would otherwise fall under.
[[annotations]]
path = [
  "tests/protocol/oauth_model_wire.snapshot.json",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Iya CyberSecurity Solutions, LLC"
SPDX-License-Identifier = "BUSL-1.1"

# The id-proto-debugger user guides under docs/v1.2.0/debugger/, copied from
# that project's release 0.9.5 (#1717): the same owner, and that project's
# MIT licence, like the protocol jobs above. The chapter's own two pages,
# docs/v1.2.0/debugger/index.md and access.md, are this service's and stay
# BUSL-1.1 under the catch-all. The frozen docs/v1.1.0/debugger/ chapter is
# the same text as 1.1.0 published it, when saml.md and wstrust.md were
# still single pages; its index.md and access.md stay BUSL-1.1 too.
# docs/v1.0.0/ (main at 7907e7e86) has no debugger chapter, so nothing in
# it needs a line here.
[[annotations]]
path = [
  "docs/v1.2.0/debugger/oauth2-oidc/**",
  "docs/v1.2.0/debugger/what-is-a-protocol-debugger.md",
  "docs/v1.2.0/debugger/saml/**",
  "docs/v1.2.0/debugger/saml-assertion.md",
  "docs/v1.2.0/debugger/saml-decoders.md",
  "docs/v1.2.0/debugger/wstrust/**",
  "docs/v1.2.0/debugger/jwt-tools.md",
  "docs/v1.2.0/debugger/digital-signature.md",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Iya CyberSecurity Solutions, LLC"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
  "docs/v1.1.0/debugger/oauth2-oidc/**",
  "docs/v1.1.0/debugger/what-is-a-protocol-debugger.md",
  "docs/v1.1.0/debugger/saml.md",
  "docs/v1.1.0/debugger/saml-assertion.md",
  "docs/v1.1.0/debugger/saml-decoders.md",
  "docs/v1.1.0/debugger/wstrust.md",
  "docs/v1.1.0/debugger/jwt-tools.md",
  "docs/v1.1.0/debugger/digital-signature.md",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Iya CyberSecurity Solutions, LLC"
SPDX-License-Identifier = "MIT"

# The OASIS XACML conformance suite, as adapted by AT&T and then AuthzForce
# (OW2). Apache-2.0. xacml/conformance/PROVENANCE.md is the record.
[[annotations]]
path = [
  "xacml/conformance/mandatory/**",
  "xacml/conformance/optional/**",
  "xacml/conformance/unsupported/**",
  "xacml/conformance/ConformanceTests.html",
  "xacml/conformance/UPSTREAM-README.md",
  "xacml/conformance/LICENSE",
]
precedence = "override"
SPDX-FileCopyrightText = [
  "2014 AT&T Intellectual Property",
  "AuthzForce contributors (OW2)",
]
SPDX-License-Identifier = "Apache-2.0"

# The embedded PEP corpus (#2024): every iya-pep-<lang> package's engine is
# held to it, and those packages are MIT. Its cases are converted from the
# OASIS suite above and stay Apache-2.0 (a modified form: the request
# converted, the expected answer the reference engine's); its manifest, the
# copy of xacml-pep/enforcement_cases.json and its README are MIT.
# xacml/pep-corpus/README.md says so.
[[annotations]]
path = "xacml/pep-corpus/oasis/**"
precedence = "override"
SPDX-FileCopyrightText = [
  "2014 AT&T Intellectual Property",
  "AuthzForce contributors (OW2)",
  "2026 Iya CyberSecurity Solutions, LLC",
]
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
